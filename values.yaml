# chart-base values.
# Every key below is public API: renaming or removing one is a breaking change.
# Reserved keys (not set here, accepted by the schema):
#   global  - injected by Helm into every alias; ignored by chart-base
#   enabled - used by umbrellas as `condition: <alias>.enabled`

workload:
  # -- Workload kind: `deployment` (API or worker), `cronjob`, or `job` (a Helm hook, see `job.phase`).
  type: deployment

image:
  # -- Required. Image repository, e.g. `ghcr.io/acme/sales`.
  repository: ""
  # -- Image tag. Required unless `image.digest` is set.
  tag: ""
  # -- Image digest (`sha256:...`). When set it wins over `image.tag`.
  digest: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Pull secrets for private registries, e.g. `[{name: ghcr-pull}]`.
imagePullSecrets: []

# -- Container command (overrides the image ENTRYPOINT).
command: []

# -- Container args (overrides the image CMD).
args: []

# -- Container ports. Each entry also becomes a Service port when a Service is rendered.
# `servicePort` is optional and defaults to `containerPort`. A probe port given by name (`httpGet.port`,
# `tcpSocket.port` in `probes`) must be one of these names: the render fails otherwise.
ports:
  - name: http
    containerPort: 8080

# -- Required: `requests.cpu` and `requests.memory`. Container resources. A `null` entry of `limits` or `requests` (other than
# `requests.cpu` and `requests.memory`, which stay required), and `limits: null`, mean absent: no such limit or request is rendered (the API server would store a null as `"0"`).
resources: {}

# -- Environment variables. Rendered into ConfigMap `<fullname>-env` and injected with `envFrom`.
config: {}

# -- Environment variables from REFERENCES only (literal values belong in `config`): a map of
# `NAME: {valueFrom: {<source>: ...}}` where the source is one of `fieldRef`, `resourceFieldRef`, `secretKeyRef` or `configMapKeyRef`.
# Rendered as container `env`, which wins over every `envFrom` source.
env: {}

# -- Existing ConfigMaps/Secrets injected whole, e.g. `[{secretRef: {name: sales-kafka-user}}]` or
# `[{configMapRef: {name: shared, optional: true}, prefix: SHARED_}]`. Injected BEFORE the chart's own
# `-env`/`-secrets`, so the component's explicit `config`/`externalSecret` win on duplicate keys.
envFrom: []

configFiles:
  # -- Directory where `configFiles.files` are mounted read-only. Rendered as written. Must not be `/tmp` or `/` once
  # normalized (`//tmp` and `/tmp/.` are `/tmp`), nor the ServiceAccount token directory
  # `/var/run/secrets/kubernetes.io/serviceaccount` while `serviceAccount.automountToken` is true.
  mountPath: /config
  # -- Files rendered into ConfigMap `<fullname>-files`. A string value is written verbatim;
  # a map value is rendered with `toYaml` (so it can be merged per environment). A file set to `null` (also a bare
  # `name:`) is no file, `files: null` removes every file, and an empty file is `""`. In a map-form file every key whose
  # value is `null` or empty (`key:`) is removed, in maps reached through maps, from every values layer and on Helm 3
  # and 4 alike (Helm 4 already drops such keys from an umbrella's own values while nothing is passed for the
  # component): write `key: {}` or `key: ""` to keep one, or the string form of the file for a literal `null`. A list is
  # rendered as written, with everything inside it, and a map left empty stays `{}`.
  files: {}

# -- Extra volumes, each mounted in the main container: a map keyed by the volume name, rendered in key order after the
# chart's own `tmp` and `config-files`. Every entry has a `type` (`emptyDir`; `configMap` and `secret`, mounted
# read-only; `persistentVolumeClaim`, an EXISTING claim; `ephemeral`, a claim created and deleted with each pod) and an
# absolute `mountPath`, and may have `subPath` and `readOnly`. The fields of each type: `emptyDir`: `medium` (`Memory`),
# `sizeLimit`; `configMap`: `name`, `items`, `defaultMode`, `optional`; `secret`: `secretName`, `items`, `defaultMode`,
# `optional`; `persistentVolumeClaim`: `claimName`; `ephemeral`: `size`, `accessMode` (default `ReadWriteOnce`),
# `storageClassName` (default: the cluster's default class). An `ephemeral` claim lives as long as its pod (source
# reading): a CronJob keeps those of the finished runs its history limits keep, a Job keeps its own for
# `job.ttlSecondsAfterFinished`, and each retry gets one of its own. In `volumes`, a `null` entry or field is absent, and
# `volumes: null` is no volume: an overlay changes the type of a volume that the umbrella defines by setting the
# previous type's fields to `null` (`cache: {type: ephemeral, size: 10Gi, sizeLimit: null}`), or removes it with
# `cache: null` and adds one under another name. Write `defaultMode` and `items[].mode` in octal with a leading zero,
# unquoted (`0440`): `440` is decimal and means `0670`, and `--set` cannot pass an octal literal (use the decimal
# value, `288`). Omit `items`, or set it to `null`, for every key. Quote a key that YAML 1.1 reads as a boolean (`on`,
# `yes`, `no`, `y`): two such keys collide silently. A name is a lowercase DNS-1123 label (`app-data`, not `appData`);
# `tmp`, `config-files`, `external-secret` and the prefixes `kube-api-access-` and `chart-base-` are reserved. A field
# of another type fails the render, and so does a `null` in a type's required field (`name`, `secretName`,
# `claimName`, `size`).
volumes: {}

externalSecret:
  # -- Render an ExternalSecret (external-secrets.io/v1) whose Secret `<fullname>-secrets` is injected with `envFrom`.
  enabled: false
  secretStoreRef:
    # -- `ClusterSecretStore` or `SecretStore`. Required when enabled (a `null` fails the render).
    kind: ClusterSecretStore
    # -- Name of the secret store. Required when enabled.
    name: ""
  # -- How often ESO re-reads the remote secrets.
  refreshInterval: 1h
  # -- Map of `ENV_VAR: {key: <remote key>, property: <optional field>}`. At least one entry when enabled: an enabled
  # ExternalSecret with `data` empty or `null` fails the render.
  data: {}

# -- Restart Deployments (Stakater Reloader annotations) when something that changes OUTSIDE the deploy is
# updated: the ExternalSecret's Secret and every Secret/ConfigMap referenced in `env`/`envFrom`.
# The chart's own ConfigMaps roll pods through checksum annotations instead.
reloadOnChange: true

# -- Deployment replicas. Ignored when `autoscaling.enabled`.
replicas: 1

# -- Seconds without rollout progress before the Deployment is marked Failed (lower than Helm's default 300s timeout).
progressDeadlineSeconds: 240

# -- (object) Deployment update strategy (`spec.strategy`): `{type: RollingUpdate, rollingUpdate: {maxSurge, maxUnavailable}}`
# or `{type: Recreate}`. `null` = Kubernetes default (`RollingUpdate`, 25% surge, 25% unavailable). Deployments only.
# `rollingUpdate: null` means absent and is never rendered: an override file over values that set `rollingUpdate`
# switches to Recreate with `{type: Recreate, rollingUpdate: null}` (a `rollingUpdate` next to `Recreate`, even `{}`,
# fails the render).
strategy: null

# -- (int) Seconds a new pod must be Ready, without any container crashing, before it counts as available
# (`spec.minReadySeconds`). `null` = Kubernetes default (0). Must be lower than `progressDeadlineSeconds`. Deployments only.
minReadySeconds: null

# -- (int) Old ReplicaSets kept for `kubectl rollout undo` (`spec.revisionHistoryLimit`). `null` = Kubernetes default (10). Deployments only.
revisionHistoryLimit: null

service:
  # -- Render a Service (deployments only). Set `false` for workers.
  enabled: true
  # -- Service type.
  type: ClusterIP

probes:
  # -- Startup probe (Kubernetes probe object). Empty = not rendered. A port given by name must be a `ports` name.
  startup: {}
  # -- Liveness probe (Kubernetes probe object). Empty = not rendered. A port given by name must be a `ports` name.
  liveness: {}
  # -- Readiness probe (Kubernetes probe object). Empty = not rendered. A port given by name must be a `ports` name.
  readiness: {}

autoscaling:
  # -- Render a HorizontalPodAutoscaler (autoscaling/v2). Deployments only.
  enabled: false
  # -- Minimum replicas.
  minReplicas: 2
  # -- Maximum replicas.
  maxReplicas: 10
  # -- Target average CPU utilization (percent of requests).
  targetCPUUtilizationPercentage: 80
  # -- (int) Target average memory utilization (percent of requests). `null` = not used.
  targetMemoryUtilizationPercentage: null

pdb:
  # -- Render a PodDisruptionBudget (policy/v1). Deployments only.
  enabled: true
  # -- (int or string) Max unavailable pods. When neither this nor `minAvailable` is set, `1` is used.
  maxUnavailable: null
  # -- (int or string) Min available pods. Mutually exclusive with `maxUnavailable`.
  minAvailable: null
  # -- `IfHealthyBudget` or `AlwaysAllow` (lets drains evict pods that are not Ready).
  unhealthyPodEvictionPolicy: AlwaysAllow

# -- (list) `null` = chart defaults (zone + hostname spread, ScheduleAnyway); `[]` = none; a list = used verbatim.
topologySpreadConstraints: null

# -- Seconds to sleep in preStop so endpoints drain before SIGTERM. `0` disables it (required with `lifecycle.preStop`). Deployments only.
preStopSleepSeconds: 5

# -- Pod termination grace period. Must be greater than `preStopSleepSeconds`; a `lifecycle` sleep must not exceed it.
terminationGracePeriodSeconds: 30

# -- Container lifecycle hooks `postStart` and `preStop`, each with exactly one of `exec`, `httpGet` or `sleep`
# (Kubernetes does not support `tcpSocket` here), e.g. `{preStop: {exec: {command: ["/app/drain"]}}}`.
# On Deployments, `lifecycle.preStop` replaces the built-in preStop sleep and requires `preStopSleepSeconds: 0`.
lifecycle: {}

httpRoute:
  # -- Render a Gateway API HTTPRoute (gateway.networking.k8s.io/v1). Requires `service.enabled`.
  enabled: false
  # -- Gateways to attach to (required when enabled), e.g. `[{name: platform-gw, namespace: gateway, sectionName: https}]`.
  # Each entry takes exactly the fields of a Gateway API `ParentReference` (`group`, `kind`, `namespace`, `name`,
  # `sectionName`, `port`): an unknown or misspelt key fails the render (the API server would drop it silently).
  parentRefs: []
  # -- Hostnames matched by the route.
  hostnames: []
  # -- HTTPRoute matches. The backend is always this component's Service (first port). Each entry takes exactly the
  # fields of a Gateway API `HTTPRouteMatch` (`path`, `headers`, `queryParams`, `method`), at every level: an unknown or
  # misspelt key fails the render (the API server would drop it silently and the route would match more).
  matches:
    - path:
        type: PathPrefix
        value: /

ingress:
  # -- Render a networking.k8s.io/v1 Ingress. Requires `service.enabled`.
  enabled: false
  # -- IngressClass name, required when enabled. No controller-specific annotations are added.
  className: ""
  # -- Ingress annotations.
  annotations: {}
  # -- Hosts, e.g. `[{host: sales.example.com, paths: [{path: /, pathType: Prefix}]}]`.
  hosts: []
  # -- Ingress TLS entries.
  tls: []

metrics:
  # -- Render a Prometheus Operator monitor (`monitoring.coreos.com/v1`): a ServiceMonitor that scrapes the component's
  # Service or, for a worker without a Service, a PodMonitor that scrapes its pods. Deployments only. The CRDs must be
  # installed: without them the release fails.
  enabled: false
  # -- Name of the entry of `ports` that serves the metrics: the Service port of that name (ServiceMonitor) or the
  # container port (PodMonitor). A worker must declare it in `ports` too.
  port: http
  # -- HTTP path of the metrics endpoint.
  path: /metrics
  # -- (string) Scrape interval, a Prometheus duration such as `30s` or `1m30s`. `null` = Prometheus' global scrape interval.
  interval: null
  # -- (string) Scrape timeout, e.g. `10s`. `null` = Prometheus' default. It must not be greater than the interval: the
  # Prometheus Operator rejects such a monitor, and the chart cannot compare durations.
  scrapeTimeout: null
  # -- Extra labels on the monitor, e.g. `{release: kube-prometheus-stack}`: with its default values, kube-prometheus-stack's
  # Prometheus only selects monitors labelled `release: <its release name>`. The keys the chart sets itself
  # (`app.kubernetes.io/name`, `instance`, `part-of`, `component`, `version`, `managed-by`, `helm.sh/chart`) are rejected.
  labels: {}

prometheusRule:
  # -- Render a Prometheus Operator PrometheusRule (`monitoring.coreos.com/v1`), on every workload type (e.g. alerts
  # on a CronJob's runs from kube-state-metrics). The CRD must be installed: without it the release fails.
  enabled: false
  # -- Extra labels on the PrometheusRule, e.g. `{release: kube-prometheus-stack}`; the chart's own label keys are
  # rejected (see `metrics.labels`).
  labels: {}
  # -- Rule groups, rendered verbatim as `spec.groups`: `[{name, interval, rules: [{alert or record, expr, for,
  # keep_firing_for, labels, annotations}]}]`; durations must not be empty and a recording rule takes no `for`,
  # `keep_firing_for` or `annotations`. The structure is validated; PromQL is not: where the operator's admission
  # webhook is deployed (kube-prometheus-stack deploys it by default, checked on chart version 91.8.2) a rule that does
  # not parse is rejected when Helm applies it and the install or upgrade of the whole release fails; without the
  # webhook the object is created and the operator skips it with a Warning event.
  groups: []

networkPolicy:
  # -- Render a NetworkPolicy (`networking.k8s.io/v1`) named `<fullname>` that selects the component's pods and isolates
  # their ingress: only the sources below may reach them, besides the pod's own node (kubelet probes), which the
  # NetworkPolicy API always allows. Egress is isolated only with `egress.enabled`. On a `job` component it is a hook of
  # the Job's phase, like its ServiceAccount and ConfigMaps. Without a CNI that enforces NetworkPolicy the object is
  # created and changes nothing.
  enabled: false
  ingress:
    # -- Aliases of sibling components of the same release (e.g. `[web]`) whose pods may reach every entry of `ports`, by name.
    fromComponents: []
    # -- Namespaces, by name (e.g. `[envoy-gateway-system]`), whose pods may reach every entry of `ports`: where the
    # Gateway's proxy pods run (with Envoy Gateway's default mode, the namespace Envoy Gateway runs in, not the Gateway's)
    # or the ingress controller's pods. Required, or `extra`, when `httpRoute` or `ingress` is enabled (or
    # `routeTrafficAllowedElsewhere`). Traffic from Cilium's Ingress or Gateway API does not match a namespace and `extra`
    # cannot allow it: a standard NetworkPolicy cannot select Cilium's `reserved:ingress` identity (a Cilium maintainer,
    # 2024-12-11, Cilium 1.16: it takes a CiliumNetworkPolicy; current releases unverified). Allow it there and set
    # `routeTrafficAllowedElsewhere`. A `hostNetwork` controller is usually treated as node traffic: an `ipBlock` of the
    # node CIDRs in `extra` may allow it, or allow it elsewhere and set the key.
    fromNamespaces: []
    # -- Set to `true` when the route's traffic reaches the pods through a policy this chart cannot express (Cilium's
    # Ingress or Gateway API, a `hostNetwork` ingress controller) and you allow it there: it silences the guard that fails
    # a route (`httpRoute` or `ingress`) without a source in `fromNamespaces` or `extra`. It opens nothing; without a
    # route it fails the render (it would have no effect).
    routeTrafficAllowedElsewhere: false
    # -- Namespaces, by name (e.g. `[monitoring]`), whose pods may reach only `metrics.port`: Prometheus. Required when
    # `metrics.enabled`, rejected without it. A scraper that is not a pod in a namespace (an agent on the host network, a
    # Prometheus outside the cluster) still needs an entry: list the namespace it is deployed in (or one you control) and
    # allow its addresses on `metrics.port` with an `ipBlock` in `extra`.
    metricsFromNamespaces: []
    # -- Extra ingress rules, appended verbatim: `[{from: [{podSelector, namespaceSelector} or {ipBlock: {cidr, except}}],
    # ports: [{port, endPort, protocol}]}]`. An omitted `from` or `ports` means every source or port; an empty list is
    # rejected.
    extra: []
  egress:
    # -- Isolate the pods' egress too: only DNS and the destinations below are allowed, every other connection is denied.
    # While `false`, `toComponents`, `toCIDRs`, `extra` and `dns.cidrs` must stay empty (the render fails: they would
    # restrict nothing); a changed DNS namespace, selector or port cannot be detected and is ignored. A component that
    # calls the API server (`serviceAccount.automountToken: true`) needs the API server's endpoint IPs and port in `toCIDRs`
    # (ports are matched after DNAT: kubeadm listens on 6443, not 443): `kubectl get endpointslices -n default -l
    # kubernetes.io/service-name=kubernetes`.
    enabled: false
    dns:
      # -- Allow DNS to the cluster DNS pods (`namespace` and `podSelector`) and to `cidrs`, on `ports`.
      enabled: true
      # -- Namespace of the cluster DNS pods (OpenShift: `openshift-dns`).
      namespace: kube-system
      # -- (object) Labels of the cluster DNS pods. `null` = `{k8s-app: kube-dns}`, the label of the cluster DNS pods on
      # kubeadm (kind), EKS, GKE with kube-dns, AKS and k3s (GKE with Cloud DNS, the Autopilot default, has no such pods:
      # unverified what it needs). A map you set REPLACES it, it is not merged with it. OpenShift:
      # `{dns.operator.openshift.io/daemonset-dns: default}`, with `namespace: openshift-dns` and
      # `ports: [{port: 5353, protocol: UDP}, {port: 5353, protocol: TCP}]`. A resolver that a namespace and labels
      # cannot select: `enabled: false` and an `egress.extra` rule.
      podSelector: null
      # -- DNS ports, by number, each with its protocol (required: an entry without one would be TCP only and block UDP
      # DNS). OpenShift's DNS pods listen on 5353.
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      # -- Extra DNS destinations by CIDR, on the same ports, for NodeLocal DNSCache (a host-network pod that pod
      # selectors usually do not match): list the address the pods actually query, `169.254.20.10/32` when the kubelet's
      # `clusterDNS` points at the NodeLocal address (kube-proxy IPVS mode), the kube-dns Service ClusterIP `/32` in
      # kube-proxy iptables mode (NodeLocal DNSCache listens on that IP too and the traffic is not DNAT-ed; GKE without
      # Dataplane V2 documents the ClusterIP). On GKE Dataplane V2 nothing is needed, and a Service IP may not be used in
      # an `ipBlock`.
      cidrs: []
    # -- Aliases of sibling components of the same release (e.g. `[api]`) whose pods may be reached on any port.
    toComponents: []
    # -- Destinations by CIDR: `[{cidr, except: [...], ports: [{port, endPort, protocol}]}]`, ports by number only; without
    # `ports`, every port. Meant for addresses outside the cluster: some CNIs never match pod traffic with a CIDR.
    toCIDRs: []
    # -- Extra egress rules, appended verbatim: the shape of `ingress.extra`, with `to` instead of `from`.
    extra: []

cronjob:
  # -- Cron schedule. Required for cronjob.
  schedule: ""
  # -- IANA time zone, e.g. `Europe/Madrid`. Empty = controller default (UTC).
  timeZone: ""
  # -- `Allow`, `Forbid` or `Replace`.
  concurrencyPolicy: Forbid
  # -- Successful Jobs to keep.
  successfulJobsHistoryLimit: 3
  # -- Failed Jobs to keep.
  failedJobsHistoryLimit: 1
  # -- (int) Seconds after its scheduled time within which a missed run may still start; a later run is skipped and
  # counted as failed. `null` = no deadline. Under 10 the CronJob may not be scheduled at all (the controller checks every 10 seconds).
  startingDeadlineSeconds: null
  # -- Suspend future runs (runs already started are not affected). Unsuspending a CronJob without
  # `startingDeadlineSeconds` schedules its missed runs immediately.
  suspend: false

job:
  # -- Helm hook phase for `workload.type: job`: `pre-deploy` (pre-install,pre-upgrade) or `post-deploy` (post-install,post-upgrade).
  phase: pre-deploy
  # -- Retries before the Job is marked failed (also used by cronjob runs).
  backoffLimit: 3
  # -- (int) Max seconds a Job may run. `null` = no limit (also used by cronjob runs).
  activeDeadlineSeconds: null
  # -- Seconds a finished Job (workload.type job) is kept for logs before deletion. CronJob runs are retained by the cronjob history limits instead.
  ttlSecondsAfterFinished: 3600

serviceAccount:
  # -- Create a ServiceAccount named `<fullname>` for the pods. When `false`, the pods run as the existing
  # ServiceAccount `name` or, without a `name`, as the namespace's `default` ServiceAccount.
  create: true
  # -- (string) The name of an existing ServiceAccount of the release namespace for the pods (e.g. one that a platform
  # team created with a cloud identity), only with `create: false`, never `default` (that is `create: false` without a
  # `name`). It must exist before the pods do: Kubernetes rejects a pod whose ServiceAccount does not exist. Its
  # `imagePullSecrets` are added to pods that set none, and its deprecated `kubernetes.io/enforce-mountable-secrets`
  # annotation can reject pods that reference the `externalSecret` Secret. A `pre-deploy` Job runs before the
  # release's other objects exist: it must not name a ServiceAccount that a sibling component creates. To keep the
  # chart's own ServiceAccount under its name (`<fullname>`, e.g. for a cloud identity's trust policy) on a
  # `deployment` or `cronjob`, hand it over in two deploys: first with `create: true` and
  # `annotations: {helm.sh/resource-policy: keep}`, then with `create: false`, `name: <fullname>` and the annotations
  # removed from the values. In one step Helm deletes it, and the pods, which do not roll (the pod template does not
  # change), lose it. A `job`'s ServiceAccount is a hook, which Helm deletes once the Job's phase succeeds, `keep` or
  # not: after a successful deploy, once it is gone, its owner creates `<fullname>`, then the next deploy sets
  # `create: false` and `name: <fullname>` (a deploy that still renders the hook deletes it: `before-hook-creation`).
  name: null
  # -- Annotations of the ServiceAccount the chart creates (e.g. GKE Workload Identity's
  # `iam.gke.io/gcp-service-account`, EKS IRSA's `eks.amazonaws.com/role-arn`). With `create: false` they fail the
  # render: the owner of an existing ServiceAccount sets its annotations. An override file clears inherited annotations
  # with `annotations: null`, not `{}` (maps are merged).
  annotations: {}
  # -- Mount the ServiceAccount token into the pods. The pods' own `automountServiceAccountToken` is always rendered,
  # so it wins over the ServiceAccount's, an existing one's too. A cloud identity does not need it: EKS IRSA and Pod
  # Identity and Azure Workload Identity inject a token of their own, and GKE Workload Identity's metadata server
  # requests one itself. Required, `true`, with `rbac.clusterRoles` and with any `rbac.rules` verb other than `use`
  # (the render fails otherwise).
  automountToken: false

rbac:
  # -- Namespaced permissions for the pods' ServiceAccount: a Role and a RoleBinding named `<fullname>`, e.g.
  # `[{apiGroups: [coordination.k8s.io], resources: [leases], verbs: [get, list, watch, create, update, patch]}]`.
  # Each rule needs `apiGroups` (`""` is the core group), `resources` (a subresource is written `pods/log`) and
  # `verbs`, and may restrict `resourceNames`. `*` is rejected in every list (it would grant future resources and
  # verbs; in `resourceNames` it is no wildcard), and the verbs are the standard ones: `get`, `list`, `watch`,
  # `create`, `update`, `patch`, `delete`, `deletecollection`, `use`, `bind`, `escalate`, `impersonate`. The main
  # escalation paths (Kubernetes' RBAC Good Practices) grant more than the rule names: reading Secrets (`list` and
  # `watch` reveal them like `get`), creating or changing workloads (a pod may run as any ServiceAccount of the
  # namespace and mount its Secrets), `pods/exec`, `pods/attach` and `pods/ephemeralcontainers` (commands in other
  # pods), `create` on `serviceaccounts/token`, `escalate`, `bind` and `impersonate`. Whoever runs the deploy must hold
  # every permission granted here. Requires a ServiceAccount of the component (the chart's, or `serviceAccount.name`),
  # never `default`, and `serviceAccount.automountToken: true` unless `use` is the only verb of every rule (an
  # admission plugin checks such a grant on the ServiceAccount itself: an OpenShift SecurityContextConstraints, for
  # example). With `resourceNames`, `deletecollection` fails the render (Kubernetes never matches it by name), and so
  # does `create` on a resource without `patch` or `update` in the same rule: only a server-side apply or a create
  # through an update carries the name; `create` on a subresource such as `pods/exec` is matched by name.
  rules: []
  # -- Existing ClusterRoles granted to the pods' ServiceAccount in the release namespace only, one RoleBinding
  # `<fullname>.<ClusterRole>` each (`[view]` renders `<fullname>.view`; a `<fullname>` never contains a `.`, so two
  # components of a release never share a binding name). No ClusterRole's rules are checked: only `cluster-admin` is
  # rejected for what it grants (and `*`, which a `roleRef` reads as a name); any other is granted as it is, and
  # ClusterRoles such as Kubernetes' controller role `system:controller:generic-garbage-collector` hold wildcard
  # rules; `edit` and `admin` let the pods act as any ServiceAccount of the namespace. A ClusterRole that does not
  # exist is not detected. Requires a ServiceAccount of the component and
  # `serviceAccount.automountToken: true` (the chart does not know a ClusterRole's rules; a grant that needs no token
  # is written as a `use` rule in `rules`).
  clusterRoles: []

# -- Extra pod annotations.
podAnnotations: {}

# -- Extra pod labels.
podLabels: {}

# -- Pod security context. Defaults satisfy the Pod Security Standards `restricted` profile; override key by key.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# -- Container security context. `readOnlyRootFilesystem` is extra hardening (an emptyDir is always mounted at `/tmp`).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# -- Node selector.
nodeSelector: {}

# -- Tolerations.
tolerations: []

# -- Affinity.
affinity: {}

# -- (string) PriorityClass of the pods (`priorityClassName`); it must exist. `null` = the default priority
# (the `globalDefault` PriorityClass, or 0).
priorityClassName: null

# -- (string) RuntimeClass of the pods (`runtimeClassName`), e.g. `gvisor`; it must exist. `null` = the default runtime handler.
runtimeClassName: null

# -- (object) DNS settings merged into those of the pod's DNS policy (`dnsConfig`): `nameservers` (at most 3), `searches`
# (at most 32) and `options`, e.g. `{options: [{name: ndots, value: "2"}]}` (option values are strings: quote them).
dnsConfig: null

# -- Extra `/etc/hosts` entries of the pods (`hostAliases`), e.g. `[{ip: 10.0.0.5, hostnames: [legacy-db.internal]}]`.
hostAliases: []

# -- Inject `<SERVICE>_SERVICE_HOST`/`_PORT` and Docker-links variables for every Service of the namespace
# (`enableServiceLinks`). `false` here (Kubernetes defaults to `true`): a Service named e.g. `redis` injects `REDIS_PORT=tcp://...`,
# which an app that reads `REDIS_PORT` without the component setting it gets instead of a port. `KUBERNETES_SERVICE_HOST`/`_PORT`
# are injected either way. Set `true` to restore Kubernetes' behavior.
enableServiceLinks: false
