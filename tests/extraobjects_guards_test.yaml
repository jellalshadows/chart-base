suite: extraObjects guards (the key, and the kinds an extra object cannot be)
templates:
  - templates/validate.yaml
release:
  name: vending
  namespace: vending
capabilities:
  majorVersion: 1
  minorVersion: 33
values:
  - values/base.yaml
tests:
  - it: rejects the key Bad (a key is a DNS-1123 label of at most 63 characters) (T15)
    set:
      extraObjects:
        Bad: {apiVersion: v1, kind: ConfigMap}
    asserts:
      - failedTemplate:
          errorPattern: 'extraObjects\.Bad: a key is a lowercase DNS-1123 label \(a-z, 0-9, "-", at most 63 characters; the object is named vending-chart-base\.<key>\): add the entry under such a key and set extraObjects\.Bad: null'

  - it: rejects the key a.b (a key is a DNS-1123 label of at most 63 characters) (T15)
    set:
      extraObjects:
        a.b: {apiVersion: v1, kind: ConfigMap}
    asserts:
      - failedTemplate:
          errorPattern: 'extraObjects\.a\.b: a key is a lowercase DNS-1123 label \(a-z, 0-9, "-", at most 63 characters; the object is named vending-chart-base\.<key>\): add the entry under such a key and set extraObjects\.a\.b: null'

  - it: rejects the key under_score (a key is a DNS-1123 label of at most 63 characters) (T15)
    set:
