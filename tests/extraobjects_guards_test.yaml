    asserts:
      - failedTemplate:
          errorPattern: 'extraObjects\.under_score: a key is a lowercase DNS-1123 label \(a-z, 0-9, "-", at most 63 characters; the object is named vending-chart-base\.<key>\): add the entry under such a key and set extraObjects\.under_score: null'

  - it: rejects the key of 64 characters (a key is a DNS-1123 label of at most 63 characters) (T15)
    set:
      extraObjects:
        aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: {apiVersion: v1, kind: ConfigMap}
    asserts:
      - failedTemplate:
          errorPattern: 'extraObjects\.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: a key is a lowercase DNS-1123 label \(a-z, 0-9, "-", at most 63 characters; the object is named vending-chart-base\.<key>\): add the entry under such a key and set extraObjects\.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: null'

  - it: accepts a key of 63 characters and a key with a digit first and a dash (T15)
    set:
      extraObjects:
        aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: {apiVersion: v1, kind: ConfigMap}
        0-settings: {apiVersion: v1, kind: ConfigMap}
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the key guard's remedy, the entry under a valid key and the bad key null (T15)
    set:
      extraObjects:
        Bad: null
        bad: {apiVersion: v1, kind: ConfigMap}
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects Pod (workload) (T17)
    set:
      extraObjects:
        pod: {apiVersion: v1, kind: Pod}
    asserts:
      - failedTemplate:
          errorPattern: 'extraObjects\.pod \(v1 Pod, named vending-chart-base\.pod\) is a built-in workload, and chart-base renders one workload per alias: render it as another alias of chart-base, or in the umbrella''s own templates, then set extraObjects\.pod: null'

