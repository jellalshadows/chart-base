suite: env references, envFrom and Reloader annotations
templates:
  - templates/validate.yaml
  - templates/deployment.yaml
  - templates/configmap-env.yaml
  - templates/configmap-files.yaml
  - templates/cronjob.yaml
  - templates/job.yaml
release:
  name: vending
  namespace: vending
capabilities:
  majorVersion: 1
  minorVersion: 33
chart:
  version: 0.0.0-test
values:
  - values/base.yaml
tests:
  - it: renders no env and no envFrom by default
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: renders env references sorted by name with valueFrom verbatim
    template: templates/deployment.yaml
    values:
      - values/base.yaml
      - values/env-refs.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vending.db-app
                  key: password
            - name: FLAG_X
              valueFrom:
                configMapKeyRef:
                  name: shared-flags
                  key: x
            - name: MEMORY_MB
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: 1Mi
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

  - it: injects external envFrom sources BEFORE the chart's own config and secrets
    template: templates/deployment.yaml
    values:
      - values/base.yaml
      - values/env-refs.yaml
    set:
      config.APP_MODE: api
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: gcp-sm
      externalSecret.data.API_KEY.key: sales-api-key
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: sales-kafka-user
            - configMapRef:
                name: shared-flags
                optional: true
              prefix: SHARED_
            - configMapRef:
                name: vending-chart-base-env
            - secretRef:
                name: vending-chart-base-secrets

  - it: renders envFrom with only external sources
    template: templates/deployment.yaml
    set:
      envFrom:
        - secretRef:
            name: sales-kafka-user
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: sales-kafka-user

  - it: applies env references to cronjob runs
    template: templates/cronjob.yaml
    values:
      - values/base.yaml
      - values/env-refs.yaml
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[3].name
          value: POD_NAME
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: sales-kafka-user

  - it: applies env references to job hooks
    template: templates/job.yaml
    values:
      - values/base.yaml
      - values/env-refs.yaml
    set:
      workload.type: job
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: DB_PASSWORD

  - it: lists the ExternalSecret Secret and every referenced Secret and ConfigMap for Reloader
    template: templates/deployment.yaml
    values:
      - values/base.yaml
      - values/env-refs.yaml
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: gcp-sm
      externalSecret.data.API_KEY.key: sales-api-key
    asserts:
      - equal:
          path: metadata.annotations["secret.reloader.stakater.com/reload"]
          value: sales-kafka-user,vending-chart-base-secrets,vending\.db-app
      - equal:
          path: metadata.annotations["configmap.reloader.stakater.com/reload"]
          value: shared-flags

  - it: lists each referenced object once even when it is referenced twice
    template: templates/deployment.yaml
    set:
      env:
        DB_USER:
          valueFrom:
            secretKeyRef:
              name: db-app
              key: username
        DB_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: db-app
              key: password
      envFrom:
        - secretRef:
            name: db-app
    asserts:
      - equal:
          path: metadata.annotations["secret.reloader.stakater.com/reload"]
          value: db-app
      - notExists:
          path: metadata.annotations["configmap.reloader.stakater.com/reload"]

  - it: never lists the chart's own ConfigMaps (they roll pods through checksums)
    template: templates/deployment.yaml
    set:
      config.APP_MODE: api
      configFiles.files:
        application.yaml: "a: 1\n"
    asserts:
      - notExists:
          path: metadata.annotations

  - it: renders no Reloader annotations when reloadOnChange is false
    template: templates/deployment.yaml
    values:
      - values/base.yaml
      - values/env-refs.yaml
    set:
      reloadOnChange: false
    asserts:
      - notExists:
          path: metadata.annotations

  - it: never adds Reloader annotations to cronjobs (each run reads the current objects)
    template: templates/cronjob.yaml
    values:
      - values/base.yaml
      - values/env-refs.yaml
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
    asserts:
      - notExists:
          path: metadata.annotations

  - it: never adds Reloader annotations to job hooks (a hook runs once per deploy)
    template: templates/job.yaml
    values:
      - values/base.yaml
      - values/env-refs.yaml
    set:
      workload.type: job
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: gcp-sm
      externalSecret.data.API_KEY.key: sales-api-key
    asserts:
      - notExists:
          path: metadata.annotations["secret.reloader.stakater.com/reload"]
      - notExists:
          path: metadata.annotations["configmap.reloader.stakater.com/reload"]
      - exists:
          path: metadata.annotations["helm.sh/hook"]

  - it: regex-quotes ConfigMap names in the Reloader annotation and adds no secret annotation
    template: templates/deployment.yaml
    set:
      envFrom:
        - configMapRef:
            name: shared.flags
    asserts:
      - equal:
          path: metadata.annotations["configmap.reloader.stakater.com/reload"]
          value: shared\.flags
      - notExists:
          path: metadata.annotations["secret.reloader.stakater.com/reload"]

  - it: quotes env names so YAML-special words stay strings
    template: templates/deployment.yaml
    set:
      env.NULL.valueFrom.fieldRef.fieldPath: metadata.name
      env.TRUE.valueFrom.fieldRef.fieldPath: metadata.namespace
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: "NULL"
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: "TRUE"

  - it: reports the literal-value guard whichever template Helm renders first
    template: templates/validate.yaml
    set:
      env.FOO: bar
    asserts:
      - failedTemplate:
          errorPattern: "env.FOO is a literal value"
