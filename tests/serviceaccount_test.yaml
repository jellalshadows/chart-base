suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
release:
  name: vending
  namespace: vending
capabilities:
  majorVersion: 1
  minorVersion: 33
chart:
  version: 0.0.0-test
values:
  - values/base.yaml
tests:
  - it: renders a ServiceAccount that does not automount its token
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: vending-chart-base
      - equal:
          path: automountServiceAccountToken
          value: false
      - notExists:
          path: metadata.annotations

  - it: renders annotations (e.g. GKE Workload Identity)
    set:
      serviceAccount.annotations:
        iam.gke.io/gcp-service-account: sales@acme.iam.gserviceaccount.com
    asserts:
      - equal:
          path: metadata.annotations["iam.gke.io/gcp-service-account"]
          value: sales@acme.iam.gserviceaccount.com

  - it: renders nothing when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no ServiceAccount for an existing one (create false with a name)
    set:
      serviceAccount.create: false
      serviceAccount.name: sales-runner
    asserts:
      - hasDocuments:
          count: 0
