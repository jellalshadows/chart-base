suite: networkpolicy (every workload type; a hook on a job component)
templates:
  - templates/networkpolicy.yaml
release:
  name: vending
  namespace: vending
capabilities:
  majorVersion: 1
  minorVersion: 33
chart:
  version: 0.0.0-test
values:
  - values/base.yaml
tests:
  - it: renders no NetworkPolicy by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one NetworkPolicy that selects the component's pods and isolates their ingress only, with no rule when there is no source
    set:
      networkPolicy.enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - isAPIVersion:
          of: networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: vending-chart-base
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: chart-base
      - equal:
          path: spec.podSelector
          value:
            matchLabels:
              app.kubernetes.io/name: chart-base
              app.kubernetes.io/instance: vending
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
      - notExists:
          path: spec.ingress
      - notExists:
          path: spec.egress
      - notExists:
          path: metadata.annotations

  - it: lets the pods of sibling components of the same release reach every declared port, by name
    set:
      ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 8081
      networkPolicy.enabled: true
      networkPolicy.ingress.fromComponents: [web, worker]
    asserts:
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: web
                      app.kubernetes.io/instance: vending
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: worker
                      app.kubernetes.io/instance: vending
              ports:
                - port: http
                  protocol: TCP
                - port: management
                  protocol: TCP

  - it: lets the pods of the named namespaces (the Gateway's proxies, the ingress controller) reach every declared port, by name
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.fromNamespaces: [envoy-gateway-system, ingress-nginx]
    asserts:
      - equal:
          path: spec.ingress
          value:
            - from:
                - namespaceSelector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values:
                          - envoy-gateway-system
                          - ingress-nginx
              ports:
                - port: http
                  protocol: TCP

  - it: lets the pods of the monitoring namespaces reach only metrics.port
    set:
      ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9090
      metrics.enabled: true
      metrics.port: metrics
      networkPolicy.enabled: true
      networkPolicy.ingress.metricsFromNamespaces: [monitoring]
    asserts:
      - equal:
          path: spec.ingress
          value:
            - from:
                - namespaceSelector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values:
                          - monitoring
              ports:
                - port: metrics
                  protocol: TCP

  - it: appends the extra ingress rules verbatim
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.extra:
        - from:
            - ipBlock:
                cidr: 10.0.0.0/8
                except: [10.1.0.0/16]
          ports:
            - port: 8443
              endPort: 8444
              protocol: TCP
        - {}
    asserts:
      - equal:
          path: spec.ingress
          value:
            - from:
                - ipBlock:
                    cidr: 10.0.0.0/8
                    except:
                      - 10.1.0.0/16
              ports:
                - port: 8443
                  endPort: 8444
                  protocol: TCP
            - {}

  - it: renders the rules in order (siblings, namespaces, monitoring, extra), one per source
    set:
      ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9090
      metrics.enabled: true
      metrics.port: metrics
      networkPolicy.enabled: true
      networkPolicy.ingress.fromComponents: [web]
      networkPolicy.ingress.fromNamespaces: [gateway]
      networkPolicy.ingress.metricsFromNamespaces: [monitoring]
      networkPolicy.ingress.extra:
        - ports:
            - port: 8080
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 4
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: web
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector.matchExpressions[0].values
          value: [gateway]
      - equal:
          path: spec.ingress[2].from[0].namespaceSelector.matchExpressions[0].values
          value: [monitoring]
      - equal:
          path: spec.ingress[3]
          value:
            ports:
              - port: 8080

  - it: never renders an empty ports list (the API reads it as every port), so siblings and namespaces get no rule without ports
    set:
      ports: []
      service.enabled: false
      networkPolicy.enabled: true
      networkPolicy.ingress.fromComponents: [web]
      networkPolicy.ingress.fromNamespaces: [gateway]
    asserts:
      - notExists:
          path: spec.ingress

  - it: keeps an alias, a namespace and a port named true strings (a plain true is a YAML boolean)
    set:
      ports:
        - name: "true"
          containerPort: 8080
      networkPolicy.enabled: true
      networkPolicy.ingress.fromComponents: ["true"]
      networkPolicy.ingress.fromNamespaces: ["true"]
    asserts:
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: "true"
      - equal:
          path: spec.ingress[0].ports[0].port
          value: "true"
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector.matchExpressions[0].values[0]
          value: "true"

  - it: is a hook of the Job's phase on a job component, created before the Job (weight -10) and deleted once the phase succeeds
    set:
      workload.type: job
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: metadata.annotations
          value:
            helm.sh/hook: pre-install,pre-upgrade
            helm.sh/hook-weight: "-10"
            helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: chart-base
            app.kubernetes.io/instance: vending

  - it: follows job.phase post-deploy
    set:
      workload.type: job
      job.phase: post-deploy
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade

  - it: is a regular object on a cronjob component, selecting its pods
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
      networkPolicy.enabled: true
    asserts:
      - notExists:
          path: metadata.annotations
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: chart-base
            app.kubernetes.io/instance: vending
