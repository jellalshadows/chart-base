      env.API_KEY.valueFrom.externalSecretKeyRef.key: api-key
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects an externalSecretKeyRef key unknown to a closed key set in an init container's env
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.DB_PASSWORD.key: /sales/db-password
      initContainers:
        migrate: {image: {repository: ghcr.io/acme/migrate, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, env: {PGPASSWORD: {valueFrom: {externalSecretKeyRef: {key: DB_USER}}}}}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: initContainers.migrate.env.PGPASSWORD.valueFrom.externalSecretKeyRef.key "DB_USER" is not a key of the Secret \(its keys: DB_PASSWORD\): correct it, or add it to externalSecret.data or externalSecret.template.data'

  - it: accepts envFrom false with only an externalSecretKeyRef in the main container (a reader), on a deployment
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.envFrom: false
      externalSecret.data.DB_PASSWORD.key: /sales/db-password
      env.PGPASSWORD.valueFrom.externalSecretKeyRef.key: DB_PASSWORD
    asserts:
      - hasDocuments:
