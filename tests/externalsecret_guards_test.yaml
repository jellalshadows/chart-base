      externalSecret.secretStoreRef.name: vault
      workload.type: job
      externalSecret.envFrom: false
      externalSecret.data.DB_PASSWORD.key: /sales/db-password
      env.PGPASSWORD.valueFrom.externalSecretKeyRef.key: DB_PASSWORD
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts envFrom false with only an externalSecretKeyRef in a sidecar's env
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.envFrom: false
      externalSecret.data.DB_PASSWORD.key: /sales/db-password
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/proxy, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, env: {PGPASSWORD: {valueFrom: {externalSecretKeyRef: {key: DB_PASSWORD}}}}}
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects env.DB_PASSWORD on the key DB_PASSWORD while the Secret is injected (one variable name twice)
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.DB_PASSWORD.key: /sales/db-password
      env.DB_PASSWORD.valueFrom.externalSecretKeyRef.key: DB_PASSWORD
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: env.DB_PASSWORD is also a key of the component''s Secret \(externalSecret.data or externalSecret.template.data\), which externalSecret.envFrom: true injects as the variable DB_PASSWORD: remove one of the two, rename the env entry, or set externalSecret.envFrom: false and reference the keys you need in env'

  - it: accepts env.PGPASSWORD on the key DB_PASSWORD while the Secret is injected (another name)
    set:
      externalSecret.enabled: true
