suite: externalSecret (schema rules and guards)
templates:
  - templates/validate.yaml
release:
  name: vending
  namespace: vending
capabilities:
  majorVersion: 1
  minorVersion: 33
values:
  - values/base.yaml
tests:
  # ---- the source (decision 2) and the conversion strategy (decision 1)
  - it: rejects an enabled ExternalSecret whose data is {} and whose dataFrom is empty, with the full message
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: externalSecret.enabled is true and the ExternalSecret has no source: list at least one key in externalSecret.data or one entry in externalSecret.dataFrom, or set externalSecret.enabled: false'

  - it: rejects data with only null entries and no dataFrom (a null entry is no source)
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.DB_USER: null
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: externalSecret.enabled is true and the ExternalSecret has no source: list at least one key in externalSecret.data or one entry in externalSecret.dataFrom, or set externalSecret.enabled: false'

  - it: rejects dataFrom null next to data {}
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.dataFrom: null
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: externalSecret.enabled is true and the ExternalSecret has no source: list at least one key in externalSecret.data or one entry in externalSecret.dataFrom, or set externalSecret.enabled: false'

  - it: accepts dataFrom as the only source
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.dataFrom: [{extract: {key: /sales/db}}]
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts data with only null entries next to a dataFrom entry
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.DB_USER: null
      externalSecret.dataFrom: [{extract: {key: /sales/db}}]
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts a disabled block without a source and with conversionStrategy next to a rewrite (a disabled block is not checked)
    set:
      externalSecret.enabled: false
      externalSecret.data.DB_USER: null
      externalSecret.dataFrom: [{extract: {key: /sales/db, conversionStrategy: Default}, rewrite: [{regexp: {source: a, target: b}}]}]
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects extract.conversionStrategy next to a non-empty rewrite, naming the entry
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.dataFrom:
        - extract: {key: /sales/api}
        - extract: {key: /sales/db, conversionStrategy: Default}
          rewrite: [{regexp: {source: "^", target: DB_}}]
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: externalSecret.dataFrom\[1\]: extract.conversionStrategy is ignored by External Secrets when rewrite is set: remove it and rename the keys in the rewrite'

  - it: accepts extract.conversionStrategy without a rewrite and with rewrite []
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.dataFrom:
        - extract: {key: /sales/api, conversionStrategy: Unicode}
        - extract: {key: /sales/db, conversionStrategy: Default}
          rewrite: []
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts an env name next to a null data entry of the same name (a null entry is no key of the Secret)
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data: {DB_PASSWORD: {key: /sales/db-password}, DB_USER: null}
      env.DB_USER.valueFrom.secretKeyRef: {name: sales-db, key: username}
    asserts:
      - hasDocuments:
          count: 0

  # ---- the closed dataFrom schema (decision 1) and the data entries (decision 10)
  - it: rejects a dataFrom entry with a field the chart does not offer (find)
    set:
      externalSecret.dataFrom: [{extract: {key: /sales/db}, find: {name: {regexp: sales}}}]
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/dataFrom/0': additional properties 'find' not allowed"

  - it: rejects a misspelt extract field (extract is closed)
    set:
      externalSecret.dataFrom: [{extract: {key: /sales/db, propery: username}}]
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/dataFrom/0/extract': additional properties 'propery' not allowed"

  - it: rejects a dataFrom entry without extract (the one source of an entry)
    set:
      externalSecret.dataFrom: [{rewrite: [{regexp: {source: a, target: b}}]}]
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/dataFrom/0': missing property 'extract'"

  - it: rejects an extract without key
    set:
      externalSecret.dataFrom: [{extract: {property: username}}]
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/dataFrom/0/extract': missing property 'key'"

  - it: rejects a null dataFrom item (a list is replaced whole, so a null in it is no deletion)
    set:
      externalSecret.dataFrom: [null]
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/dataFrom/0': got null, want object"

  - it: rejects a null field inside a dataFrom item
    set:
      externalSecret.dataFrom: [{extract: {key: /sales/db, property: null}}]
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/dataFrom/0/extract/property': got null, want string"

  - it: rejects decodingStrategy Auto on an extract
    set:
      externalSecret.dataFrom: [{extract: {key: /sales/db, decodingStrategy: Auto}}]
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/dataFrom/0/extract/decodingStrategy': value must be one of 'None', 'Base64', 'Base64URL'"

  - it: rejects a conversionStrategy other than Default and Unicode
    set:
      externalSecret.dataFrom: [{extract: {key: /sales/db, conversionStrategy: default}}]
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/dataFrom/0/extract/conversionStrategy': value must be one of 'Default', 'Unicode'"

  - it: rejects a rewrite item with both regexp and transform
    set:
      externalSecret.dataFrom: [{extract: {key: /sales/db}, rewrite: [{regexp: {source: a, target: b}, transform: {template: x}}]}]
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/dataFrom/0/rewrite/0': 'oneOf' failed, subschemas 0, 1 matched"

  - it: rejects an empty rewrite item
    set:
      externalSecret.dataFrom: [{extract: {key: /sales/db}, rewrite: [{}]}]
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/dataFrom/0/rewrite/0': 'oneOf' failed, none matched"

  - it: rejects a regexp rewrite without target
    set:
      externalSecret.dataFrom: [{extract: {key: /sales/db}, rewrite: [{regexp: {source: a}}]}]
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/dataFrom/0/rewrite/0/regexp': missing property 'target'"

  - it: rejects a misspelt transform field (a rewrite item is closed)
    set:
      externalSecret.dataFrom: [{extract: {key: /sales/db}, rewrite: [{transform: {templte: x}}]}]
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/dataFrom/0/rewrite/0/transform': additional properties 'templte' not allowed"

  - it: rejects decodingStrategy Auto on a data entry
    set:
      externalSecret.data.DB.key: db
      externalSecret.data.DB.decodingStrategy: Auto
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/data/DB/decodingStrategy': value must be one of 'None', 'Base64', 'Base64URL'"

  - it: rejects a numeric version on a data entry (a version is a string)
    set:
      externalSecret.data.DB: {key: db, version: 3}
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/data/DB/version': got number, want"

  - it: rejects a numeric version on an extract (a version is a string)
    set:
      externalSecret.dataFrom: [{extract: {key: /sales/db, version: 3}}]
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/dataFrom/0/extract/version': got number, want string"

  - it: rejects a misspelt data entry field (an entry is closed)
    set:
      externalSecret.data.DB: {key: db, propery: username}
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/data/DB': additional properties 'propery' not allowed"

  - it: rejects a null key of a data entry (a required field stays required)
    set:
      externalSecret.data.DB: {key: null}
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/data/DB/key': got null, want string"

  # ---- the template (decisions 3 and 4)
  - it: rejects mergePolicy Replace without a templated key, with the full message
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.DB.key: db
      externalSecret.template.mergePolicy: Replace
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: externalSecret.template.mergePolicy: Replace has no effect without a templated key \(External Secrets then writes every data and dataFrom key to the Secret\): add an externalSecret.template.data entry, or set mergePolicy: Merge'

  - it: rejects mergePolicy Replace when every template.data entry is null (an overlay dropped the last templated key)
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.DB.key: db
      externalSecret.template: {data: {DATABASE_URL: null}, mergePolicy: Replace}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: externalSecret.template.mergePolicy: Replace has no effect without a templated key \(External Secrets then writes every data and dataFrom key to the Secret\): add an externalSecret.template.data entry, or set mergePolicy: Merge'

  - it: accepts mergePolicy Replace with a templated key
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.DB.key: db
      externalSecret.template: {data: {DATABASE_URL: "postgres://{{ .DB }}@db/sales"}, mergePolicy: Replace}
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts mergePolicy Replace without a templated key while the block is disabled
    set:
      externalSecret.template.mergePolicy: Replace
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a template.data value without a template action, with the full message (a constant in the Secret; a closing }} alone is none)
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.DB.key: db
      externalSecret.template.data.API_KEY: "hunter2 }}"
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: externalSecret.template.data.API_KEY has no template action, so it is a constant written into the Secret: a constant belongs in config or configFiles, and a secret value belongs in the store \(reference it as \{\{ .KEY \}\}\)'

  - it: accepts a constant written as a template action, a multi-line value with one action, and a null value
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.DB.key: db
      externalSecret.template.data:
        MODE: '{{ "production" }}'
        APP_CONFIG: |-
          url: postgres://db/sales
          password: {{ .DB }}
        API_KEY: null
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts a template.data value without a template action while the block is disabled
    set:
      externalSecret.template.data.API_KEY: hunter2
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects template null (template is required, also while the block is disabled)
    set:
      externalSecret.template: null
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret': missing property 'template'"

  - it: rejects template.mergePolicy null (mergePolicy is required, also while the block is disabled)
    set:
      externalSecret.template.mergePolicy: null
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/template': missing property 'mergePolicy'"

  - it: rejects a mergePolicy other than Merge and Replace
    set:
      externalSecret.template.mergePolicy: merge
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/template/mergePolicy': value must be one of 'Merge', 'Replace'"

  - it: rejects a template field the chart does not offer (templateFrom)
    set:
      externalSecret.template.templateFrom: [{configMap: {name: tpl, items: [{key: a}]}}]
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/template': additional properties 'templateFrom' not allowed"

  - it: rejects a template.data value that is not a string
    set:
      externalSecret.template.data.PORT: 5432
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/template/data/PORT': got number, want"

  - it: rejects a template.data key outside the Secret-key pattern (the message, not its path, which Helm reports elsewhere)
    set:
      externalSecret.template.data:
        a/b: "{{ .x }}"
    asserts:
      - failedTemplate:
          errorPattern: "'a/b' does not match pattern"

  # ---- the keys while the Secret is injected (decision 7) and the readers with envFrom false (decision 6)
  - it: rejects a data key that is not an environment variable name while the Secret is injected, with the full message
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data:
        tls.crt: {key: /sales/tls, property: crt}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: externalSecret.data key "tls.crt" is not an environment variable name and externalSecret.envFrom is true \(every key of the Secret becomes a variable\): rename it, or set externalSecret.envFrom: false and read the keys as files \(externalSecret.mountPath\) or one by one \(env.<NAME>.valueFrom.externalSecretKeyRef\)'

  - it: accepts a data key tls.crt with envFrom false (a secretKeyRef on the Secret reads it)
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.envFrom: false
      externalSecret.data:
        tls.crt: {key: /sales/tls, property: crt}
      env.TLS_CRT.valueFrom.secretKeyRef: {name: vending-chart-base-secrets, key: tls.crt}
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a template.data key that is not an environment variable name while the Secret is injected
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.DB.key: db
      externalSecret.template.data:
        app.yaml: "password: {{ .DB }}"
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: externalSecret.template.data key "app.yaml" is not an environment variable name and externalSecret.envFrom is true \(every key of the Secret becomes a variable\): rename it, or set externalSecret.envFrom: false and read the keys as files \(externalSecret.mountPath\) or one by one \(env.<NAME>.valueFrom.externalSecretKeyRef\)'

  - it: accepts a data key that is not an environment variable name under a templated Replace (only an input of the template)
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data:
        tls.crt: {key: /sales/tls, property: crt}
      externalSecret.template: {data: {TLS_CRT: '{{ index . "tls.crt" }}'}, mergePolicy: Replace}
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts a key that is not an environment variable name while the block is disabled
    set:
      externalSecret.data:
        tls.crt: {key: /sales/tls}
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a data key outside the Secret-key pattern (the message, not its path)
    set:
      externalSecret.data:
        a/b: {key: x}
    asserts:
      - failedTemplate:
          errorPattern: "'a/b' does not match pattern '\\^\\[-\\._a-zA-Z0-9\\]\\+\\$'"

  - it: rejects decodingStrategy Base64 on a data entry while the Secret is injected, with the full message
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.KEYSTORE_P12: {key: /sales/keystore, decodingStrategy: Base64}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: externalSecret.data.KEYSTORE_P12.decodingStrategy: Base64 delivers decoded content, and externalSecret.envFrom is true \(every key of the Secret becomes a variable, and binary content can keep the container from starting\): set externalSecret.envFrom: false and reference the variables you need in env \(valueFrom.externalSecretKeyRef\), or decode a text value in externalSecret.template.data with b64dec'

  - it: rejects decodingStrategy Base64URL on an extract while the Secret is injected, with the full message
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.dataFrom: [{extract: {key: /sales/certs, decodingStrategy: Base64URL}}]
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: externalSecret.dataFrom\[0\].extract.decodingStrategy: Base64URL delivers decoded content, and externalSecret.envFrom is true \(every key of the Secret becomes a variable, and binary content can keep the container from starting\): set externalSecret.envFrom: false and reference the variables you need in env \(valueFrom.externalSecretKeyRef\), or decode a text value in externalSecret.template.data with b64dec'

  - it: accepts decodingStrategy Base64 on a data entry and an extract with envFrom false
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.envFrom: false
      externalSecret.data.KEYSTORE_P12: {key: /sales/keystore, decodingStrategy: Base64}
      externalSecret.dataFrom: [{extract: {key: /sales/certs, decodingStrategy: Base64}}]
      env.KEYSTORE.valueFrom.secretKeyRef: {name: vending-chart-base-secrets, key: KEYSTORE_P12}
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts decodingStrategy Base64 on a data entry and an extract under a templated Replace (the sources are template inputs)
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.KEYSTORE_P12: {key: /sales/keystore, decodingStrategy: Base64}
      externalSecret.dataFrom: [{extract: {key: /sales/certs, decodingStrategy: Base64}}]
      externalSecret.template: {data: {KEYSTORE_PASSWORD: "{{ .password }}"}, mergePolicy: Replace}
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts decodingStrategy None while the Secret is injected
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.API_KEY: {key: /sales/api-key, decodingStrategy: None}
      externalSecret.dataFrom: [{extract: {key: /sales/api, decodingStrategy: None}}]
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects an env name that is a template.data key while the Secret is injected, with the message of the Secret
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.DB.key: db
      externalSecret.template.data.DATABASE_URL: "postgres://{{ .DB }}@db/sales"
      env.DATABASE_URL.valueFrom.secretKeyRef: {name: shared-db, key: url}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: env.DATABASE_URL is also a key of the component''s Secret \(externalSecret.data or externalSecret.template.data\), which externalSecret.envFrom: true injects as the variable DATABASE_URL: remove one of the two, rename the env entry, or set externalSecret.envFrom: false and reference the keys you need in env'

  - it: accepts an env name that is a data key under a templated Replace (that key is not in the Secret)
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.DB.key: db
      externalSecret.template: {data: {DATABASE_URL: "postgres://{{ .DB }}@db/sales"}, mergePolicy: Replace}
      env.DB.valueFrom.secretKeyRef: {name: shared-db, key: password}
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects an env name that is a data key under a templated Merge
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.DB.key: db
      externalSecret.template.data.DATABASE_URL: "postgres://{{ .DB }}@db/sales"
      env.DB.valueFrom.secretKeyRef: {name: shared-db, key: password}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: env.DB is also a key of the component''s Secret \(externalSecret.data or externalSecret.template.data\), which externalSecret.envFrom: true injects as the variable DB: remove one of the two, rename the env entry, or set externalSecret.envFrom: false and reference the keys you need in env'

  - it: accepts an env name that is a data key while the block is disabled (a disabled block injects nothing)
    set:
      externalSecret.data.DB.key: db
      env.DB.valueFrom.secretKeyRef: {name: shared-db, key: password}
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts an env name that is a data key with envFrom false (the env entry may itself read the Secret)
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.envFrom: false
      externalSecret.data.DB.key: db
      env.DB.valueFrom.secretKeyRef: {name: vending-chart-base-secrets, key: DB}
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a sidecar env name with inheritEnv that is a template.data key while the Secret is injected
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.DB.key: db
      externalSecret.template.data.DATABASE_URL: "postgres://{{ .DB }}@db/sales"
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/proxy, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, inheritEnv: true, env: {DATABASE_URL: {valueFrom: {secretKeyRef: {name: shared-db, key: url}}}}}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: sidecars.proxy.env.DATABASE_URL is also a variable of the main container, which inheritEnv: true already gives this container: rename it, or drop inheritEnv and reference what the container needs'

  - it: accepts a sidecar env name with inheritEnv that is a data key with envFrom false (nothing injected)
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.envFrom: false
      externalSecret.data.DB.key: db
      env.PGPASSWORD.valueFrom.secretKeyRef: {name: vending-chart-base-secrets, key: DB}
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/proxy, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, inheritEnv: true, env: {DB: {valueFrom: {secretKeyRef: {name: shared-db, key: password}}}}}
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects envFrom false when nothing reads the Secret, with the full message
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.envFrom: false
      externalSecret.data.DB.key: db
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: externalSecret.envFrom is false and nothing reads the Secret: mount it \(externalSecret.mountPath\), reference its keys in env \(env.<NAME>.valueFrom.externalSecretKeyRef\), or set externalSecret.envFrom: true'

  - it: rejects envFrom false when the only secretKeyRef names another Secret
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.envFrom: false
      externalSecret.data.DB.key: db
      env.PGPASSWORD.valueFrom.secretKeyRef: {name: vending-other-secrets, key: DB}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: externalSecret.envFrom is false and nothing reads the Secret: mount it \(externalSecret.mountPath\), reference its keys in env \(env.<NAME>.valueFrom.externalSecretKeyRef\), or set externalSecret.envFrom: true'

  - it: accepts envFrom false with a secretKeyRef on the Secret in a sidecar's env
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.envFrom: false
      externalSecret.data.DB.key: db
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/proxy, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, env: {DB: {valueFrom: {secretKeyRef: {name: vending-chart-base-secrets, key: DB}}}}}
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts envFrom false without a reader while the block is disabled
    set:
      externalSecret.envFrom: false
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects envFrom null (envFrom is required, also while the block is disabled)
    set:
      externalSecret.envFrom: null
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret': missing property 'envFrom'"

  - it: rejects a list under externalSecret.envFrom (a switch, not the component's envFrom list)
    set:
      externalSecret.envFrom: [{secretRef: {name: other}}]
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/envFrom': got array, want boolean"

  # ---- env.<NAME>.valueFrom.externalSecretKeyRef (decision 14)
  - it: rejects an externalSecretKeyRef in the main container while the block is disabled, with the full message
    set:
      env.PGPASSWORD.valueFrom.externalSecretKeyRef.key: DB_PASSWORD
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: env.PGPASSWORD.valueFrom.externalSecretKeyRef references the Secret of the component''s ExternalSecret, and externalSecret.enabled is false, so that Secret is not rendered: set externalSecret.enabled: true, or remove env.PGPASSWORD \(an override file cannot remove one env entry that another values file defines: keep the entry in the values files of the environments that enable the ExternalSecret\)'

  - it: rejects an externalSecretKeyRef in a sidecar's env while the block is disabled, with the entry's remedy
    set:
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/proxy, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, env: {PGPASSWORD: {valueFrom: {externalSecretKeyRef: {key: DB_PASSWORD}}}}}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: sidecars.proxy.env.PGPASSWORD.valueFrom.externalSecretKeyRef references the Secret of the component''s ExternalSecret, and externalSecret.enabled is false, so that Secret is not rendered: set externalSecret.enabled: true, or remove sidecars.proxy.env.PGPASSWORD \(an overlay removes it with sidecars.proxy.env.PGPASSWORD: null\)'

  - it: rejects an externalSecretKeyRef in an init container's env while the block is disabled
    set:
      initContainers:
        migrate: {image: {repository: ghcr.io/acme/migrate, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, env: {PGPASSWORD: {valueFrom: {externalSecretKeyRef: {key: DB_PASSWORD}}}}}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: initContainers.migrate.env.PGPASSWORD.valueFrom.externalSecretKeyRef references the Secret of the component''s ExternalSecret, and externalSecret.enabled is false, so that Secret is not rendered: set externalSecret.enabled: true, or remove initContainers.migrate.env.PGPASSWORD \(an overlay removes it with initContainers.migrate.env.PGPASSWORD: null\)'

  - it: rejects an externalSecretKeyRef key that is not a key of the Secret (a closed key set), listing its keys
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data: {DB_PASSWORD: {key: /sales/db-password}, DB_USER: {key: /sales/db-user}}
      env.PGPASSWORD.valueFrom.externalSecretKeyRef.key: DB_PASWORD
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: env.PGPASSWORD.valueFrom.externalSecretKeyRef.key "DB_PASWORD" is not a key of the Secret \(its keys: DB_PASSWORD, DB_USER\): correct it, or add it to externalSecret.data or externalSecret.template.data'

  - it: lists a key that data and template.data both bring once in the message (the b64dec workaround)
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.API_KEY.key: /sales/api-key
      externalSecret.template.data.API_KEY: "{{ .API_KEY | b64dec }}"
      env.TOKEN.valueFrom.externalSecretKeyRef.key: API_TOKEN
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: env.TOKEN.valueFrom.externalSecretKeyRef.key "API_TOKEN" is not a key of the Secret \(its keys: API_KEY\): correct it, or add it to externalSecret.data or externalSecret.template.data'

  - it: rejects an externalSecretKeyRef key that names a data key under a templated Replace, naming both remedies
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.DB_PASSWORD.key: /sales/db-password
      externalSecret.template: {data: {DATABASE_URL: "postgres://{{ .DB_PASSWORD }}@db/sales"}, mergePolicy: Replace}
      env.PGPASSWORD.valueFrom.externalSecretKeyRef.key: DB_PASSWORD
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: env.PGPASSWORD.valueFrom.externalSecretKeyRef.key "DB_PASSWORD" is not a key of the Secret \(its keys: DATABASE_URL\): externalSecret.data.DB_PASSWORD is only an input of the template, because externalSecret.template.mergePolicy is Replace; add the key to externalSecret.template.data, or set externalSecret.template.mergePolicy: Merge'

  - it: rejects an externalSecretKeyRef key outside the templated keys under Replace with a dataFrom (the key set is closed)
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.dataFrom: [{extract: {key: /sales/db}}]
      externalSecret.template: {data: {DATABASE_URL: "postgres://{{ .password }}@db/sales"}, mergePolicy: Replace}
      env.PGPASSWORD.valueFrom.externalSecretKeyRef.key: password
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: env.PGPASSWORD.valueFrom.externalSecretKeyRef.key "password" is not a key of the Secret \(its keys: DATABASE_URL\): correct it, or add it to externalSecret.data or externalSecret.template.data'

  - it: accepts an externalSecretKeyRef key that names a data key under a templated Merge
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: vault
      externalSecret.data.DB_PASSWORD.key: /sales/db-password
      externalSecret.template.data.DATABASE_URL: "postgres://{{ .DB_PASSWORD }}@db/sales"
      env.PGPASSWORD.valueFrom.externalSecretKeyRef.key: DB_PASSWORD
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts an externalSecretKeyRef key the chart cannot see with a dataFrom under Merge (an open key set)
    set:
