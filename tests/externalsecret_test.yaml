suite: externalsecret
templates:
  - templates/externalsecret.yaml
release:
  name: vending
  namespace: vending
capabilities:
  majorVersion: 1
  minorVersion: 33
chart:
  version: 0.0.0-test
values:
  - values/base.yaml
set:
  externalSecret.enabled: true
  externalSecret.secretStoreRef.name: gcp-sm
  externalSecret.data.DB_PASSWORD.key: sales-db-password
tests:
  - it: renders an external-secrets.io/v1 ExternalSecret (v1beta1 is no longer served)
    asserts:
      - isKind:
          of: ExternalSecret
      - isAPIVersion:
          of: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: vending-chart-base-secrets
      - notExists:
          path: metadata.annotations

  - it: targets an owned Secret with the same name as the ExternalSecret
    asserts:
      - equal:
          path: spec.target
          value:
            name: vending-chart-base-secrets
            creationPolicy: Owner

  - it: references the store and maps each env var to a remote key
    set:
      externalSecret.data.DB_USER.key: sales-db
      externalSecret.data.DB_USER.property: username
    asserts:
      - equal:
          path: spec.secretStoreRef
          value:
            kind: ClusterSecretStore
            name: gcp-sm
      - equal:
          path: spec.refreshInterval
          value: 1h
      - contains:
          path: spec.data
          content:
            secretKey: DB_PASSWORD
            remoteRef:
              key: sales-db-password
      - contains:
          path: spec.data
          content:
            secretKey: DB_USER
            remoteRef:
              key: sales-db
              property: username

  - it: renders nothing when disabled
    set:
      externalSecret.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps a secret store named true a string
    set:
      externalSecret.secretStoreRef.name: "true"
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: "true"

  - it: keeps an externalSecret.data key TRUE a string in secretKey
    set:
      externalSecret.data.TRUE.key: /sales/flag
    asserts:
      - equal:
          path: spec.data
          value:
            - secretKey: DB_PASSWORD
              remoteRef:
                key: sales-db-password
            - secretKey: "TRUE"
              remoteRef:
                key: /sales/flag

  - it: renders no secretKey for a null data entry (an overlay removes one key with a null)
    set:
      externalSecret.data.DB_USER: null
    asserts:
      - equal:
          path: spec.data
          value:
            - secretKey: DB_PASSWORD
              remoteRef:
                key: sales-db-password

  - it: renders no remoteRef field that is null (property, version and decodingStrategy)
    set:
      externalSecret.data.DB_PASSWORD: {key: sales-db-password, property: null, version: null, decodingStrategy: null}
    asserts:
      - equal:
          path: spec.data
          value:
            - secretKey: DB_PASSWORD
              remoteRef:
                key: sales-db-password

  - it: renders version and decodingStrategy of a data entry, quoted (a version written "1" stays a string)
    set:
      externalSecret.data.DB_PASSWORD.version: "1"
      externalSecret.data.DB_PASSWORD.decodingStrategy: None
    asserts:
      - equal:
          path: spec.data
          value:
            - secretKey: DB_PASSWORD
              remoteRef:
                key: sales-db-password
                version: "1"
                decodingStrategy: None

  - it: renders the dataFrom entries in the given order, after data (a sort would put /a/second first)
    set:
      externalSecret.dataFrom: [{extract: {key: /z/first}}, {extract: {key: /a/second}}]
    asserts:
      - equal:
          path: spec.dataFrom
          value:
            - extract:
                key: /z/first
            - extract:
                key: /a/second
      - equal:
          path: spec.data[0].secretKey
          value: DB_PASSWORD

  - it: renders every field of an extract and its rewrite operations in their order, each string quoted
    set:
      externalSecret.dataFrom:
        - extract: {key: "true", property: "1", version: "2", decodingStrategy: None}
          rewrite:
            - regexp: {source: "^(.*)$", target: "DB_$1"}
            - transform: {template: "{{ .value | upper }}"}
            - regexp: {source: "^DB_", target: ""}
    asserts:
      - equal:
          path: spec.dataFrom
          value:
            - extract:
                key: "true"
                property: "1"
                version: "2"
                decodingStrategy: None
              rewrite:
                - regexp:
                    source: "^(.*)$"
                    target: "DB_$1"
                - transform:
                    template: "{{ .value | upper }}"
                - regexp:
                    source: "^DB_"
                    target: ""

  - it: renders conversionStrategy without a rewrite, and no rewrite key for rewrite []
    set:
      externalSecret.dataFrom: [{extract: {key: /sales/db, conversionStrategy: Unicode}, rewrite: []}]
    asserts:
      - equal:
          path: spec.dataFrom
          value:
            - extract:
                key: /sales/db
                conversionStrategy: Unicode

  - it: renders no data key when dataFrom is the only source (data with only null entries)
    set:
      externalSecret.data.DB_PASSWORD: null
      externalSecret.dataFrom: [{extract: {key: /sales/db}}]
    asserts:
      - notExists:
          path: spec.data
      - equal:
          path: spec.dataFrom
          value:
            - extract:
                key: /sales/db

  - it: renders no dataFrom key for dataFrom null
    set:
      externalSecret.dataFrom: null
    asserts:
      - notExists:
          path: spec.dataFrom
      - exists:
          path: spec.data

  - it: renders dataFrom in the hook ExternalSecret of a job
    set:
      workload.type: job
      externalSecret.dataFrom: [{extract: {key: /sales/db}}]
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: spec.dataFrom[0].extract.key
          value: /sales/db

  - it: renders a templated block with mergePolicy Merge by default, the chart's labels and the template data quoted
    set:
      externalSecret.data.DB_USER.key: sales-db-user
      externalSecret.template.data.DATABASE_URL: "postgres://{{ .DB_USER }}:{{ .DB_PASSWORD }}@db/sales"
    asserts:
      - equal:
          path: spec.target
          value:
            name: vending-chart-base-secrets
            creationPolicy: Owner
            template:
              mergePolicy: Merge
              metadata:
                labels:
                  app.kubernetes.io/name: chart-base
                  app.kubernetes.io/instance: vending
                  app.kubernetes.io/part-of: vending
                  app.kubernetes.io/component: deployment
                  app.kubernetes.io/version: "1.4.2"
                  app.kubernetes.io/managed-by: Helm
                  helm.sh/chart: chart-base-0.0.0-test
              data:
                DATABASE_URL: "postgres://{{ .DB_USER }}:{{ .DB_PASSWORD }}@db/sales"
      - lengthEqual:
          path: spec.data
          count: 2

  - it: renders mergePolicy Replace when it is set
    set:
      externalSecret.template: {data: {DATABASE_URL: "postgres://{{ .DB_PASSWORD }}@db/sales"}, mergePolicy: Replace}
    asserts:
      - equal:
          path: spec.target.template.mergePolicy
          value: Replace

  - it: renders no target.template when every template.data entry is null (Merge)
    set:
      externalSecret.template.data.DATABASE_URL: null
    asserts:
      - equal:
          path: spec.target
          value:
            name: vending-chart-base-secrets
            creationPolicy: Owner

  - it: renders no target.template for template.data null
    set:
      externalSecret.template.data: null
    asserts:
      - equal:
          path: spec.target
          value:
            name: vending-chart-base-secrets
            creationPolicy: Owner

  - it: renders a multi-line template value and a constant written as a template action, each as written
    set:
      externalSecret.template.data:
        APP_CONFIG: |-
          url: postgres://db/sales
          password: {{ .DB_PASSWORD }}
        MODE: '{{ "production" }}'
        GONE: null
    asserts:
      - equal:
          path: spec.target.template.data
          value:
            APP_CONFIG: "url: postgres://db/sales\npassword: {{ .DB_PASSWORD }}"
            MODE: '{{ "production" }}'

  - it: quotes a template.data key that YAML reads as a boolean (TRUE)
    set:
      externalSecret.template.data:
        "TRUE": "{{ .DB_PASSWORD }}"
    asserts:
      - equal:
          path: spec.target.template.data
          value:
            "TRUE": "{{ .DB_PASSWORD }}"
