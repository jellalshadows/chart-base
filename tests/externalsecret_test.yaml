suite: externalsecret
templates:
  - templates/externalsecret.yaml
release:
  name: vending
  namespace: vending
capabilities:
  majorVersion: 1
  minorVersion: 33
chart:
  version: 0.0.0-test
values:
  - values/base.yaml
set:
  externalSecret.enabled: true
  externalSecret.secretStoreRef.name: gcp-sm
  externalSecret.data.DB_PASSWORD.key: sales-db-password
tests:
  - it: renders an external-secrets.io/v1 ExternalSecret (v1beta1 is no longer served)
    asserts:
      - isKind:
          of: ExternalSecret
      - isAPIVersion:
          of: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: vending-chart-base-secrets
      - notExists:
          path: metadata.annotations

  - it: targets an owned Secret with the same name as the ExternalSecret
    asserts:
      - equal:
          path: spec.target
          value:
            name: vending-chart-base-secrets
            creationPolicy: Owner

  - it: references the store and maps each env var to a remote key
    set:
      externalSecret.data.DB_USER.key: sales-db
      externalSecret.data.DB_USER.property: username
    asserts:
      - equal:
          path: spec.secretStoreRef
          value:
            kind: ClusterSecretStore
            name: gcp-sm
      - equal:
          path: spec.refreshInterval
          value: 1h
      - contains:
          path: spec.data
          content:
            secretKey: DB_PASSWORD
            remoteRef:
              key: sales-db-password
      - contains:
          path: spec.data
          content:
            secretKey: DB_USER
            remoteRef:
              key: sales-db
              property: username

  - it: renders nothing when disabled
    set:
      externalSecret.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps a secret store named true a string
    set:
      externalSecret.secretStoreRef.name: "true"
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: "true"

  - it: keeps an externalSecret.data key TRUE a string in secretKey
    set:
      externalSecret.data.TRUE.key: /sales/flag
    asserts:
      - equal:
          path: spec.data
          value:
            - secretKey: DB_PASSWORD
              remoteRef:
                key: sales-db-password
            - secretKey: "TRUE"
              remoteRef:
                key: /sales/flag
