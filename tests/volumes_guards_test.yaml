suite: volumes (schema rules and guards)
templates:
  - templates/validate.yaml
release:
  name: vending
  namespace: vending
capabilities:
  majorVersion: 1
  minorVersion: 33
values:
  - values/base.yaml
tests:
  - it: accepts every type with every field of its own, and a null entry
    set:
      volumes:
        cache: {type: emptyDir, mountPath: /cache, subPath: a, readOnly: false, medium: Memory, sizeLimit: 1Gi}
        rules: {type: configMap, mountPath: /rules, name: r, items: [{key: k, path: p, mode: 0400}], defaultMode: 0440, optional: false}
        certs: {type: secret, mountPath: /certs, readOnly: true, secretName: s, items: [{key: k, path: p}], defaultMode: 0, optional: true}
        data: {type: persistentVolumeClaim, mountPath: /data, claimName: d, claimAccessMode: ReadWriteMany}
        scratch: {type: ephemeral, mountPath: /scratch, size: 1Gi, accessMode: ReadWriteOncePod, storageClassName: fast.ssd}
        gone: null
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts volumes null
    set:
      volumes: null
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts a null for every optional field of an entry, whatever its type
    set:
      volumes:
        cache: {type: emptyDir, mountPath: /cache, subPath: null, readOnly: null, medium: null, sizeLimit: null, name: null, secretName: null, items: null, defaultMode: null, optional: null, claimName: null, claimAccessMode: null, size: null, accessMode: null, storageClassName: null}
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a volume type that chart-base does not offer
    set:
      volumes:
        host: {type: hostPath, mountPath: /host}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/host/type': value must be one of 'emptyDir', 'configMap', 'secret', 'persistentVolumeClaim', 'ephemeral'"

  - it: rejects an entry without a type, naming only the type
    set:
      volumes:
        cache: {mountPath: /cache}
    asserts:
      - failedTemplate:
          errorPattern: "chart-base:\\n- at '/volumes/cache': missing property 'type'\\s*$"

  - it: rejects a null type
    set:
      volumes:
        cache: {type: null, mountPath: /cache}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/cache/type': value must be one of"

  - it: rejects an entry without a mountPath
    set:
      volumes:
        cache: {type: emptyDir}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/cache': missing property 'mountPath'"

  - it: rejects a null mountPath (a mount path is never null, so chart-base.cleanPath is never given a nil)
    set:
      volumes:
        cache: {type: emptyDir, mountPath: null}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/cache/mountPath': got null, want string"

  - it: rejects a relative mountPath (tmp)
    set:
      volumes:
        cache: {type: emptyDir, mountPath: tmp}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/cache/mountPath': 'tmp' does not match pattern '\\^/'"

  - it: rejects a relative mountPath (./tmp)
    set:
      volumes:
        cache: {type: emptyDir, mountPath: ./tmp}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/cache/mountPath': './tmp' does not match pattern '\\^/'"

  - it: rejects a relative mountPath (the token path without its leading slash)
    set:
      volumes:
        token: {type: emptyDir, mountPath: var/run/secrets/kubernetes.io/serviceaccount}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/token/mountPath': 'var/run/secrets/kubernetes.io/serviceaccount' does not match pattern '\\^/'"

  - it: rejects a misspelt field (a closed list of fields, whether the value is null or not)
    set:
      volumes:
        certs: {type: secret, mountPath: /certs, secretName: s, secretname: null}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/certs': additional properties 'secretname' not allowed"

  - it: rejects a secret entry without its secretName
    set:
      volumes:
        certs: {type: secret, mountPath: /certs}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/certs': missing property 'secretName'"

  - it: rejects a configMap entry without its name, a claim without its claimName, an ephemeral volume without its size
    set:
      volumes:
        rules: {type: configMap, mountPath: /rules}
        data: {type: persistentVolumeClaim, mountPath: /data}
        scratch: {type: ephemeral, mountPath: /scratch}
    asserts:
      - failedTemplate:
          errorPattern: "missing property 'name'"
      - failedTemplate:
          errorPattern: "missing property 'claimName'"
      - failedTemplate:
          errorPattern: "missing property 'size'"

  - it: rejects an empty name, secretName and subPath
    set:
      volumes:
        rules: {type: configMap, mountPath: /rules, name: ""}
        certs: {type: secret, mountPath: /certs, secretName: "", subPath: ""}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/rules/name': minLength: got 0, want 1"
      - failedTemplate:
          errorPattern: "/volumes/certs/secretName': minLength: got 0, want 1"
      - failedTemplate:
          errorPattern: "/volumes/certs/subPath': minLength: got 0, want 1"

  - it: rejects items [] (the API reads an empty list as every key)
    set:
      volumes:
        rules: {type: configMap, mountPath: /rules, name: r, items: []}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/rules/items': minItems: got 0, want 1"

  - it: rejects a null item, a null mode and an item without a path (a list is taken as written)
    set:
      volumes:
        a: {type: configMap, mountPath: /a, name: r, items: [null]}
        b: {type: configMap, mountPath: /b, name: r, items: [{key: k, path: p, mode: null}]}
        c: {type: secret, mountPath: /c, secretName: s, items: [{key: k}]}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/a/items/0': got null, want object"
      - failedTemplate:
          errorPattern: "/volumes/b/items/0/mode': got null, want integer"
      - failedTemplate:
          errorPattern: "/volumes/c/items/0': missing property 'path'"

  - it: rejects a mode above 0777 and a mode given as a string (--set cannot pass an octal literal)
    set:
      volumes:
        a: {type: configMap, mountPath: /a, name: r, defaultMode: 512}
        b: {type: secret, mountPath: /b, secretName: s, defaultMode: "0440"}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/a/defaultMode': maximum: got 512, want 511"
      - failedTemplate:
          errorPattern: "/volumes/b/defaultMode': got string, want null or integer"

  - it: rejects a medium other than Memory
    set:
      volumes:
        cache: {type: emptyDir, mountPath: /cache, medium: HugePages}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/cache/medium': value must be one of 'Memory'"

  - it: rejects a size with a sign or no quantity, and a YAML number
    set:
      volumes:
        a: {type: emptyDir, mountPath: /a, sizeLimit: -1Gi}
        b: {type: emptyDir, mountPath: /b, sizeLimit: +1Gi}
        c: {type: ephemeral, mountPath: /c, size: lots}
        d: {type: ephemeral, mountPath: /d, size: 10}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/a/sizeLimit': '-1Gi' does not match pattern"
      - failedTemplate:
          errorPattern: "/volumes/b/sizeLimit': '\\+1Gi' does not match pattern"
      - failedTemplate:
          errorPattern: "/volumes/c/size': 'lots' does not match pattern"
      - failedTemplate:
          errorPattern: "/volumes/d/size': got number, want null or string"

  - it: rejects ReadOnlyMany as the accessMode of an ephemeral volume, and an unknown claimAccessMode
    set:
      volumes:
        scratch: {type: ephemeral, mountPath: /scratch, size: 1Gi, accessMode: ReadOnlyMany}
        data: {type: persistentVolumeClaim, mountPath: /data, claimName: d, claimAccessMode: RWO}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/scratch/accessMode': value must be one of 'ReadWriteOnce', 'ReadWriteOncePod', 'ReadWriteMany'"
      - failedTemplate:
          errorPattern: "/volumes/data/claimAccessMode': value must be one of 'ReadWriteOnce', 'ReadWriteOncePod', 'ReadWriteMany', 'ReadOnlyMany'"

  - it: rejects an empty storageClassName (it turns off dynamic provisioning) and one that is not a DNS-1123 subdomain
    set:
      volumes:
        a: {type: ephemeral, mountPath: /a, size: 1Gi, storageClassName: ""}
        b: {type: ephemeral, mountPath: /b, size: 1Gi, storageClassName: Fast_SSD}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/a/storageClassName': '' does not match pattern"
      - failedTemplate:
          errorPattern: "/volumes/b/storageClassName': 'Fast_SSD' does not match pattern"

  - it: rejects a claimName that is not a DNS-1123 subdomain
    set:
      volumes:
        data: {type: persistentVolumeClaim, mountPath: /data, claimName: Sales_Data}
    asserts:
      - failedTemplate:
          errorPattern: "/volumes/data/claimName': 'Sales_Data' does not match pattern"

  - it: rejects a volume name in camelCase (appData), with the DNS-1123 message
    set:
      volumes:
        appData: {type: emptyDir, mountPath: /data}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.appData: a volume name is a lowercase DNS-1123 label \(a-z, 0-9, "-", at most 63 characters\), e.g. app-data'

  - it: rejects a volume name with an underscore (a_b)
    set:
      volumes:
        a_b: {type: emptyDir, mountPath: /data}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.a_b: a volume name is a lowercase DNS-1123 label \(a-z, 0-9, "-", at most 63 characters\), e.g. app-data'

  - it: rejects a volume name that starts with a dash (-a)
    set:
      volumes:
        -a: {type: emptyDir, mountPath: /data}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.-a: a volume name is a lowercase DNS-1123 label \(a-z, 0-9, "-", at most 63 characters\), e.g. app-data'

  - it: rejects a volume name of 64 characters
    set:
      volumes:
        aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: {type: emptyDir, mountPath: /data}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: a volume name is a lowercase DNS-1123 label \(a-z, 0-9, "-", at most 63 characters\), e.g. app-data'

  - it: accepts a volume name of 63 characters
    set:
      volumes:
        aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: {type: emptyDir, mountPath: /data}
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects the volume name tmp (chart-base's own)
    set:
      volumes:
        tmp: {type: emptyDir, mountPath: /scratch}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.tmp: tmp, config-files and external-secret are the names of volumes chart-base mounts itself \(external-secret from 0.9.0\): choose another name'

  - it: rejects the volume name config-files (chart-base's own)
    set:
      volumes:
        config-files: {type: emptyDir, mountPath: /scratch}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.config-files: tmp, config-files and external-secret are the names of volumes chart-base mounts itself \(external-secret from 0.9.0\): choose another name'

  - it: rejects the volume name external-secret (reserved for 0.9.0)
    set:
      volumes:
        external-secret: {type: emptyDir, mountPath: /scratch}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.external-secret: tmp, config-files and external-secret are the names of volumes chart-base mounts itself \(external-secret from 0.9.0\): choose another name'

  - it: rejects a volume name with the prefix kube-api-access-
    set:
      volumes:
        kube-api-access-x: {type: emptyDir, mountPath: /scratch}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.kube-api-access-x: a name that starts with kube-api-access- \(Kubernetes takes such a volume for the ServiceAccount token volume\) or chart-base- \(reserved for volumes chart-base adds\) is not allowed: choose another name'

  - it: rejects a volume name with the prefix chart-base-
    set:
      volumes:
        chart-base-x: {type: emptyDir, mountPath: /scratch}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.chart-base-x: a name that starts with kube-api-access- \(Kubernetes takes such a volume for the ServiceAccount token volume\) or chart-base- \(reserved for volumes chart-base adds\) is not allowed: choose another name'

  - it: accepts a null entry under any name, even one that fails the name checks (skipped before every check)
    set:
      volumes:
        appData: null
        tmp: null
        external-secret: null
        kube-api-access-x: null
        chart-base-x: null
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a secret entry whose secretName is null, naming the remedies
    set:
      volumes:
        certs: {type: secret, mountPath: /certs, secretName: null}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.certs.secretName is null, and a secret entry needs it: set it, or remove the entry with volumes.certs: null'

  - it: rejects a configMap entry whose name is null
    set:
      volumes:
        rules: {type: configMap, mountPath: /rules, name: null}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.rules.name is null, and a configMap entry needs it: set it, or remove the entry with volumes.rules: null'

  - it: rejects a persistentVolumeClaim entry whose claimName is null
    set:
      volumes:
        data: {type: persistentVolumeClaim, mountPath: /data, claimName: null}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.data.claimName is null, and a persistentVolumeClaim entry needs it: set it, or remove the entry with volumes.data: null'

  - it: rejects an ephemeral entry whose size is null
    set:
      volumes:
        scratch: {type: ephemeral, mountPath: /scratch, size: null}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.scratch.size is null, and an ephemeral entry needs it: set it, or remove the entry with volumes.scratch: null'

  - it: accepts a type change written as an overlay writes it (emptyDir to ephemeral, the emptyDir fields set to null)
    set:
      volumes:
        cache: {type: ephemeral, mountPath: /cache, size: 10Gi, medium: null, sizeLimit: null}
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects medium on an ephemeral entry (a field of type emptyDir)
    set:
      volumes:
        x: {type: ephemeral, mountPath: /x, size: 1Gi, medium: Memory}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.x.medium is a field of type emptyDir and the entry is ephemeral: remove it \(from an overlay, set it to null\)'

  - it: rejects sizeLimit on an ephemeral entry (a field of type emptyDir)
    set:
      volumes:
        x: {type: ephemeral, mountPath: /x, size: 10Gi, sizeLimit: 1Gi}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.x.sizeLimit is a field of type emptyDir and the entry is ephemeral: remove it \(from an overlay, set it to null\)'

  - it: rejects name on a secret entry (a field of type configMap)
    set:
      volumes:
        x: {type: secret, mountPath: /x, secretName: s, name: n}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.x.name is a field of type configMap and the entry is secret: remove it \(from an overlay, set it to null\)'

  - it: rejects secretName on a configMap entry (a field of type secret)
    set:
      volumes:
        x: {type: configMap, mountPath: /x, name: n, secretName: s}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.x.secretName is a field of type secret and the entry is configMap: remove it \(from an overlay, set it to null\)'

  - it: rejects items on an emptyDir entry (a field of type configMap or secret)
    set:
      volumes:
        x: {type: emptyDir, mountPath: /x, items: [{key: k, path: p}]}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.x.items is a field of type configMap or secret and the entry is emptyDir: remove it \(from an overlay, set it to null\)'

  - it: rejects defaultMode on a persistentVolumeClaim entry (a field of type configMap or secret)
    set:
      volumes:
        x: {type: persistentVolumeClaim, mountPath: /x, claimName: c, defaultMode: 0440}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.x.defaultMode is a field of type configMap or secret and the entry is persistentVolumeClaim: remove it \(from an overlay, set it to null\)'

  - it: rejects optional on an ephemeral entry (a field of type configMap or secret)
    set:
      volumes:
        x: {type: ephemeral, mountPath: /x, size: 1Gi, optional: true}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.x.optional is a field of type configMap or secret and the entry is ephemeral: remove it \(from an overlay, set it to null\)'

  - it: rejects claimName on an ephemeral entry (a field of type persistentVolumeClaim)
    set:
      volumes:
        x: {type: ephemeral, mountPath: /x, size: 1Gi, claimName: c}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.x.claimName is a field of type persistentVolumeClaim and the entry is ephemeral: remove it \(from an overlay, set it to null\)'

  - it: rejects claimAccessMode on an ephemeral entry (a field of type persistentVolumeClaim)
    set:
      volumes:
        x: {type: ephemeral, mountPath: /x, size: 1Gi, claimAccessMode: ReadWriteMany}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.x.claimAccessMode is a field of type persistentVolumeClaim and the entry is ephemeral: remove it \(from an overlay, set it to null\)'

  - it: rejects size on an emptyDir entry (a field of type ephemeral)
    set:
      volumes:
        x: {type: emptyDir, mountPath: /x, size: 1Gi}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.x.size is a field of type ephemeral and the entry is emptyDir: remove it \(from an overlay, set it to null\)'

  - it: rejects accessMode on a persistentVolumeClaim entry (a field of type ephemeral)
    set:
      volumes:
        x: {type: persistentVolumeClaim, mountPath: /x, claimName: c, accessMode: ReadWriteMany}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.x.accessMode is a field of type ephemeral and the entry is persistentVolumeClaim: remove it \(from an overlay, set it to null\)'

  - it: rejects storageClassName on a persistentVolumeClaim entry (a field of type ephemeral)
    set:
      volumes:
        x: {type: persistentVolumeClaim, mountPath: /x, claimName: c, storageClassName: fast}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: volumes.x.storageClassName is a field of type ephemeral and the entry is persistentVolumeClaim: remove it \(from an overlay, set it to null\)'
