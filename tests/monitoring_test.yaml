suite: metrics monitors (ServiceMonitor or PodMonitor)
templates:
  - templates/servicemonitor.yaml
release:
  name: vending
  namespace: vending
capabilities:
  majorVersion: 1
  minorVersion: 33
chart:
  version: 0.0.0-test
values:
  - values/base.yaml
tests:
  - it: renders no monitor by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a ServiceMonitor that selects the component's Service and scrapes its http port
    template: templates/servicemonitor.yaml
    set:
      metrics.enabled: true
    asserts:
      - isKind:
          of: ServiceMonitor
      - isAPIVersion:
          of: monitoring.coreos.com/v1
      - equal:
          path: metadata.name
          value: vending-chart-base
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: chart-base
            app.kubernetes.io/instance: vending
      - equal:
          path: spec.endpoints
          value:
            - port: http
              path: /metrics
      - notExists:
          path: spec.namespaceSelector
      - notExists:
          path: metadata.labels.release

  - it: scrapes the Service port named by metrics.port, with the given path, interval and scrapeTimeout
    template: templates/servicemonitor.yaml
    set:
      ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 8081
      metrics.enabled: true
      metrics.port: management
      metrics.path: /actuator/prometheus
      metrics.interval: 30s
      metrics.scrapeTimeout: 10s
    asserts:
      - equal:
          path: spec.endpoints
          value:
            - port: management
              path: /actuator/prometheus
              interval: 30s
              scrapeTimeout: 10s

  - it: adds metrics.labels to the chart's labels (e.g. the release label kube-prometheus-stack selects on)
    template: templates/servicemonitor.yaml
    set:
      metrics.enabled: true
      metrics.labels.release: kube-prometheus-stack
    asserts:
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: chart-base
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: chart-base-0.0.0-test

  - it: renders no ServiceMonitor for a worker without a Service
    template: templates/servicemonitor.yaml
    set:
      service.enabled: false
      ports:
        - name: metrics
          containerPort: 9090
      metrics.enabled: true
      metrics.port: metrics
    asserts:
      - hasDocuments:
          count: 0
