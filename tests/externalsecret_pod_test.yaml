suite: externalSecret in the pod (envFrom, references, mounts; every workload type)
templates:
  - templates/deployment.yaml
  - templates/configmap-env.yaml
  - templates/configmap-files.yaml
  - templates/cronjob.yaml
  - templates/job.yaml
release:
  name: vending
  namespace: vending
capabilities:
  majorVersion: 1
  minorVersion: 33
chart:
  version: 0.0.0-test
values:
  - values/base.yaml
set:
  externalSecret.enabled: true
  externalSecret.secretStoreRef.name: vault
  externalSecret.data.DB_PASSWORD.key: /sales/db-password
tests:
  - it: injects the Secret whole with envFrom by default (envFrom true)
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: vending-chart-base-secrets

  - it: does not inject the Secret with envFrom false, on a deployment
    template: templates/deployment.yaml
    set:
      externalSecret.envFrom: false
      env.PGPASSWORD.valueFrom.secretKeyRef: {name: vending-chart-base-secrets, key: DB_PASSWORD}
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: vending-chart-base-secrets

  - it: does not inject the Secret with envFrom false, on a cronjob (config stays injected)
    template: templates/cronjob.yaml
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
      config.APP_MODE: batch
      externalSecret.envFrom: false
      env.PGPASSWORD.valueFrom.secretKeyRef: {name: vending-chart-base-secrets, key: DB_PASSWORD}
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          value:
            - configMapRef:
                name: vending-chart-base-env

  - it: does not inject the Secret with envFrom false, on a job
    template: templates/job.yaml
    set:
      workload.type: job
      externalSecret.envFrom: false
      env.PGPASSWORD.valueFrom.secretKeyRef: {name: vending-chart-base-secrets, key: DB_PASSWORD}
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: gives a sidecar with inheritEnv the main container's envFrom as rendered (no secretRef with envFrom false)
    template: templates/deployment.yaml
    set:
      config.APP_MODE: api
      externalSecret.envFrom: false
      env.PGPASSWORD.valueFrom.secretKeyRef: {name: vending-chart-base-secrets, key: DB_PASSWORD}
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/proxy, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, inheritEnv: true}
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].envFrom
          value:
            - configMapRef:
                name: vending-chart-base-env

  - it: renders an externalSecretKeyRef as a secretKeyRef on the component's Secret, the key quoted, in the main container
    template: templates/deployment.yaml
    set:
      externalSecret.envFrom: false
      externalSecret.data:
        "true": {key: /sales/flag}
      env:
        PGPASSWORD: {valueFrom: {externalSecretKeyRef: {key: DB_PASSWORD}}}
        FLAG: {valueFrom: {externalSecretKeyRef: {key: "true"}}}
        POD_NAME: {valueFrom: {fieldRef: {fieldPath: metadata.name}}}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: FLAG
              valueFrom:
                secretKeyRef:
                  name: vending-chart-base-secrets
                  key: "true"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: vending-chart-base-secrets
                  key: DB_PASSWORD
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
      - notExists:
          path: spec.template.spec.containers[0].env[0].valueFrom.externalSecretKeyRef

  - it: renders an externalSecretKeyRef in an init container's and a sidecar's own env, and one the main container passes on with inheritEnv
    template: templates/deployment.yaml
    set:
      env.PGPASSWORD.valueFrom.externalSecretKeyRef.key: DB_PASSWORD
      initContainers:
        migrate: {image: {repository: ghcr.io/acme/migrate, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, env: {DB_PASS: {valueFrom: {externalSecretKeyRef: {key: DB_PASSWORD}}}}}
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/proxy, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, inheritEnv: true}
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].env
          value:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: vending-chart-base-secrets
                  key: DB_PASSWORD
      - equal:
          path: spec.template.spec.initContainers[1].env
          value:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: vending-chart-base-secrets
                  key: DB_PASSWORD
      - notExists:
          path: spec.template.spec.initContainers[0].env[0].valueFrom.externalSecretKeyRef

  - it: renders an externalSecretKeyRef in the pod of a cronjob
    template: templates/cronjob.yaml
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
      env.PGPASSWORD.valueFrom.externalSecretKeyRef.key: DB_PASSWORD
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[0].valueFrom
          value:
            secretKeyRef:
              name: vending-chart-base-secrets
              key: DB_PASSWORD

  - it: renders an externalSecretKeyRef in the pod of a job hook
    template: templates/job.yaml
    set:
      workload.type: job
      env.PGPASSWORD.valueFrom.externalSecretKeyRef.key: DB_PASSWORD
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom
          value:
            secretKeyRef:
              name: vending-chart-base-secrets
              key: DB_PASSWORD

  - it: lists the component's Secret once in the Reloader annotation, whatever the number of externalSecretKeyRef
    template: templates/deployment.yaml
    set:
      env.PGPASSWORD.valueFrom.externalSecretKeyRef.key: DB_PASSWORD
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/proxy, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, env: {DB: {valueFrom: {externalSecretKeyRef: {key: DB_PASSWORD}}}}}
    asserts:
      - equal:
          path: metadata.annotations["secret.reloader.stakater.com/reload"]
          value: vending-chart-base-secrets
