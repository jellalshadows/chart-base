suite: externalSecret in the pod (envFrom, references, mounts; every workload type)
templates:
  - templates/deployment.yaml
  - templates/configmap-env.yaml
  - templates/configmap-files.yaml
  - templates/cronjob.yaml
  - templates/job.yaml
release:
  name: vending
  namespace: vending
capabilities:
  majorVersion: 1
  minorVersion: 33
chart:
  version: 0.0.0-test
values:
  - values/base.yaml
set:
  externalSecret.enabled: true
  externalSecret.secretStoreRef.name: vault
  externalSecret.data.DB_PASSWORD.key: /sales/db-password
tests:
  - it: injects the Secret whole with envFrom by default (envFrom true)
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: vending-chart-base-secrets

  - it: does not inject the Secret with envFrom false, on a deployment
    template: templates/deployment.yaml
    set:
      externalSecret.envFrom: false
      env.PGPASSWORD.valueFrom.secretKeyRef: {name: vending-chart-base-secrets, key: DB_PASSWORD}
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: vending-chart-base-secrets

  - it: does not inject the Secret with envFrom false, on a cronjob (config stays injected)
    template: templates/cronjob.yaml
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
      config.APP_MODE: batch
      externalSecret.envFrom: false
      env.PGPASSWORD.valueFrom.secretKeyRef: {name: vending-chart-base-secrets, key: DB_PASSWORD}
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          value:
            - configMapRef:
                name: vending-chart-base-env

  - it: does not inject the Secret with envFrom false, on a job
    template: templates/job.yaml
    set:
      workload.type: job
      externalSecret.envFrom: false
      env.PGPASSWORD.valueFrom.secretKeyRef: {name: vending-chart-base-secrets, key: DB_PASSWORD}
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: gives a sidecar with inheritEnv the main container's envFrom as rendered (no secretRef with envFrom false)
    template: templates/deployment.yaml
    set:
      config.APP_MODE: api
      externalSecret.envFrom: false
      env.PGPASSWORD.valueFrom.secretKeyRef: {name: vending-chart-base-secrets, key: DB_PASSWORD}
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/proxy, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, inheritEnv: true}
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].envFrom
          value:
            - configMapRef:
                name: vending-chart-base-env

  - it: renders an externalSecretKeyRef as a secretKeyRef on the component's Secret, the key quoted, in the main container
    template: templates/deployment.yaml
    set:
      externalSecret.envFrom: false
      externalSecret.data:
        "true": {key: /sales/flag}
      env:
        PGPASSWORD: {valueFrom: {externalSecretKeyRef: {key: DB_PASSWORD}}}
        FLAG: {valueFrom: {externalSecretKeyRef: {key: "true"}}}
        POD_NAME: {valueFrom: {fieldRef: {fieldPath: metadata.name}}}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: FLAG
              valueFrom:
                secretKeyRef:
                  name: vending-chart-base-secrets
                  key: "true"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: vending-chart-base-secrets
                  key: DB_PASSWORD
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
      - notExists:
          path: spec.template.spec.containers[0].env[0].valueFrom.externalSecretKeyRef

  - it: renders an externalSecretKeyRef in an init container's and a sidecar's own env, and one the main container passes on with inheritEnv
    template: templates/deployment.yaml
    set:
      env.PGPASSWORD.valueFrom.externalSecretKeyRef.key: DB_PASSWORD
      initContainers:
        migrate: {image: {repository: ghcr.io/acme/migrate, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, env: {DB_PASS: {valueFrom: {externalSecretKeyRef: {key: DB_PASSWORD}}}}}
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/proxy, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, inheritEnv: true}
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].env
          value:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: vending-chart-base-secrets
                  key: DB_PASSWORD
      - equal:
          path: spec.template.spec.initContainers[1].env
          value:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: vending-chart-base-secrets
                  key: DB_PASSWORD
      - notExists:
          path: spec.template.spec.initContainers[0].env[0].valueFrom.externalSecretKeyRef

  - it: renders an externalSecretKeyRef in the pod of a cronjob
    template: templates/cronjob.yaml
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
      env.PGPASSWORD.valueFrom.externalSecretKeyRef.key: DB_PASSWORD
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[0].valueFrom
          value:
            secretKeyRef:
              name: vending-chart-base-secrets
              key: DB_PASSWORD

  - it: renders an externalSecretKeyRef in the pod of a job hook
    template: templates/job.yaml
    set:
      workload.type: job
      env.PGPASSWORD.valueFrom.externalSecretKeyRef.key: DB_PASSWORD
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom
          value:
            secretKeyRef:
              name: vending-chart-base-secrets
              key: DB_PASSWORD

  - it: lists the component's Secret once in the Reloader annotation, whatever the number of externalSecretKeyRef
    template: templates/deployment.yaml
    set:
      env.PGPASSWORD.valueFrom.externalSecretKeyRef.key: DB_PASSWORD
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/proxy, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, env: {DB: {valueFrom: {externalSecretKeyRef: {key: DB_PASSWORD}}}}}
    asserts:
      - equal:
          path: metadata.annotations["secret.reloader.stakater.com/reload"]
          value: vending-chart-base-secrets

  - it: mounts the Secret read-only at mountPath in the main container, after tmp and config-files and before the volumes entries, with every key
    template: templates/deployment.yaml
    set:
      externalSecret.mountPath: /etc/secrets
      configFiles.files: {app.yaml: "a: b"}
      volumes:
        cache: {type: emptyDir, mountPath: /cache}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: tmp
              mountPath: /tmp
            - name: config-files
              mountPath: /config
              readOnly: true
            - name: external-secret
              mountPath: /etc/secrets
              readOnly: true
            - name: cache
              mountPath: /cache
      - equal:
          path: spec.template.spec.volumes[2]
          value:
            name: external-secret
            secret:
              secretName: vending-chart-base-secrets

  - it: renders items and defaultMode on the volume external-secret, the strings quoted and the modes integers
    template: templates/deployment.yaml
    set:
      externalSecret.mountPath: /etc/secrets
      externalSecret.items: [{key: DB_PASSWORD, path: "true", mode: 0400}]
      externalSecret.defaultMode: 0440
    asserts:
      - equal:
          path: spec.template.spec.volumes[1]
          value:
            name: external-secret
            secret:
              secretName: vending-chart-base-secrets
              items:
                - key: DB_PASSWORD
                  path: "true"
                  mode: 256
              defaultMode: 288

  - it: renders a defaultMode and an items[].mode of 0 on the volume external-secret (0 is a mode, not an absent one)
    template: templates/deployment.yaml
    set:
      externalSecret.mountPath: /etc/secrets
      externalSecret.items: [{key: DB_PASSWORD, path: db, mode: 0}]
      externalSecret.defaultMode: 0
    asserts:
      - equal:
          path: spec.template.spec.volumes[1]
          value:
            name: external-secret
            secret:
              secretName: vending-chart-base-secrets
              items:
                - key: DB_PASSWORD
                  path: db
                  mode: 0
              defaultMode: 0

  - it: mounts the Secret in the pod of a cronjob
    template: templates/cronjob.yaml
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
      externalSecret.mountPath: /etc/secrets
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts[1]
          value:
            name: external-secret
            mountPath: /etc/secrets
            readOnly: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[1].name
          value: external-secret

  - it: mounts the Secret in the pod of a job hook
    template: templates/job.yaml
    set:
      workload.type: job
      externalSecret.mountPath: /etc/secrets
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1]
          value:
            name: external-secret
            mountPath: /etc/secrets
            readOnly: true
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: vending-chart-base-secrets

  - it: renders no volume external-secret and no mount while mountPath is null and no container mounts it
    template: templates/deployment.yaml
    set:
      externalSecret.mountPath: null
      externalSecret.items: null
      externalSecret.defaultMode: null
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: tmp
              emptyDir: {}
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1

  - it: renders no volume external-secret for a sidecar that mounts only another volume (tmp)
    template: templates/deployment.yaml
    set:
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/proxy, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, volumeMounts: {tmp: {mountPath: /tmp}}}
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: tmp
              emptyDir: {}

  - it: renders the volume for a sidecar that mounts external-secret, read-only, without a main-container mount
    template: templates/deployment.yaml
    set:
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/proxy, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, volumeMounts: {external-secret: {mountPath: /secrets}}}
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts
          value:
            - name: external-secret
              mountPath: /secrets
              readOnly: true
      - equal:
          path: spec.template.spec.volumes[1]
          value:
            name: external-secret
            secret:
              secretName: vending-chart-base-secrets
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1

  - it: renders an init container's subPath mount of one key of the Secret, read-only
    template: templates/deployment.yaml
    set:
      externalSecret.envFrom: false
      externalSecret.data:
        tls.crt: {key: /sales/tls, property: crt}
      initContainers:
        setup: {image: {repository: ghcr.io/acme/setup, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, volumeMounts: {external-secret: {mountPath: /etc/tls/tls.crt, subPath: tls.crt}}}
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts
          value:
            - name: external-secret
              mountPath: /etc/tls/tls.crt
              subPath: tls.crt
              readOnly: true

  - it: renders no volume external-secret and no mount while the block is disabled, whatever mountPath says
    template: templates/deployment.yaml
    set:
      externalSecret.enabled: false
      externalSecret.mountPath: /etc/secrets
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1

  - it: keeps the Reloader annotation unchanged by the mount (the Secret is listed once, the block being enabled)
    template: templates/deployment.yaml
    set:
      externalSecret.mountPath: /etc/secrets
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/proxy, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, volumeMounts: {external-secret: {mountPath: /secrets}}}
    asserts:
      - equal:
          path: metadata.annotations["secret.reloader.stakater.com/reload"]
          value: vending-chart-base-secrets
