suite: externalSecret in the pod (envFrom, references, mounts; every workload type)
templates:
  - templates/deployment.yaml
  - templates/configmap-env.yaml
  - templates/configmap-files.yaml
  - templates/cronjob.yaml
  - templates/job.yaml
release:
  name: vending
  namespace: vending
capabilities:
  majorVersion: 1
  minorVersion: 33
chart:
  version: 0.0.0-test
values:
  - values/base.yaml
set:
  externalSecret.enabled: true
  externalSecret.secretStoreRef.name: vault
  externalSecret.data.DB_PASSWORD.key: /sales/db-password
tests:
  - it: injects the Secret whole with envFrom by default (envFrom true)
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: vending-chart-base-secrets

  - it: does not inject the Secret with envFrom false, on a deployment
    template: templates/deployment.yaml
    set:
      externalSecret.envFrom: false
      env.PGPASSWORD.valueFrom.secretKeyRef: {name: vending-chart-base-secrets, key: DB_PASSWORD}
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: vending-chart-base-secrets

  - it: does not inject the Secret with envFrom false, on a cronjob (config stays injected)
    template: templates/cronjob.yaml
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
      config.APP_MODE: batch
      externalSecret.envFrom: false
      env.PGPASSWORD.valueFrom.secretKeyRef: {name: vending-chart-base-secrets, key: DB_PASSWORD}
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          value:
            - configMapRef:
                name: vending-chart-base-env

  - it: does not inject the Secret with envFrom false, on a job
    template: templates/job.yaml
    set:
      workload.type: job
      externalSecret.envFrom: false
      env.PGPASSWORD.valueFrom.secretKeyRef: {name: vending-chart-base-secrets, key: DB_PASSWORD}
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: gives a sidecar with inheritEnv the main container's envFrom as rendered (no secretRef with envFrom false)
    template: templates/deployment.yaml
    set:
      config.APP_MODE: api
      externalSecret.envFrom: false
      env.PGPASSWORD.valueFrom.secretKeyRef: {name: vending-chart-base-secrets, key: DB_PASSWORD}
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/proxy, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, inheritEnv: true}
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].envFrom
          value:
            - configMapRef:
                name: vending-chart-base-env
