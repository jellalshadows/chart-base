suite: exposure (httproute and ingress)
templates:
  - templates/httproute.yaml
  - templates/ingress.yaml
release:
  name: vending
  namespace: vending
capabilities:
  majorVersion: 1
  minorVersion: 33
chart:
  version: 0.0.0-test
values:
  - values/base.yaml
tests:
  - it: renders no HTTPRoute and no Ingress by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a Gateway API v1 HTTPRoute to the component Service
    template: templates/httproute.yaml
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: platform-gw
          namespace: gateway
          sectionName: https
      httpRoute.hostnames:
        - sales.example.com
      ports:
        - name: http
          containerPort: 8080
          servicePort: 80
    asserts:
      - isAPIVersion:
          of: gateway.networking.k8s.io/v1
      - equal:
          path: spec.parentRefs
          value:
            - name: platform-gw
              namespace: gateway
              sectionName: https
      - equal:
          path: spec.hostnames
          value:
            - sales.example.com
      - equal:
          path: spec.rules[0]
          value:
            matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: vending-chart-base
                port: 80

  - it: renders httpRoute.rules after the first rule, each to its ports entry by name or to the first entry without one
    template: templates/httproute.yaml
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: platform-gw
      ports:
        - {name: http, containerPort: 8080, servicePort: 80}
        - {name: grpc, containerPort: 9090}
      httpRoute.rules:
        - matches: [{path: {type: PathPrefix, value: /api}}, {headers: [{name: x-grpc, value: 'yes'}]}]
          port: grpc
        - matches: [{path: {type: Exact, value: /health}, method: GET}]
    asserts:
      - equal:
          path: spec.rules
          value:
            - matches:
                - path: {type: PathPrefix, value: /}
              backendRefs:
                - {name: vending-chart-base, port: 80}
            - matches:
                - path: {type: PathPrefix, value: /api}
                - headers: [{name: x-grpc, value: 'yes'}]
              backendRefs:
                - {name: vending-chart-base, port: 9090}
            - matches:
                - {path: {type: Exact, value: /health}, method: GET}
              backendRefs:
                - {name: vending-chart-base, port: 80}

  - it: renders a rule's port set to null as the first ports entry
    template: templates/httproute.yaml
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: platform-gw
      ports:
        - {name: http, containerPort: 8080, servicePort: 80}
        - {name: grpc, containerPort: 9090}
      httpRoute.rules:
        - {matches: [{path: {type: PathPrefix, value: /v2}}], port: null}
    asserts:
      - equal:
          path: spec.rules[1].backendRefs
          value:
            - {name: vending-chart-base, port: 80}

  - it: renders httpRoute.rules set to null as no extra rule (the default)
    template: templates/httproute.yaml
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: platform-gw
      ports:
        - {name: http, containerPort: 8080, servicePort: 80}
        - {name: grpc, containerPort: 9090}
      httpRoute.rules: null
    asserts:
      - equal:
          path: spec.rules
          value:
            - matches:
                - path: {type: PathPrefix, value: /}
              backendRefs:
                - {name: vending-chart-base, port: 80}

  - it: rejects an unknown key in an httpRoute rule, at the rule's path
    template: templates/httproute.yaml
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: platform-gw
      httpRoute.rules:
        - {matches: [{path: {type: PathPrefix, value: /api}}], backendRefs: [{name: other, port: 80}]}
    asserts:
      - failedTemplate:
          errorPattern: "at '/httpRoute/rules/0': additional properties 'backendRefs' not allowed"

  - it: renders an Ingress with the required className and no controller annotations
    template: templates/ingress.yaml
    set:
      ingress.enabled: true
      ingress.className: internal
      ingress.hosts:
        - host: sales.internal.example.com
          paths:
            - path: /
              pathType: Prefix
    asserts:
      - isAPIVersion:
          of: networking.k8s.io/v1
      - equal:
          path: spec.ingressClassName
          value: internal
      - notExists:
          path: metadata.annotations
      - equal:
          path: spec.rules[0].http.paths[0].backend
          value:
            service:
              name: vending-chart-base
              port:
                name: http

  - it: keeps a port named true a string in the Ingress backend port name
    template: templates/ingress.yaml
    set:
      ports:
        - name: "true"
          containerPort: 8080
      ingress.enabled: true
      ingress.className: internal
      ingress.hosts:
        - host: sales.internal.example.com
          paths:
            - path: /
              pathType: Prefix
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.name
          value: "true"

  - it: keeps an ingress.className named true a string
    template: templates/ingress.yaml
    set:
      ingress.enabled: true
      ingress.className: "true"
      ingress.hosts:
        - host: sales.internal.example.com
          paths:
            - path: /
              pathType: Prefix
    asserts:
      - equal:
          path: spec.ingressClassName
          value: "true"

  - it: keeps an Ingress path named null a string (a plain null drops the path, which an ImplementationSpecific rule accepts)
    template: templates/ingress.yaml
    set:
      ingress.enabled: true
      ingress.className: internal
      ingress.hosts:
        - host: sales.internal.example.com
          paths:
            - path: "null"
              pathType: ImplementationSpecific
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: "null"

  - it: rejects ingress.className null while the Ingress is enabled (a class is required, no cluster default; ADR-0061)
    template: templates/ingress.yaml
    set:
      ingress.enabled: true
      ingress.className: null
      ingress.hosts:
        - host: sales.example.com
          paths:
            - {path: /, pathType: Prefix}
    asserts:
      - failedTemplate:
          errorPattern: "/ingress': missing property 'className'"

  - it: accepts ingress.className null while the Ingress is disabled (the class is required by the when-enabled branch only)
    template: templates/ingress.yaml
    set:
      ingress.className: null
    asserts:
      - hasDocuments:
          count: 0

  - it: renders every Standard field of a parentRef and of a match, as written
    template: templates/httproute.yaml
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - {group: gateway.networking.k8s.io, kind: Gateway, namespace: gateway, name: platform-gw, sectionName: https, port: 443}
      httpRoute.matches:
        - path: {type: PathPrefix, value: /api}
          headers: [{name: x-env, type: Exact, value: canary}]
          queryParams: [{name: tier, type: RegularExpression, value: "gold|silver"}]
          method: GET
    asserts:
      - equal:
          path: spec.parentRefs
          value:
            - {group: gateway.networking.k8s.io, kind: Gateway, namespace: gateway, name: platform-gw, sectionName: https, port: 443}
      - equal:
          path: spec.rules[0].matches
          value:
            - path: {type: PathPrefix, value: /api}
              headers: [{name: x-env, type: Exact, value: canary}]
              queryParams: [{name: tier, type: RegularExpression, value: "gold|silver"}]
              method: GET
