suite: service
templates:
  - templates/service.yaml
release:
  name: vending
  namespace: vending
capabilities:
  majorVersion: 1
  minorVersion: 33
chart:
  version: 0.0.0-test
values:
  - values/base.yaml
tests:
  - it: renders a ClusterIP Service selecting the component pods
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: vending-chart-base
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: chart-base
            app.kubernetes.io/instance: vending

  - it: exposes every port, defaulting servicePort to containerPort
    set:
      ports:
        - name: http
          containerPort: 8080
          servicePort: 80
        - name: grpc
          containerPort: 9090
    asserts:
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 80
              targetPort: http
              protocol: TCP
            - name: grpc
              port: 9090
              targetPort: grpc
              protocol: TCP

  - it: renders no Service for a worker
    set:
      service.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no Service for a cronjob even though service.enabled defaults to true
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps a port named true a string in the Service port name (a plain true is a YAML boolean)
    set:
      ports:
        - name: "true"
          containerPort: 8080
    asserts:
      - equal:
          path: spec.ports[0].name
          value: "true"

  - it: keeps a port named true a string in the Service targetPort
    set:
      ports:
        - name: "true"
          containerPort: 8080
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: "true"
