  - it: rejects a liveness httpGet port name that no ports entry declares, next to a valid readiness probe
    set:
      probes.readiness.httpGet: {path: /ready, port: http}
      probes.liveness.httpGet: {path: /live, port: htpp}
    asserts:
      - failedTemplate:
          errorPattern: 'probes.liveness.httpGet.port "htpp" is not the name of an entry in ports: the kubelet cannot resolve it and never runs the probe. Use the port number, or declare the name in ports \(a ports entry also becomes a Service port when a Service is rendered, and is opened by networkPolicy.ingress.fromComponents/fromNamespaces\), or remove the probe'

  - it: rejects a startup httpGet port name that no ports entry declares
    set:
      probes.startup.httpGet: {path: /started, port: web}
    asserts:
      - failedTemplate:
          errorPattern: 'probes.startup.httpGet.port "web" is not the name of an entry in ports: the kubelet cannot resolve it and never runs the probe'

  - it: rejects a readiness httpGet port name that no ports entry declares on a cronjob
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
      probes.readiness.httpGet: {path: /ready, port: web}
    asserts:
      - failedTemplate:
          errorPattern: 'probes.readiness.httpGet.port "web" is not the name of an entry in ports: the kubelet cannot resolve it and never runs the probe'

  - it: rejects a startup tcpSocket port name on a job with ports []
    set:
      workload.type: job
      ports: []
      probes.startup.tcpSocket: {port: grpc}
    asserts:
      - failedTemplate:
          errorPattern: 'probes.startup.tcpSocket.port "grpc" is not the name of an entry in ports: the kubelet cannot resolve it and never runs the probe'

  - it: rejects a liveness tcpSocket port name that no ports entry declares
    set:
      probes.liveness.tcpSocket: {port: grpc}
    asserts:
      - failedTemplate:
          errorPattern: 'probes.liveness.tcpSocket.port "grpc" is not the name of an entry in ports: the kubelet cannot resolve it and never runs the probe'

  - it: rejects a readiness tcpSocket port name that no ports entry declares on a cronjob
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
      probes.readiness.tcpSocket: {port: grpc}
    asserts:
      - failedTemplate:
          errorPattern: 'probes.readiness.tcpSocket.port "grpc" is not the name of an entry in ports: the kubelet cannot resolve it and never runs the probe'

  - it: rejects a probe on http once ports null removes the default http port
    set:
      service.enabled: false
      ports: null
      probes.liveness.httpGet: {path: /live, port: http}
    asserts:
      - failedTemplate:
          errorPattern: 'probes.liveness.httpGet.port "http" is not the name of an entry in ports: the kubelet cannot resolve it and never runs the probe'

  - it: rejects a quoted number as a probe port (a string is a port name)
    set:
      probes.liveness.httpGet: {path: /live, port: "8080"}
    asserts:
      - failedTemplate:
          errorPattern: 'probes.liveness.httpGet.port "8080" is not the name of an entry in ports: the kubelet cannot resolve it and never runs the probe'

  - it: rejects a probe handler that is a string
    set:
      probes.readiness.httpGet: x
    asserts:
      - failedTemplate:
          errorPattern: 'probes.readiness.httpGet must be a map, e.g. .port: 8080., got string'

  - it: rejects a probe handler that is a list
    set:
      probes.startup.tcpSocket: [8080]
    asserts:
      - failedTemplate:
          errorPattern: 'probes.startup.tcpSocket must be a map, e.g. .port: 8080., got slice'

  - it: accepts numeric probe ports with no ports entry (a worker with ports [])
    set:
      service.enabled: false
      ports: []
      probes.liveness.httpGet: {path: /live, port: 8080}
      probes.readiness.tcpSocket: {port: 8080}
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts a declared port name on each of the three probes
    set:
      probes.startup.httpGet: {path: /started, port: http}
      probes.liveness.tcpSocket: {port: http}
      probes.readiness.httpGet: {path: /ready, port: http}
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts exec and grpc probes (no port name to check)
    set:
      probes.liveness.exec: {command: [cat, /tmp/healthy]}
      probes.readiness.grpc: {port: 9090}
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts a null handler next to another handler (an override switching handlers)
    set:
      probes.liveness.httpGet: null
      probes.liveness.tcpSocket: {port: http}
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts a probe handler without a port (not checked here)
    set:
      probes.readiness.httpGet: {path: /ready}
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts an absent probe and an empty one
    set:
      probes.startup: null
      probes.liveness: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects an empty rollingUpdate with a Recreate strategy (Kubernetes rejects any rollingUpdate with Recreate)
    set:
      strategy:
        type: Recreate
        rollingUpdate: {}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: strategy.rollingUpdate is set and strategy.type is Recreate, which Kubernetes rejects \(an empty rollingUpdate too\): remove strategy.rollingUpdate \(from an override file over values that set it, write strategy: \{type: Recreate, rollingUpdate: null\}\), or set strategy.type: RollingUpdate'

  - it: accepts a Recreate strategy whose rollingUpdate is null (an override file removes it so)
    set:
      strategy:
        type: Recreate
        rollingUpdate: null
    asserts:
      - hasDocuments:
          count: 0
