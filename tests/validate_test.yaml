suite: guards (templates/validate.yaml)
templates:
  - templates/validate.yaml
release:
  name: vending
  namespace: vending
capabilities:
  majorVersion: 1
  minorVersion: 33
values:
  - values/base.yaml
tests:
  - it: renders nothing for valid values
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a release name that Helm accepts but DNS-1035 does not (dots)
    release:
      name: vending.prod
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: resource name "vending.prod-chart-base" \(release-alias\) must match'

  - it: rejects resource names longer than 63 characters (fails, never truncates)
    release:
      name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - failedTemplate:
          errorPattern: "is 64 chars, max is 63 for workload.type deployment"

  - it: allows a 53-char name for a deployment but not for a cronjob (52 max)
    release:
      name: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
    asserts:
      - failedTemplate:
          errorPattern: "is 53 chars, max is 52 for workload.type cronjob"

  - it: accepts the same 53-char name for a deployment
    release:
      name: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts a name that is exactly 63 characters for a deployment
    release:
      name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts a name that is exactly 52 characters for a cronjob
    release:
      name: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
    asserts:
      - hasDocuments:
          count: 0

  - it: requires Kubernetes >= 1.33 (Helm does not check a subchart kubeVersion)
    capabilities:
      majorVersion: 1
      minorVersion: 32
    asserts:
      - failedTemplate:
          errorPattern: "Kubernetes >= 1.33 is required"

  - it: accepts newer Kubernetes versions (1.37)
    capabilities:
      majorVersion: 1
      minorVersion: 37
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects autoscaling.minReplicas > maxReplicas
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 5
      autoscaling.maxReplicas: 2
    asserts:
      - failedTemplate:
          errorPattern: "autoscaling.minReplicas must be <= autoscaling.maxReplicas"

  - it: rejects configFiles.mountPath /tmp
    set:
      configFiles.mountPath: /tmp/
    asserts:
      - failedTemplate:
          errorPattern: "configFiles.mountPath must not be /tmp"

  - it: rejects preStopSleepSeconds >= terminationGracePeriodSeconds
    set:
      preStopSleepSeconds: 30
      terminationGracePeriodSeconds: 30
    asserts:
      - failedTemplate:
          errorPattern: "preStopSleepSeconds must be lower than terminationGracePeriodSeconds"

  - it: skips the preStop check when preStop is disabled
    set:
      preStopSleepSeconds: 0
      terminationGracePeriodSeconds: 0
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a literal value in env with a pointer to config
    set:
      env.FOO: bar
    asserts:
      - failedTemplate:
          errorPattern: "env.FOO is a literal value: literal values belong in config"

  - it: rejects an env key that duplicates a config key
    set:
      config.APP_MODE: api
      env.APP_MODE.valueFrom.fieldRef.fieldPath: metadata.name
    asserts:
      - failedTemplate:
          errorPattern: "env.APP_MODE duplicates a key of config or externalSecret.data"

  - it: rejects an env key that duplicates an externalSecret.data key
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: gcp-sm
      externalSecret.data.DB_PASSWORD.key: sales-db-password
      env.DB_PASSWORD.valueFrom.secretKeyRef.name: db-app
      env.DB_PASSWORD.valueFrom.secretKeyRef.key: password
    asserts:
      - failedTemplate:
          errorPattern: "env.DB_PASSWORD duplicates a key of config or externalSecret.data"

  - it: does not crash on env when config is null (null deletes the default map)
    set:
      config: null
      env.POD_NAME.valueFrom.fieldRef.fieldPath: metadata.name
    asserts:
      - hasDocuments:
          count: 0

  - it: does not crash on env when externalSecret.data is null
    set:
      externalSecret.data: null
      env.POD_NAME.valueFrom.fieldRef.fieldPath: metadata.name
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a Kubernetes-style env list with a pointer to config
    set:
      env:
        - name: FOO
          value: bar
    asserts:
      - failedTemplate:
          errorPattern: 'env is a map of NAME: \{valueFrom: \.\.\.\}, not a Kubernetes env list: literal values belong in config, references in env as a map'

  - it: rejects maxSurge and maxUnavailable both 0 (Kubernetes rejects it)
    set:
      strategy.type: RollingUpdate
      strategy.rollingUpdate.maxSurge: 0
      strategy.rollingUpdate.maxUnavailable: 0
    asserts:
      - failedTemplate:
          errorPattern: "strategy.rollingUpdate.maxSurge and maxUnavailable cannot both be 0"

  - it: counts 0% as 0 in the maxSurge and maxUnavailable check
    set:
      strategy.type: RollingUpdate
      strategy.rollingUpdate.maxSurge: 0%
      strategy.rollingUpdate.maxUnavailable: 0
    asserts:
      - failedTemplate:
          errorPattern: "strategy.rollingUpdate.maxSurge and maxUnavailable cannot both be 0"

  - it: accepts a percentage maxSurge with maxUnavailable 0
    set:
      strategy.type: RollingUpdate
      strategy.rollingUpdate.maxSurge: 25%
      strategy.rollingUpdate.maxUnavailable: 0
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects minReadySeconds >= progressDeadlineSeconds (Kubernetes rejects it)
    set:
      minReadySeconds: 240
    asserts:
      - failedTemplate:
          errorPattern: "minReadySeconds must be lower than progressDeadlineSeconds"

  - it: accepts minReadySeconds just below progressDeadlineSeconds
    set:
      minReadySeconds: 239
    asserts:
      - hasDocuments:
          count: 0

  - it: skips the rollout checks for workloads that are not Deployments (the keys are ignored there)
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
      minReadySeconds: 240
      strategy.type: RollingUpdate
      strategy.rollingUpdate.maxSurge: 0
      strategy.rollingUpdate.maxUnavailable: 0
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects lifecycle.preStop together with the built-in preStop sleep on Deployments
    set:
      lifecycle.preStop.exec.command: ["/app/drain"]
    asserts:
      - failedTemplate:
          errorPattern: "lifecycle.preStop replaces the built-in preStop sleep: set preStopSleepSeconds: 0"

  - it: accepts lifecycle.preStop on a Deployment with preStopSleepSeconds 0
    set:
      preStopSleepSeconds: 0
      lifecycle.preStop.exec.command: ["/app/drain"]
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts lifecycle.preStop on a Job hook with the default preStopSleepSeconds (the sleep is for Deployments only)
    set:
      workload.type: job
      lifecycle.preStop.exec.command: ["/app/flush"]
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a lifecycle sleep longer than terminationGracePeriodSeconds (Kubernetes rejects it)
    set:
      preStopSleepSeconds: 0
      lifecycle.preStop.sleep.seconds: 31
    asserts:
      - failedTemplate:
          errorPattern: 'lifecycle.preStop.sleep.seconds \(31\) must not be greater than terminationGracePeriodSeconds \(30\)'

  - it: accepts a lifecycle sleep equal to terminationGracePeriodSeconds (the API server's bound)
    set:
      preStopSleepSeconds: 0
      lifecycle.preStop.sleep.seconds: 30
    asserts:
      - hasDocuments:
          count: 0

  - it: checks a postStart sleep of a CronJob against terminationGracePeriodSeconds too (every pod is validated)
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
      terminationGracePeriodSeconds: 10
      lifecycle.postStart.sleep.seconds: 11
    asserts:
      - failedTemplate:
          errorPattern: 'lifecycle.postStart.sleep.seconds \(11\) must not be greater than terminationGracePeriodSeconds \(10\)'

  - it: rejects a metrics.port that is not the name of an entry in ports
    set:
      metrics.enabled: true
      metrics.port: metrics
    asserts:
      - failedTemplate:
          errorPattern: 'metrics.port "metrics" is not the name of an entry in ports'

  - it: accepts a metrics.port that names any entry of ports, not only the first
    set:
      ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9090
      metrics.enabled: true
      metrics.port: metrics
    asserts:
      - hasDocuments:
          count: 0

  - it: skips the metrics port check when metrics is off (a worker may have no ports)
    set:
      service.enabled: false
      ports: []
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects metrics on a worker that declares no port (a PodMonitor scrapes a named container port)
    set:
      service.enabled: false
      ports: []
      metrics.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'metrics.port "http" is not the name of an entry in ports'

  - it: accepts metrics on a worker with a named container port
    set:
      service.enabled: false
      ports:
        - name: metrics
          containerPort: 9090
      metrics.enabled: true
      metrics.port: metrics
    asserts:
      - hasDocuments:
          count: 0
