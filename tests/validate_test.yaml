suite: guards (templates/validate.yaml)
templates:
  - templates/validate.yaml
release:
  name: vending
  namespace: vending
capabilities:
  majorVersion: 1
  minorVersion: 33
values:
  - values/base.yaml
tests:
  - it: renders nothing for valid values
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a release name that Helm accepts but DNS-1035 does not (dots)
    release:
      name: vending.prod
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: resource name "vending.prod-chart-base" \(release-alias\) must match'

  - it: rejects resource names longer than 63 characters (fails, never truncates)
    release:
      name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - failedTemplate:
          errorPattern: "is 64 chars, max is 63 for workload.type deployment"

  - it: allows a 53-char name for a deployment but not for a cronjob (52 max)
    release:
      name: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
    asserts:
      - failedTemplate:
          errorPattern: "is 53 chars, max is 52 for workload.type cronjob"

  - it: accepts the same 53-char name for a deployment
    release:
      name: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts a name that is exactly 63 characters for a deployment
    release:
      name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts a name that is exactly 52 characters for a cronjob
    release:
      name: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
    asserts:
      - hasDocuments:
          count: 0

  - it: requires Kubernetes >= 1.33 (Helm does not check a subchart kubeVersion)
    capabilities:
      majorVersion: 1
      minorVersion: 32
    asserts:
      - failedTemplate:
          errorPattern: "Kubernetes >= 1.33 is required"

  - it: accepts newer Kubernetes versions (1.37)
    capabilities:
      majorVersion: 1
      minorVersion: 37
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects autoscaling.minReplicas > maxReplicas
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 5
      autoscaling.maxReplicas: 2
    asserts:
      - failedTemplate:
          errorPattern: "autoscaling.minReplicas must be <= autoscaling.maxReplicas"

  - it: rejects configFiles.mountPath /tmp
    set:
      configFiles.mountPath: /tmp/
    asserts:
      - failedTemplate:
          errorPattern: "configFiles.mountPath must not be /tmp"

  - it: rejects preStopSleepSeconds >= terminationGracePeriodSeconds
    set:
      preStopSleepSeconds: 30
      terminationGracePeriodSeconds: 30
    asserts:
      - failedTemplate:
          errorPattern: "preStopSleepSeconds must be lower than terminationGracePeriodSeconds"

  - it: skips the preStop check when preStop is disabled
    set:
      preStopSleepSeconds: 0
      terminationGracePeriodSeconds: 0
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a literal value in env with a pointer to config
    set:
      env.FOO: bar
    asserts:
      - failedTemplate:
          errorPattern: "env.FOO is a literal value: literal values belong in config"

  - it: rejects an env key that duplicates a config key
    set:
      config.APP_MODE: api
      env.APP_MODE.valueFrom.fieldRef.fieldPath: metadata.name
    asserts:
      - failedTemplate:
          errorPattern: "env.APP_MODE duplicates a key of config or externalSecret.data"

  - it: rejects an env key that duplicates an externalSecret.data key
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: gcp-sm
      externalSecret.data.DB_PASSWORD.key: sales-db-password
      env.DB_PASSWORD.valueFrom.secretKeyRef.name: db-app
      env.DB_PASSWORD.valueFrom.secretKeyRef.key: password
    asserts:
      - failedTemplate:
          errorPattern: "env.DB_PASSWORD duplicates a key of config or externalSecret.data"

  - it: does not crash on env when config is null (null deletes the default map)
    set:
      config: null
      env.POD_NAME.valueFrom.fieldRef.fieldPath: metadata.name
    asserts:
      - hasDocuments:
          count: 0

  - it: does not crash on env when externalSecret.data is null
    set:
      externalSecret.data: null
      env.POD_NAME.valueFrom.fieldRef.fieldPath: metadata.name
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a Kubernetes-style env list with a pointer to config
    set:
      env:
        - name: FOO
          value: bar
    asserts:
      - failedTemplate:
          errorPattern: 'env is a map of NAME: \{valueFrom: \.\.\.\}, not a Kubernetes env list: literal values belong in config, references in env as a map'

  - it: rejects maxSurge and maxUnavailable both 0 (Kubernetes rejects it)
    set:
      strategy.type: RollingUpdate
      strategy.rollingUpdate.maxSurge: 0
      strategy.rollingUpdate.maxUnavailable: 0
    asserts:
      - failedTemplate:
          errorPattern: "strategy.rollingUpdate.maxSurge and maxUnavailable cannot both be 0"

  - it: counts 0% as 0 in the maxSurge and maxUnavailable check
    set:
      strategy.type: RollingUpdate
      strategy.rollingUpdate.maxSurge: 0%
      strategy.rollingUpdate.maxUnavailable: 0
    asserts:
      - failedTemplate:
          errorPattern: "strategy.rollingUpdate.maxSurge and maxUnavailable cannot both be 0"

  - it: accepts a percentage maxSurge with maxUnavailable 0
    set:
      strategy.type: RollingUpdate
      strategy.rollingUpdate.maxSurge: 25%
      strategy.rollingUpdate.maxUnavailable: 0
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects minReadySeconds >= progressDeadlineSeconds (Kubernetes rejects it)
    set:
      minReadySeconds: 240
    asserts:
      - failedTemplate:
          errorPattern: "minReadySeconds must be lower than progressDeadlineSeconds"

  - it: accepts minReadySeconds just below progressDeadlineSeconds
    set:
      minReadySeconds: 239
    asserts:
      - hasDocuments:
          count: 0

  - it: skips the rollout checks for workloads that are not Deployments (the keys are ignored there)
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
      minReadySeconds: 240
      strategy.type: RollingUpdate
      strategy.rollingUpdate.maxSurge: 0
      strategy.rollingUpdate.maxUnavailable: 0
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects lifecycle.preStop together with the built-in preStop sleep on Deployments
    set:
      lifecycle.preStop.exec.command: ["/app/drain"]
    asserts:
      - failedTemplate:
          errorPattern: "lifecycle.preStop replaces the built-in preStop sleep: set preStopSleepSeconds: 0"

  - it: accepts lifecycle.preStop on a Deployment with preStopSleepSeconds 0
    set:
      preStopSleepSeconds: 0
      lifecycle.preStop.exec.command: ["/app/drain"]
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts lifecycle.preStop on a Job hook with the default preStopSleepSeconds (the sleep is for Deployments only)
    set:
      workload.type: job
      lifecycle.preStop.exec.command: ["/app/flush"]
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a lifecycle sleep longer than terminationGracePeriodSeconds (Kubernetes rejects it)
    set:
      preStopSleepSeconds: 0
      lifecycle.preStop.sleep.seconds: 31
    asserts:
      - failedTemplate:
          errorPattern: 'lifecycle.preStop.sleep.seconds \(31\) must not be greater than terminationGracePeriodSeconds \(30\)'

  - it: accepts a lifecycle sleep equal to terminationGracePeriodSeconds (the API server's bound)
    set:
      preStopSleepSeconds: 0
      lifecycle.preStop.sleep.seconds: 30
    asserts:
      - hasDocuments:
          count: 0

  - it: checks a postStart sleep of a CronJob against terminationGracePeriodSeconds too (every pod is validated)
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
      terminationGracePeriodSeconds: 10
      lifecycle.postStart.sleep.seconds: 11
    asserts:
      - failedTemplate:
          errorPattern: 'lifecycle.postStart.sleep.seconds \(11\) must not be greater than terminationGracePeriodSeconds \(10\)'

  - it: rejects a metrics.port that is not the name of an entry in ports
    set:
      metrics.enabled: true
      metrics.port: metrics
    asserts:
      - failedTemplate:
          errorPattern: 'metrics.port "metrics" is not the name of an entry in ports'

  - it: accepts a metrics.port that names any entry of ports, not only the first
    set:
      ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9090
      metrics.enabled: true
      metrics.port: metrics
    asserts:
      - hasDocuments:
          count: 0

  - it: skips the metrics port check when metrics is off (a worker may have no ports)
    set:
      service.enabled: false
      ports: []
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects metrics on a worker that declares no port (a PodMonitor scrapes a named container port)
    set:
      service.enabled: false
      ports: []
      metrics.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'metrics.port "http" is not the name of an entry in ports'

  - it: accepts metrics on a worker with a named container port
    set:
      service.enabled: false
      ports:
        - name: metrics
          containerPort: 9090
      metrics.enabled: true
      metrics.port: metrics
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects metrics without a monitoring namespace when networkPolicy is on (the policy would block Prometheus)
    set:
      metrics.enabled: true
      networkPolicy.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'networkPolicy.ingress.metricsFromNamespaces is empty, but metrics.enabled is true'

  - it: accepts metrics with networkPolicy and a monitoring namespace
    set:
      metrics.enabled: true
      networkPolicy.enabled: true
      networkPolicy.ingress.metricsFromNamespaces: [monitoring]
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects metricsFromNamespaces without metrics.enabled (it would open nothing)
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.metricsFromNamespaces: [monitoring]
    asserts:
      - failedTemplate:
          errorPattern: 'networkPolicy.ingress.metricsFromNamespaces opens metrics.port, but metrics.enabled is false'

  - it: rejects metricsFromNamespaces on a CronJob, where metrics cannot be enabled
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
      networkPolicy.enabled: true
      networkPolicy.ingress.metricsFromNamespaces: [monitoring]
    asserts:
      - failedTemplate:
          errorPattern: 'networkPolicy.ingress.metricsFromNamespaces opens metrics.port, but metrics.enabled is false'

  - it: rejects an HTTPRoute without a source for its traffic when networkPolicy is on (the route would black-hole)
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: platform-gw
          namespace: gateway
      networkPolicy.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "networkPolicy with httpRoute.enabled or ingress.enabled needs a source for the route's traffic"

  - it: rejects an Ingress without a source for its traffic when networkPolicy is on
    set:
      ingress.enabled: true
      ingress.className: internal
      ingress.hosts:
        - host: sales.internal.example.com
          paths:
            - path: /
              pathType: Prefix
      networkPolicy.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "networkPolicy with httpRoute.enabled or ingress.enabled needs a source for the route's traffic"

  - it: accepts an HTTPRoute whose proxies' namespace is in fromNamespaces
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: platform-gw
          namespace: gateway
      networkPolicy.enabled: true
      networkPolicy.ingress.fromNamespaces: [envoy-gateway-system]
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts an HTTPRoute whose source is an extra ingress rule
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: platform-gw
          namespace: gateway
      networkPolicy.enabled: true
      networkPolicy.ingress.extra:
        - from:
            - ipBlock:
                cidr: 10.0.0.0/8
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts an HTTPRoute whose traffic is allowed elsewhere (routeTrafficAllowedElsewhere), and the key opens nothing
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: platform-gw
          namespace: gateway
      networkPolicy.enabled: true
      networkPolicy.ingress.routeTrafficAllowedElsewhere: true
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts an Ingress whose traffic is allowed elsewhere (routeTrafficAllowedElsewhere)
    set:
      ingress.enabled: true
      ingress.className: internal
      ingress.hosts:
        - host: sales.internal.example.com
          paths:
            - path: /
              pathType: Prefix
      networkPolicy.enabled: true
      networkPolicy.ingress.routeTrafficAllowedElsewhere: true
    asserts:
      - hasDocuments:
          count: 0

  - it: names routeTrafficAllowedElsewhere as a remedy of the route guard
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: platform-gw
          namespace: gateway
      networkPolicy.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "or set networkPolicy.ingress.routeTrafficAllowedElsewhere: true if a policy the chart cannot express allows the route's traffic"

  - it: accepts routeTrafficAllowedElsewhere together with fromNamespaces
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: platform-gw
          namespace: gateway
      networkPolicy.enabled: true
      networkPolicy.ingress.fromNamespaces: [envoy-gateway-system]
      networkPolicy.ingress.routeTrafficAllowedElsewhere: true
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects routeTrafficAllowedElsewhere without a route (it has no effect)
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.routeTrafficAllowedElsewhere: true
    asserts:
      - failedTemplate:
          errorPattern: "networkPolicy.ingress.routeTrafficAllowedElsewhere has no effect without a route: enable httpRoute or ingress, or remove it"

  - it: rejects fromComponents when ports is empty (there is no port to open by name)
    set:
      service.enabled: false
      ports: []
      networkPolicy.enabled: true
      networkPolicy.ingress.fromComponents: [web]
    asserts:
      - failedTemplate:
          errorPattern: 'networkPolicy.ingress.fromComponents and fromNamespaces open the entries of ports by name, but ports is empty'

  - it: rejects fromNamespaces when ports is empty
    set:
      service.enabled: false
      ports: []
      networkPolicy.enabled: true
      networkPolicy.ingress.fromNamespaces: [gateway]
    asserts:
      - failedTemplate:
          errorPattern: 'networkPolicy.ingress.fromComponents and fromNamespaces open the entries of ports by name, but ports is empty'

  - it: rejects egress destinations while egress.enabled is false (they would restrict nothing)
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.toComponents: [api]
      networkPolicy.egress.toCIDRs:
        - cidr: 192.0.2.0/24
    asserts:
      - failedTemplate:
          errorPattern: 'networkPolicy.egress.toComponents, toCIDRs, extra and dns.cidrs only apply with networkPolicy.egress.enabled: true'

  - it: rejects egress.extra while egress.enabled is false
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.extra:
        - ports:
            - port: 443
    asserts:
      - failedTemplate:
          errorPattern: 'networkPolicy.egress.toComponents, toCIDRs, extra and dns.cidrs only apply with networkPolicy.egress.enabled: true'

  - it: rejects egress.dns.cidrs while egress.enabled is false
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.dns.cidrs: [169.254.20.10/32]
    asserts:
      - failedTemplate:
          errorPattern: 'networkPolicy.egress.toComponents, toCIDRs, extra and dns.cidrs only apply with networkPolicy.egress.enabled: true'

  - it: rejects an endPort lower than its port in toCIDRs (the API server rejects it)
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.enabled: true
      networkPolicy.egress.toCIDRs:
        - cidr: 192.0.2.0/24
          ports:
            - port: 443
            - port: 8100
              endPort: 8000
    asserts:
      - failedTemplate:
          errorPattern: 'networkPolicy.egress.toCIDRs\[0\].ports\[1\]: endPort \(8000\) must not be lower than port \(8100\)'

  - it: rejects an endPort lower than its port in an extra ingress rule
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.extra:
        - ports:
            - port: 9100
              endPort: 9000
    asserts:
      - failedTemplate:
          errorPattern: 'networkPolicy.ingress.extra\[0\].ports\[0\]: endPort \(9000\) must not be lower than port \(9100\)'

  - it: rejects an endPort lower than its port in an extra egress rule
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.enabled: true
      networkPolicy.egress.extra:
        - ports:
            - port: 443
        - ports:
            - port: 9100
              endPort: 9000
    asserts:
      - failedTemplate:
          errorPattern: 'networkPolicy.egress.extra\[1\].ports\[0\]: endPort \(9000\) must not be lower than port \(9100\)'

  - it: accepts an endPort equal to its port
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.enabled: true
      networkPolicy.egress.toCIDRs:
        - cidr: 192.0.2.0/24
          ports:
            - port: 8000
              endPort: 8000
    asserts:
      - hasDocuments:
          count: 0

  - it: skips the networkPolicy guards while networkPolicy is off
    set:
      metrics.enabled: true
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: platform-gw
          namespace: gateway
      networkPolicy.egress.toCIDRs:
        - cidr: 192.0.2.0/24
          ports:
            - port: 8100
              endPort: 8000
      networkPolicy.ingress.routeTrafficAllowedElsewhere: true
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects serviceAccount.annotations with create false (the owner of an existing ServiceAccount sets them)
    set:
      serviceAccount.create: false
      serviceAccount.name: sales-runner
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/sales
    asserts:
      - failedTemplate:
          errorPattern: 'serviceAccount.annotations apply only to the ServiceAccount the chart creates, and serviceAccount.create is false, so no ServiceAccount carries them: remove them from the values \(an override file clears them with serviceAccount.annotations: null; an empty map is merged and clears nothing\), or, when the pods run as an existing ServiceAccount \(serviceAccount.name\), have its owner set them on that ServiceAccount \(a cloud identity''s role, for example\), or set serviceAccount.create: true \(removing serviceAccount.name if it is set\)'

  - it: rejects serviceAccount.annotations with create false and no name (the namespace's default ServiceAccount)
    set:
      serviceAccount.create: false
      serviceAccount.annotations:
        iam.gke.io/gcp-service-account: sales@acme.iam.gserviceaccount.com
    asserts:
      - failedTemplate:
          errorPattern: 'serviceAccount.annotations apply only to the ServiceAccount the chart creates, and serviceAccount.create is false, so no ServiceAccount carries them: remove them from the values .*, or set serviceAccount.create: true'

  - it: accepts serviceAccount.annotations on the ServiceAccount the chart creates
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/sales
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects serviceAccount.name default (create false without a name already selects it)
    set:
      serviceAccount.create: false
      serviceAccount.name: default
    asserts:
      - failedTemplate:
          errorPattern: "serviceAccount.name: default is the namespace's default ServiceAccount, .*: remove serviceAccount.name, or name a ServiceAccount of this component"

  - it: rejects serviceAccount.name with create true (the chart creates <fullname>; a name is an existing ServiceAccount's)
    set:
      serviceAccount.name: sales-runner
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: serviceAccount.name \(sales-runner\) names an existing ServiceAccount, and serviceAccount.create is true, so the chart creates its own, always named vending-chart-base: set serviceAccount.create: false to run the pods as sales-runner, or remove serviceAccount.name'

  - it: reports serviceAccount.name default as the default ServiceAccount with create true too (create false would only select it again)
    set:
      serviceAccount.name: default
    asserts:
      - failedTemplate:
          errorPattern: "serviceAccount.name: default is the namespace's default ServiceAccount"

  - it: rejects rbac.rules bound to the namespace's default ServiceAccount (create false without a name)
    set:
      serviceAccount.create: false
      serviceAccount.automountToken: true
      rbac.rules:
        - apiGroups: [""]
          resources: [configmaps]
          verbs: [get]
    asserts:
      - failedTemplate:
          errorPattern: "rbac.rules and rbac.clusterRoles would be bound to the namespace's default ServiceAccount .* set serviceAccount.create: true \\(the chart creates vending-chart-base\\)"

  - it: rejects rbac.clusterRoles bound to the namespace's default ServiceAccount too
    set:
      serviceAccount.create: false
      serviceAccount.automountToken: true
      rbac.clusterRoles: [view]
    asserts:
      - failedTemplate:
          errorPattern: "rbac.rules and rbac.clusterRoles would be bound to the namespace's default ServiceAccount .*, or set serviceAccount.name to an existing ServiceAccount of this component"

  - it: rejects a use-only rule bound to the namespace's default ServiceAccount, without a token too (the token guard exempts use, this one does not)
    set:
      serviceAccount.create: false
      rbac.rules:
        - apiGroups: [security.openshift.io]
          resources: [securitycontextconstraints]
          resourceNames: [nonroot-v2]
          verbs: [use]
    asserts:
      - failedTemplate:
          errorPattern: "rbac.rules and rbac.clusterRoles would be bound to the namespace's default ServiceAccount"

  - it: accepts rbac for an existing ServiceAccount of the component (create false with a name)
    set:
      serviceAccount.create: false
      serviceAccount.name: sales-runner
      serviceAccount.automountToken: true
      rbac.rules:
        - apiGroups: [""]
          resources: [configmaps]
          verbs: [get]
      rbac.clusterRoles: [view]
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts create false without a name when there is no rbac (the pods run as default, with nothing granted)
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects rbac.rules without serviceAccount.automountToken (the pods would get no token)
    set:
      rbac.rules:
        - apiGroups: [""]
          resources: [configmaps]
          verbs: [get]
    asserts:
      - failedTemplate:
          errorPattern: 'rbac.clusterRoles and the rbac.rules with a verb other than use are exercised by the pods with their ServiceAccount token, and serviceAccount.automountToken is false, so the pods get no token: set serviceAccount.automountToken: true, or remove them'

  - it: rejects rbac.clusterRoles without serviceAccount.automountToken
    set:
      rbac.clusterRoles: [view]
    asserts:
      - failedTemplate:
          errorPattern: 'rbac.clusterRoles and the rbac.rules with a verb other than use are exercised by the pods with their ServiceAccount token, and serviceAccount.automountToken is false, so the pods get no token: set serviceAccount.automountToken: true, or remove them'

  - it: accepts rbac.rules whose only verb is use without a token (an admission plugin checks the grant on the ServiceAccount)
    set:
      rbac.rules:
        - apiGroups: [security.openshift.io]
          resources: [securitycontextconstraints]
          resourceNames: [nonroot-v2]
          verbs: [use]
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a rule with use and another verb without a token
    set:
      rbac.rules:
        - apiGroups: [security.openshift.io]
          resources: [securitycontextconstraints]
          resourceNames: [nonroot-v2]
          verbs: [use, get]
    asserts:
      - failedTemplate:
          errorPattern: 'rbac.clusterRoles and the rbac.rules with a verb other than use are exercised by the pods with their ServiceAccount token, and serviceAccount.automountToken is false'

  - it: rejects a use-only rule next to a rule with another verb without a token
    set:
      rbac.rules:
        - apiGroups: [security.openshift.io]
          resources: [securitycontextconstraints]
          resourceNames: [nonroot-v2]
          verbs: [use]
        - apiGroups: [""]
          resources: [configmaps]
          verbs: [get]
    asserts:
      - failedTemplate:
          errorPattern: 'rbac.clusterRoles and the rbac.rules with a verb other than use are exercised by the pods with their ServiceAccount token, and serviceAccount.automountToken is false'

  - it: rejects a rule with another verb followed by a use-only rule without a token (the last rule does not decide)
    set:
      rbac.rules:
        - apiGroups: [""]
          resources: [configmaps]
          verbs: [get]
        - apiGroups: [security.openshift.io]
          resources: [securitycontextconstraints]
          resourceNames: [nonroot-v2]
          verbs: [use]
    asserts:
      - failedTemplate:
          errorPattern: 'rbac.clusterRoles and the rbac.rules with a verb other than use are exercised by the pods with their ServiceAccount token, and serviceAccount.automountToken is false'

  - it: rejects a use-only rule next to a ClusterRole without a token (the ClusterRole needs one)
    set:
      rbac.clusterRoles: [view]
      rbac.rules:
        - apiGroups: [security.openshift.io]
          resources: [securitycontextconstraints]
          resourceNames: [nonroot-v2]
          verbs: [use]
    asserts:
      - failedTemplate:
          errorPattern: 'rbac.clusterRoles and the rbac.rules with a verb other than use are exercised by the pods with their ServiceAccount token, and serviceAccount.automountToken is false'

  - it: rejects a ClusterRole without a token and names the use rule (an OpenShift SCC ClusterRole)
    set:
      rbac.clusterRoles: ["system:openshift:scc:nonroot-v2"]
    asserts:
      - failedTemplate:
          errorPattern: 'write it in rbac.rules as a rule whose only verb is use'

  - it: rejects create with resourceNames on a resource when the rule has neither patch nor update (the names are never matched for a plain create request)
    set:
      serviceAccount.automountToken: true
      rbac.rules:
        - apiGroups: [""]
          resources: [pods/exec, configmaps]
          resourceNames: [sales-state]
          verbs: [create, get]
    asserts:
      - failedTemplate:
          errorPattern: 'rbac.rules\[0\]: create on configmaps is restricted by resourceNames, which Kubernetes matches only for a server-side apply \(it also needs patch\) or a create through an update \(it also needs update\), never for a plain create request, and this rule grants neither patch nor update \(each rule is checked on its own\): add patch or update to this rule if the component creates the object that way .*, move create to a rule without resourceNames, or remove it'

  - it: rejects create with resourceNames when only another rule grants patch (each rule is checked on its own)
    set:
      serviceAccount.automountToken: true
      rbac.rules:
        - apiGroups: [""]
          resources: [configmaps]
          verbs: [get, patch]
        - apiGroups: [""]
          resources: [configmaps]
          resourceNames: [sales-state]
          verbs: [create]
    asserts:
      - failedTemplate:
          errorPattern: 'rbac.rules\[1\]: create on configmaps is restricted by resourceNames, .*, and this rule grants neither patch nor update \(each rule is checked on its own\): add patch or update to this rule'

  - it: accepts create with resourceNames on subresources (pods/exec, serviceaccounts/token)
    set:
      serviceAccount.automountToken: true
      rbac.rules:
        - apiGroups: [""]
          resources: [pods/exec, serviceaccounts/token]
          resourceNames: [sales-0, sales-runner]
          verbs: [create]
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts create with resourceNames together with patch (a server-side apply creates the named object)
    set:
      serviceAccount.automountToken: true
      rbac.rules:
        - apiGroups: [""]
          resources: [configmaps]
          resourceNames: [sales-state]
          verbs: [get, patch, create]
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts create with resourceNames together with update (a create through an update)
    set:
      serviceAccount.automountToken: true
      rbac.rules:
        - apiGroups: [coordination.k8s.io]
          resources: [leases]
          resourceNames: [sales-lock]
          verbs: [get, update, create]
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects deletecollection with resourceNames
    set:
      serviceAccount.automountToken: true
      rbac.rules:
        - apiGroups: [""]
          resources: [configmaps]
          verbs: [get]
        - apiGroups: [""]
          resources: [configmaps]
          resourceNames: [sales-state]
          verbs: [get, deletecollection]
    asserts:
      - failedTemplate:
          errorPattern: 'rbac.rules\[1\]: deletecollection cannot be restricted by resourceNames, so this rule never allows it: move it to a rule without resourceNames, or remove it'

  - it: rejects deletecollection with resourceNames even when the rule also has patch and update (they exempt create only)
    set:
      serviceAccount.automountToken: true
      rbac.rules:
        - apiGroups: [""]
          resources: [configmaps]
          resourceNames: [sales-state]
          verbs: [get, create, patch, update, deletecollection]
    asserts:
      - failedTemplate:
          errorPattern: 'rbac.rules\[0\]: deletecollection cannot be restricted by resourceNames'

  - it: rejects cluster-admin in rbac.clusterRoles (every verb on every resource of the namespace)
    set:
