    asserts:
      - failedTemplate:
          errorPattern: 'rbac.clusterRoles: cluster-admin is rejected: .*: list the rules the component needs in rbac.rules, or bind a narrower ClusterRole such as view'

  - it: accepts the ClusterRoles view, edit and admin (edit and admin are documented escalation paths)
    set:
      serviceAccount.automountToken: true
      rbac.clusterRoles: [view, edit, admin]
    asserts:
      - hasDocuments:
          count: 0

  - it: renders with rbac.rules deleted by a null (an override that removes the rules)
