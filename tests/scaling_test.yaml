suite: scaling and resilience (hpa and pdb)
templates:
  - templates/hpa.yaml
  - templates/pdb.yaml
  - templates/validate.yaml
release:
  name: vending
  namespace: vending
capabilities:
  majorVersion: 1
  minorVersion: 33
chart:
  version: 0.0.0-test
values:
  - values/base.yaml
tests:
  - it: renders no HPA by default
    template: templates/hpa.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an autoscaling/v2 HPA on CPU targeting the Deployment
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
    asserts:
      - isAPIVersion:
          of: autoscaling/v2
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: Deployment
            name: vending-chart-base
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 10
      - lengthEqual:
          path: spec.metrics
          count: 1
      - equal:
          path: spec.metrics[0].resource
          value:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80

  - it: adds a memory metric when targetMemoryUtilizationPercentage is set
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      autoscaling.targetMemoryUtilizationPercentage: 75
    asserts:
      - equal:
          path: spec.metrics[1].resource.name
          value: memory
      - equal:
          path: spec.metrics[1].resource.target.averageUtilization
          value: 75

  - it: puts no KEDA annotation on the HPA by default (kedaHandover false)
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
    asserts:
      - notExists:
          path: metadata.annotations

  - it: with kedaHandover, marks the HPA as not owning the Deployment for KEDA's webhook
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      autoscaling.kedaHandover: true
    asserts:
      - equal:
          path: metadata.annotations
          value:
            validations.keda.sh/hpa-ownership: "false"
      - equal:
          path: spec.scaleTargetRef.name
          value: vending-chart-base

  - it: with kedaHandover, the handover annotation wins over the same key in commonAnnotations and keeps the others
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      autoscaling.kedaHandover: true
      commonAnnotations: {validations.keda.sh/hpa-ownership: "true", example.com/owner: platform}
    asserts:
      - equal:
          path: metadata.annotations
          value:
            validations.keda.sh/hpa-ownership: "false"
            example.com/owner: platform

  - it: with kedaHandover absent (null deletes the key), puts no KEDA annotation on the HPA
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      autoscaling.kedaHandover: null
    asserts:
      - notExists:
          path: metadata.annotations

  - it: with kedaHandover and no HPA (KEDA scales the Deployment), renders no HPA
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: false
      autoscaling.kedaHandover: true
      keda.enabled: true
      keda.triggers.window: {type: cron, metadata: {timezone: Etc/UTC, start: "0 0 1 1 *", end: "1 0 1 1 *", desiredReplicas: "1"}}
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a PDB with maxUnavailable 1 and AlwaysAllow by default
    template: templates/pdb.yaml
    asserts:
      - isAPIVersion:
          of: policy/v1
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: AlwaysAllow
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: chart-base
            app.kubernetes.io/instance: vending

  - it: uses minAvailable when set (including 0)
    template: templates/pdb.yaml
    set:
      pdb.minAvailable: 0
    asserts:
      - equal:
          path: spec.minAvailable
          value: 0
      - notExists:
          path: spec.maxUnavailable

  - it: accepts percentages
    template: templates/pdb.yaml
    set:
      pdb.maxUnavailable: 25%
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 25%

  - it: rejects minAvailable equal to replicas (no eviction at the replica floor; ADR-0062)
    template: templates/validate.yaml
    set:
      replicas: 2
      pdb.minAvailable: 2
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: pdb.minAvailable is 2 and the replica floor is 2 \(replicas\): the PodDisruptionBudget allows no eviction at the floor, so every node drain and cluster upgrade stalls on this component\. Set pdb.minAvailable to at most 1 \(a percentage: at most 50%\), or pdb.minAvailable: null to use pdb.maxUnavailable \(1 by default\); for a budget that blocks evictions on purpose, set pdb.enabled: false and write a PodDisruptionBudget in extraObjects$'

  - it: renders minAvailable below replicas
    template: templates/pdb.yaml
    set:
      replicas: 2
      pdb.minAvailable: 1
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1

  - it: renders a minAvailable percentage that the controller rounds up below replicas (50% of 2 is 1)
    template: templates/pdb.yaml
    set:
      replicas: 2
      pdb.minAvailable: 50%
    asserts:
      - equal:
          path: spec.minAvailable
          value: 50%

  - it: rejects a minAvailable percentage that the controller rounds up to replicas (51% of 2 is 2)
    template: templates/validate.yaml
    set:
      replicas: 2
      pdb.minAvailable: 51%
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: pdb.minAvailable is "51%", which the disruption controller rounds up to 2 of the replica floor 2 \(replicas\): the PodDisruptionBudget allows no eviction at the floor.* Set pdb.minAvailable to at most 1 \(a percentage: at most 50%\)'

  - it: rejects minAvailable 50% with one replica (rounded up to 1, the whole floor)
    template: templates/validate.yaml
    set:
      pdb.minAvailable: 50%
    asserts:
      - failedTemplate:
          errorPattern: 'pdb.minAvailable is "50%", which the disruption controller rounds up to 1 of the replica floor 1 \(replicas\).* Set pdb.minAvailable to at most 0 \(a percentage: at most 0%\)'

  - it: rejects minAvailable equal to autoscaling.minReplicas (the HPA's floor)
    template: templates/validate.yaml
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 3
      autoscaling.maxReplicas: 5
      pdb.minAvailable: 3
    asserts:
      - failedTemplate:
          errorPattern: 'pdb.minAvailable is 3 and the replica floor is 3 \(autoscaling.minReplicas\)'

  - it: renders minAvailable below autoscaling.minReplicas whatever replicas says
    template: templates/pdb.yaml
    set:
      replicas: 1
      autoscaling.enabled: true
      autoscaling.minReplicas: 3
      autoscaling.maxReplicas: 5
      pdb.minAvailable: 2
    asserts:
      - equal:
          path: spec.minAvailable
          value: 2

  - it: rejects minAvailable 1 with keda.minReplicaCount 0 (the floor is 1 while KEDA runs a pod)
    template: templates/validate.yaml
    set:
      keda.enabled: true
      keda.minReplicaCount: 0
      keda.triggers.window: {type: cron, metadata: {timezone: Etc/UTC, start: 0 0 1 1 *, end: 1 0 1 1 *, desiredReplicas: "1"}}
      pdb.minAvailable: 1
    asserts:
      - failedTemplate:
          errorPattern: 'pdb.minAvailable is 1 and the replica floor is 1 \(keda.minReplicaCount 0 counts as 1: a pod runs while a trigger is active\)'

  - it: renders minAvailable 1 with keda.minReplicaCount 2 whatever replicas says
    template: templates/pdb.yaml
    set:
      replicas: 1
      keda.enabled: true
      keda.minReplicaCount: 2
      keda.triggers.window: {type: cron, metadata: {timezone: Etc/UTC, start: 0 0 1 1 *, end: 1 0 1 1 *, desiredReplicas: "3"}}
      pdb.minAvailable: 1
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1

  - it: rejects maxUnavailable 0
    template: templates/validate.yaml
    set:
      pdb.maxUnavailable: 0
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: pdb.maxUnavailable is 0: the PodDisruptionBudget allows no eviction, so every node drain and cluster upgrade stalls on this component\. Set pdb.maxUnavailable to 1 or more \(or null for the chart.s default, 1\), or a pdb.minAvailable below the replica floor 1 \(replicas\); for a budget that blocks evictions on purpose, set pdb.enabled: false and write a PodDisruptionBudget in extraObjects$'

  - it: rejects maxUnavailable "0%"
    template: templates/validate.yaml
    set:
      replicas: 3
      pdb.maxUnavailable: 0%
    asserts:
      - failedTemplate:
          errorPattern: 'pdb.maxUnavailable is "0%": the PodDisruptionBudget allows no eviction'

  - it: renders a blocking budget with replicas 0 (no pod to protect)
    template: templates/pdb.yaml
    set:
      replicas: 0
      pdb.minAvailable: 1
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1

  - it: renders nothing and fails nothing for a blocking budget with pdb.enabled false (the remedy, with a PodDisruptionBudget in extraObjects)
    template: templates/validate.yaml
    set:
      replicas: 2
      pdb.enabled: false
      pdb.minAvailable: 2
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no PDB for a cronjob
    template: templates/pdb.yaml
    set:
      workload.type: cronjob
      cronjob.schedule: "0 * * * *"
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no PDB when pdb.enabled is false
    template: templates/pdb.yaml
    set:
      pdb.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the built-in targets as pod-wide Resource metrics without a non-null sidecar (no sidecars, null, a map of null sidecars, init containers only)
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      sidecars:
        gone: null
      initContainers:
        migrate: {image: {repository: ghcr.io/acme/tool, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}}
    asserts:
      - equal:
          path: spec.metrics
          value:
            - {type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 80}}}

  - it: renders a Resource metric for sidecars null
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      sidecars: null
    asserts:
      - equal:
          path: spec.metrics
          value:
            - {type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 80}}}

  - it: renders the CPU target as a ContainerResource metric for the main container once a sidecar exists
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/tool, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}}
    asserts:
      - equal:
          path: spec.metrics
          value:
            - type: ContainerResource
              containerResource:
                name: cpu
                container: chart-base
                target:
                  type: Utilization
                  averageUtilization: 80

  - it: renders the memory target as a second ContainerResource metric with a sidecar
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      autoscaling.targetCPUUtilizationPercentage: 70
      autoscaling.targetMemoryUtilizationPercentage: 75
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/tool, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}}
    asserts:
      - equal:
          path: spec.metrics
          value:
            - {type: ContainerResource, containerResource: {name: cpu, container: chart-base, target: {type: Utilization, averageUtilization: 70}}}
            - {type: ContainerResource, containerResource: {name: memory, container: chart-base, target: {type: Utilization, averageUtilization: 75}}}

  - it: renders spec.behavior as written (both directions, every field, the policies in their order)
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      autoscaling.behavior:
        scaleDown:
          stabilizationWindowSeconds: 600
          selectPolicy: Min
          policies:
            - {type: Pods, value: 1, periodSeconds: 60}
            - {type: Percent, value: 10, periodSeconds: 120}
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - {type: Percent, value: 100, periodSeconds: 15}
    asserts:
      - equal:
          path: spec.behavior
          value:
            scaleDown:
              stabilizationWindowSeconds: 600
              selectPolicy: Min
              policies:
                - {type: Pods, value: 1, periodSeconds: 60}
                - {type: Percent, value: 10, periodSeconds: 120}
            scaleUp:
              stabilizationWindowSeconds: 0
              selectPolicy: Max
              policies:
                - {type: Percent, value: 100, periodSeconds: 15}

  - it: renders one direction alone, and selectPolicy Disabled without policies
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      autoscaling.behavior.scaleDown.selectPolicy: Disabled
    asserts:
      - equal:
          path: spec.behavior
          value:
            scaleDown:
              selectPolicy: Disabled

  - it: renders no behavior for behavior null (the default; the API server's defaults apply)
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.behavior
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: Deployment
            name: vending-chart-base

  - it: renders a non-empty metrics list as written, and no built-in target (the list is the whole list)
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      autoscaling.metrics:
        - {type: Pods, pods: {metric: {name: queue_depth, selector: {matchLabels: {queue: orders}}}, target: {type: AverageValue, averageValue: "30"}}}
        - {type: External, external: {metric: {name: sqs_messages}, target: {type: Value, value: 100}}}
    asserts:
      - equal:
          path: spec.metrics
          value:
            - {type: Pods, pods: {metric: {name: queue_depth, selector: {matchLabels: {queue: orders}}}, target: {type: AverageValue, averageValue: "30"}}}
            - {type: External, external: {metric: {name: sqs_messages}, target: {type: Value, value: 100}}}

  - it: renders a Resource entry of the list as written next to a sidecar (never switched to ContainerResource)
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      autoscaling.metrics:
        - {type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/tool, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}}
    asserts:
      - equal:
          path: spec.metrics
          value:
            - {type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}

  - it: renders the built-in targets for metrics [] (never an empty spec.metrics)
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      autoscaling.metrics: []
    asserts:
      - equal:
          path: spec.metrics
          value:
            - {type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 80}}}

  - it: renders the built-in targets for metrics null
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      autoscaling.metrics: null
      autoscaling.targetMemoryUtilizationPercentage: 70
    asserts:
      - equal:
          path: spec.metrics
          value:
            - {type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 80}}}
            - {type: Resource, resource: {name: memory, target: {type: Utilization, averageUtilization: 70}}}

  - it: renders spec.behavior without its null directions and null fields (ADR-0070)
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      autoscaling.behavior:
        scaleUp: null
        scaleDown: {stabilizationWindowSeconds: 600, selectPolicy: null, policies: null}
    asserts:
      - equal:
          path: spec.behavior
          value:
            scaleDown:
              stabilizationWindowSeconds: 600

  - it: renders no behavior when every direction is null
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
      autoscaling.behavior: {scaleUp: null, scaleDown: null}
    asserts:
      - notExists:
          path: spec.behavior
