    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: sidecars.proxy.volumeMounts.work.subPath "/x" must be a relative path without a .. element: a path inside the volume, such as tls.crt'

  - it: rejects a subPath that is a prefix of an item's path without ending at a / (alerts against alerts.yaml)
    set:
      volumes:
        rules: {type: configMap, name: rules, items: [{key: alerts, path: alerts.yaml}]}
      sidecars:
        reloader: {image: {repository: ghcr.io/acme/tool, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, volumeMounts: {rules: {mountPath: /etc/alerts, subPath: alerts}}}
    asserts:
      - failedTemplate:
          errorPattern: 'chart-base\[chart-base\]: sidecars.reloader.volumeMounts.rules.subPath "alerts" names no file of volumes.rules.items \(alerts.yaml\)'

  - it: accepts a secret file (subPath) beneath the container's own tmp mount (tmp is not a ConfigMap or Secret mount)
    set:
      volumes:
        creds: {type: secret, secretName: creds}
      sidecars:
        proxy: {image: {repository: ghcr.io/acme/tool, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, volumeMounts: {tmp: {mountPath: /scratch}, creds: {mountPath: /scratch/creds.json, subPath: creds.json}}}
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts any subPath of a configMap volume whose items is null (null = every key)
    set:
      volumes:
        rules: {type: configMap, name: rules, items: null}
      sidecars:
        reloader: {image: {repository: ghcr.io/acme/tool, tag: "1.0"}, resources: {requests: {cpu: 10m, memory: 16Mi}}, volumeMounts: {rules: {mountPath: /etc/alerts.yaml, subPath: alerts.yaml}}}
    asserts:
      - hasDocuments:
          count: 0
