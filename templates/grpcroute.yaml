{{- /* grpcRoute may be absent: a --reuse-values upgrade from 1.3 or older renders with the previous values. */}}
{{- $grpcRoute := .Values.grpcRoute | default dict }}
{{- if and (eq .Values.workload.type "deployment") (eq $grpcRoute.enabled true) }}
{{- $fullname := include "chart-base.fullname" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "chart-base.labels" . | nindent 4 }}
  {{- with include "chart-base.annotations" (dict "ctx" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $grpcRoute.parentRefs | nindent 4 }}
  {{- with $grpcRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ $fullname }}
          port: {{ include "chart-base.routeBackendPort" (list . $grpcRoute.port) }}
      {{- with $grpcRoute.matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
