{{- if eq .Values.workload.type "statefulset" }}
{{- /*
workload.type statefulset (ADR-0071): the Deployment's pod template (chart-base.podSpec), its labels and its
annotations, under a StatefulSet named <fullname> with the frozen selector labels. What a StatefulSet has and a
Deployment does not comes from the statefulset block (chart-base.statefulset); strategy and progressDeadlineSeconds
have no equivalent and are not read.
*/}}
{{- $fullname := include "chart-base.fullname" . }}
{{- $sts := dict }}
{{- include "chart-base.statefulset" (dict "ctx" . "out" $sts) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "chart-base.labels" . | nindent 4 }}
  {{- with include "chart-base.annotations" (dict "ctx" . "own" (include "chart-base.reloaderAnnotations" . | trim)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- /* The alias's one Service, headless on a statefulset (templates/service.yaml): it gives each pod its DNS name. */}}
  {{- if .Values.service.enabled }}
  serviceName: {{ $fullname }}
  {{- end }}
  {{- /* An autoscaler owns the count, as on a Deployment (templates/deployment.yaml). */}}
  {{- if not (or .Values.autoscaling.enabled (.Values.keda | default dict).enabled) }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  {{- with $sts.members.podManagementPolicy }}
  podManagementPolicy: {{ . }}
  {{- end }}
  {{- /*
  Always rendered, the Kubernetes defaults written out (RollingUpdate, partition 0, maxUnavailable 1): Helm then owns
  every key from the first install, so a later switch to OnDelete removes rollingUpdate in one upgrade. Left to the API
  server's defaults, rollingUpdate.partition (and maxUnavailable, defaulted where the MaxUnavailableStatefulSet gate is
  on, from Kubernetes 1.37) would have no field manager, and a StatefulSet's updateStrategy has no retainKeys to drop
  them (ADR-0071). maxUnavailable is a constant, not a value: where the gate is off, the API server drops it. Field by
  field: a partition stays an integer whatever its size (toYaml would write a large one as a float).
  templates/validate.yaml rejects a rollingUpdate next to OnDelete.
  */}}
  {{- $updateStrategy := $sts.members.updateStrategy | default dict }}
  updateStrategy:
    {{- if eq ($updateStrategy.type | default "") "OnDelete" }}
    type: OnDelete
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      partition: {{ (($updateStrategy.rollingUpdate | default dict).partition | default 0) | int64 }}
      maxUnavailable: 1
    {{- end }}
  {{- with $sts.members.persistentVolumeClaimRetentionPolicy }}
  persistentVolumeClaimRetentionPolicy:
    {{- with .whenDeleted }}
    whenDeleted: {{ . }}
    {{- end }}
    {{- with .whenScaled }}
    whenScaled: {{ . }}
    {{- end }}
  {{- end }}
  {{- if not (kindIs "invalid" .Values.minReadySeconds) }}
  minReadySeconds: {{ .Values.minReadySeconds | int64 }}
  {{- end }}
  {{- if not (kindIs "invalid" .Values.revisionHistoryLimit) }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | int64 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart-base.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart-base.podLabels" . | nindent 8 }}
      {{- with include "chart-base.podTemplateAnnotations" . | trim }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "chart-base.podSpec" (dict "ctx" .) | nindent 6 }}
  {{- /* The volumeClaimTemplate entries of volumes, in key order: a claim <volume>-<fullname>-<ordinal> per pod, mounted by the volume's name (chart-base.podSpec renders the mounts, never a pod volume for them). */}}
  {{- $volumes := dict }}
  {{- include "chart-base.volumes" (dict "ctx" . "out" $volumes) }}
  {{- $claims := list }}
  {{- range $name, $v := $volumes }}{{ if eq $v.type "volumeClaimTemplate" }}{{ $claims = append $claims $name }}{{ end }}{{ end }}
  {{- with $claims }}
  volumeClaimTemplates:
    {{- range $name := . }}
    - {{ include "chart-base.claimTemplate" (dict "ctx" $ "volume" (index $volumes $name) "name" $name) | indent 6 | trim }}
    {{- end }}
  {{- end }}
{{- end }}
