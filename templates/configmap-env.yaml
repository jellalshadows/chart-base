{{- if include "chart-base.hasConfig" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart-base.fullname" . }}-env
  labels:
    {{- include "chart-base.labels" . | nindent 4 }}
  {{- with include "chart-base.annotations" (dict "ctx" . "own" (include "chart-base.supportHookAnnotations" .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  {{- $config := deepCopy .Values.config }}
  {{- include "chart-base.pruneNulls" $config }}
  {{- range $key, $value := $config }}
  {{ $key | quote }}: {{ include "chart-base.configValue" $value }}
  {{- end }}
{{- end }}
