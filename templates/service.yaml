{{- if and (include "chart-base.longRunning" .) .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart-base.fullname" . }}
  labels:
    {{- include "chart-base.labels" . | nindent 4 }}
  {{- with include "chart-base.annotations" (dict "ctx" . "object" .Values.service.annotations) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- /* A statefulset's Service is headless: each pod gets its DNS name <pod>.<fullname>.<namespace>.svc (ADR-0071; templates/validate.yaml requires type ClusterIP). */}}
  {{- if eq .Values.workload.type "statefulset" }}
  clusterIP: None
  {{- end }}
  selector:
    {{- include "chart-base.selectorLabels" . | nindent 4 }}
  ports:
    {{- range .Values.ports }}
    - name: {{ .name | quote }}
      port: {{ include "chart-base.servicePort" . }}
      targetPort: {{ .name | quote }}
      protocol: TCP
      {{- with .appProtocol }}
      appProtocol: {{ . | quote }}
      {{- end }}
    {{- end }}
{{- end }}
