{{- /* A null file is no file; in a map-form file every null key is removed, in maps reached through maps (lists are rendered as written). */}}
{{- $files := deepCopy (.Values.configFiles.files | default dict) }}
{{- include "chart-base.pruneNulls" $files }}
{{- if include "chart-base.hasConfigFiles" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart-base.fullname" . }}-files
  labels:
    {{- include "chart-base.labels" . | nindent 4 }}
  {{- with include "chart-base.supportHookAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  {{- range $name, $content := $files }}
  {{- if kindIs "string" $content }}
  {{ $name | quote }}: {{ $content | quote }}
  {{- else }}
  {{ $name | quote }}: {{ toYaml $content | quote }}
  {{- end }}
  {{- end }}
{{- end }}
