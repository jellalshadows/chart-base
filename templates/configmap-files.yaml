{{- if .Values.configFiles.files }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart-base.fullname" . }}-files
  labels:
    {{- include "chart-base.labels" . | nindent 4 }}
  {{- with include "chart-base.supportHookAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  {{- range $name, $content := .Values.configFiles.files }}
  {{- if kindIs "string" $content }}
  {{ $name }}: {{ $content | quote }}
  {{- else }}
  {{ $name }}: {{ toYaml $content | quote }}
  {{- end }}
  {{- end }}
{{- end }}
