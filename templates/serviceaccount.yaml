{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chart-base.fullname" . }}
  labels:
    {{- include "chart-base.labels" . | nindent 4 }}
  {{- $annotations := include "chart-base.supportHookAnnotations" . | fromYaml | default dict }}
  {{- /* A null key of serviceAccount.annotations or commonAnnotations is absent (ADR-0070). */}}
  {{- $own := deepCopy (.Values.serviceAccount.annotations | default dict) }}
  {{- include "chart-base.pruneNulls" $own }}
  {{- $common := deepCopy (.Values.commonAnnotations | default dict) }}
  {{- include "chart-base.pruneNulls" $common }}
  {{- $annotations = merge $annotations $own }}
  {{- range $k, $v := $common }}{{ if not (hasKey $annotations $k) }}{{ $_ := set $annotations $k $v }}{{ end }}{{ end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
