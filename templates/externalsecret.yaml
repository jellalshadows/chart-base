{{- if .Values.externalSecret.enabled }}
{{- $name := printf "%s-secrets" (include "chart-base.fullname" .) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "chart-base.labels" . | nindent 4 }}
  {{- with include "chart-base.supportHookAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name | quote }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
  data:
    {{- range $envVar, $ref := .Values.externalSecret.data }}
    - secretKey: {{ $envVar | quote }}
      remoteRef:
        key: {{ $ref.key | quote }}
        {{- with $ref.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
