{{- if .Values.externalSecret.enabled }}
{{- $name := printf "%s-secrets" (include "chart-base.fullname" .) }}
{{- $es := dict }}
{{- include "chart-base.externalSecret" (dict "ctx" . "out" $es) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "chart-base.labels" . | nindent 4 }}
  {{- with include "chart-base.supportHookAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name | quote }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
  {{- /* No empty data or dataFrom key: a null entry and a null field are absent (chart-base.externalSecret), strings quoted. */}}
  {{- with $es.data }}
  data:
    {{- range $secretKey, $ref := . }}
    - secretKey: {{ $secretKey | quote }}
      remoteRef:
        key: {{ $ref.key | quote }}
        {{- with $ref.property }}
        property: {{ . | quote }}
        {{- end }}
        {{- if hasKey $ref "version" }}
        version: {{ $ref.version | quote }}
        {{- end }}
        {{- if hasKey $ref "decodingStrategy" }}
        decodingStrategy: {{ $ref.decodingStrategy | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- /* In list order: External Secrets merges the entries in that order (a later one wins), then data. */}}
  {{- with $es.dataFrom }}
  dataFrom:
    {{- range $entry := . }}
    - extract:
        key: {{ $entry.extract.key | quote }}
        {{- range $field := list "property" "version" "conversionStrategy" "decodingStrategy" }}
        {{- if hasKey $entry.extract $field }}
        {{ $field }}: {{ index $entry.extract $field | quote }}
        {{- end }}
        {{- end }}
      {{- with $entry.rewrite }}
      rewrite:
        {{- range $op := . }}
        {{- if hasKey $op "regexp" }}
        - regexp:
            source: {{ $op.regexp.source | quote }}
            target: {{ $op.regexp.target | quote }}
        {{- else }}
        - transform:
            template: {{ $op.transform.template | quote }}
        {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
