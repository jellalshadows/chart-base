{{- /*
One NetworkPolicy per component, on every workload type. On a job component it is a hook of the Job's
phase, created before the Job like its support resources (templates/_hooks.tpl): a regular object does not
exist yet when a pre-install Job runs. In the API an empty or missing `from`, `to` or `ports` list means
"all", so a rule is rendered only when its input is not empty; without any rule the pods accept no
connection, except from their own node, and with egress isolated they open none.
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- $in := .Values.networkPolicy.ingress }}
{{- $eg := .Values.networkPolicy.egress }}
{{- $fromComponents := and $in.fromComponents .Values.ports }}
{{- $fromNamespaces := and $in.fromNamespaces .Values.ports }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart-base.fullname" . }}
  labels:
    {{- include "chart-base.labels" . | nindent 4 }}
  {{- with include "chart-base.supportHookAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart-base.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $eg.enabled }}
    - Egress
    {{- end }}
  {{- if or $fromComponents $fromNamespaces $in.metricsFromNamespaces $in.extra }}
  ingress:
    {{- if $fromComponents }}
    - from:
        {{- range $in.fromComponents }}
        {{- include "chart-base.componentPeer" (list $ .) | nindent 8 }}
        {{- end }}
      ports:
        {{- range $.Values.ports }}
        - port: {{ .name | quote }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- if $fromNamespaces }}
    - from:
        {{- include "chart-base.namespacePeer" $in.fromNamespaces | nindent 8 }}
      ports:
        {{- range $.Values.ports }}
        - port: {{ .name | quote }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- with $in.metricsFromNamespaces }}
    - from:
        {{- include "chart-base.namespacePeer" . | nindent 8 }}
      ports:
        - port: {{ $.Values.metrics.port | quote }}
          protocol: TCP
    {{- end }}
    {{- with $in.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if and $eg.enabled (or $eg.dns.enabled $eg.toComponents $eg.toCIDRs $eg.extra) }}
  egress:
    {{- if $eg.dns.enabled }}
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - {{ $eg.dns.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml ($eg.dns.podSelector | default (dict "k8s-app" "kube-dns")) | nindent 14 }}
        {{- range $eg.dns.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range $eg.dns.ports }}
        - port: {{ .port | int64 }}
          protocol: {{ .protocol | default "TCP" }}
        {{- end }}
    {{- end }}
    {{- with $eg.toComponents }}
    - to:
        {{- range . }}
        {{- include "chart-base.componentPeer" (list $ .) | nindent 8 }}
        {{- end }}
    {{- end }}
    {{- range $eg.toCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
            {{- with .except }}
            except:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
      {{- with .ports }}
      ports:
        {{- range . }}
        - port: {{ .port | int64 }}
          {{- with .endPort }}
          endPort: {{ . | int64 }}
          {{- end }}
          protocol: {{ .protocol | default "TCP" }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- with $eg.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
