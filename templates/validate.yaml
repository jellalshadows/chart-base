{{- /*
Guards for rules values.schema.json cannot express. Renders nothing.
Every message is prefixed with "chart-base[<component>]:".
*/ -}}
{{- $component := include "chart-base.component" . -}}
{{- $fullname := include "chart-base.fullname" . -}}
{{- $dns1035 := "^[a-z]([-a-z0-9]*[a-z0-9])?$" -}}
{{- if not (regexMatch $dns1035 $component) -}}
{{- include "chart-base.fail" (list . (printf "alias %q must be lowercase kebab-case (%s)" $component $dns1035)) -}}
{{- end -}}
{{- if not (regexMatch $dns1035 $fullname) -}}
{{- include "chart-base.fail" (list . (printf "resource name %q (release-alias) must match %s" $fullname $dns1035)) -}}
{{- end -}}
{{- $maxLen := ternary 52 63 (eq .Values.workload.type "cronjob") -}}
{{- if gt (len $fullname) $maxLen -}}
{{- include "chart-base.fail" (list . (printf "resource name %q is %d chars, max is %d for workload.type %s" $fullname (len $fullname) $maxLen .Values.workload.type)) -}}
{{- end -}}
{{- if not (semverCompare ">=1.33.0-0" .Capabilities.KubeVersion.Version) -}}
{{- include "chart-base.fail" (list . (printf "Kubernetes >= 1.33 is required, got %s" .Capabilities.KubeVersion.Version)) -}}
{{- end -}}
{{- if and .Values.autoscaling.enabled (gt (int .Values.autoscaling.minReplicas) (int .Values.autoscaling.maxReplicas)) -}}
{{- include "chart-base.fail" (list . "autoscaling.minReplicas must be <= autoscaling.maxReplicas") -}}
{{- end -}}
{{- /* configFiles.mountPath is compared normalized (chart-base.cleanPath) and rendered as written, and checked whether or not a file is rendered. */ -}}
{{- $configMountPath := .Values.configFiles.mountPath -}}
{{- $configMount := include "chart-base.cleanPath" $configMountPath -}}
{{- if eq $configMount "/tmp" -}}
{{- include "chart-base.fail" (list . (printf "configFiles.mountPath must not be /tmp (an emptyDir is mounted there): %q is /tmp once normalized; choose another directory, such as the default /config" $configMountPath)) -}}
{{- end -}}
{{- if eq $configMount "/" -}}
{{- include "chart-base.fail" (list . (printf "configFiles.mountPath must not be / (%q is / once normalized): the ConfigMap would be mounted at the container's root; choose a directory, such as the default /config" $configMountPath)) -}}
{{- end -}}
{{- if and .Values.serviceAccount.automountToken (eq $configMount "/var/run/secrets/kubernetes.io/serviceaccount") -}}
{{- include "chart-base.fail" (list . (printf "configFiles.mountPath must not be /var/run/secrets/kubernetes.io/serviceaccount while serviceAccount.automountToken is true (%q is that directory once normalized): the ServiceAccount token is mounted there; choose another directory, or set serviceAccount.automountToken: false" $configMountPath)) -}}
{{- end -}}
{{- if and (eq .Values.workload.type "deployment") (ge (int .Values.preStopSleepSeconds) (int .Values.terminationGracePeriodSeconds)) (gt (int .Values.preStopSleepSeconds) 0) -}}
{{- include "chart-base.fail" (list . "preStopSleepSeconds must be lower than terminationGracePeriodSeconds") -}}
{{- end -}}
{{- if and (eq .Values.workload.type "deployment") (.Values.lifecycle | default dict).preStop (gt (int .Values.preStopSleepSeconds) 0) -}}
{{- include "chart-base.fail" (list . "lifecycle.preStop replaces the built-in preStop sleep: set preStopSleepSeconds: 0 (a container has one preStop hook)") -}}
{{- end -}}
{{- /* Same bound as the API server (validateSleepAction): a lifecycle sleep may last the whole grace period, not longer. */ -}}
{{- range $hook := list "postStart" "preStop" -}}
{{- with (get ($.Values.lifecycle | default dict) $hook) -}}
{{- if and .sleep (gt (int64 .sleep.seconds) (int64 $.Values.terminationGracePeriodSeconds)) -}}
{{- include "chart-base.fail" (list $ (printf "lifecycle.%s.sleep.seconds (%d) must not be greater than terminationGracePeriodSeconds (%d)" $hook (int64 .sleep.seconds) (int64 $.Values.terminationGracePeriodSeconds))) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and (eq .Values.workload.type "deployment") (not (kindIs "invalid" .Values.minReadySeconds)) (ge (int64 .Values.minReadySeconds) (int64 .Values.progressDeadlineSeconds)) -}}
{{- include "chart-base.fail" (list . "minReadySeconds must be lower than progressDeadlineSeconds") -}}
{{- end -}}
{{- /* Kubernetes rejects any rollingUpdate next to Recreate, an empty one included; rollingUpdate: null is absent. */ -}}
{{- $strategy := .Values.strategy | default dict -}}
{{- if and (eq ($strategy.type | default "") "Recreate") (not (kindIs "invalid" $strategy.rollingUpdate)) -}}
{{- include "chart-base.fail" (list . "strategy.rollingUpdate is set and strategy.type is Recreate, which Kubernetes rejects (an empty rollingUpdate too): remove strategy.rollingUpdate (from an override file over values that set it, write strategy: {type: Recreate, rollingUpdate: null}), or set strategy.type: RollingUpdate") -}}
{{- end -}}
{{- $rollingUpdate := (.Values.strategy | default dict).rollingUpdate | default dict -}}
{{- if and (eq .Values.workload.type "deployment") (hasKey $rollingUpdate "maxSurge") (hasKey $rollingUpdate "maxUnavailable") -}}
{{- /* Kubernetes rejects a rolling update that can neither add nor remove a pod; "0%" counts as 0. */ -}}
{{- $surge := $rollingUpdate.maxSurge -}}
{{- $unavailable := $rollingUpdate.maxUnavailable -}}
{{- if kindIs "string" $surge }}{{ $surge = trimSuffix "%" $surge | atoi }}{{ end -}}
{{- if kindIs "string" $unavailable }}{{ $unavailable = trimSuffix "%" $unavailable | atoi }}{{ end -}}
{{- if and (eq (int64 $surge) 0) (eq (int64 $unavailable) 0) -}}
{{- include "chart-base.fail" (list . "strategy.rollingUpdate.maxSurge and maxUnavailable cannot both be 0 (the rollout could not replace any pod)") -}}
{{- end -}}
{{- end -}}
{{- if .Values.metrics.enabled -}}
{{- /* Prometheus scrapes a port by NAME: a Service port (ServiceMonitor) or a container port (PodMonitor), both from ports. */ -}}
{{- $portNames := list -}}
{{- range .Values.ports }}{{ $portNames = append $portNames .name }}{{ end -}}
{{- if not (has .Values.metrics.port $portNames) -}}
{{- include "chart-base.fail" (list . (printf "metrics.port %q is not the name of an entry in ports: Prometheus scrapes a named port, so declare it in ports (a worker without a Service too), e.g. ports: [{name: metrics, containerPort: 9090}]" .Values.metrics.port)) -}}
{{- end -}}
{{- end -}}
{{- /* A main-container probe port given by NAME must be the name of an entry of ports, on every workload type. */ -}}
{{- $mainPortNames := list -}}
{{- range (.Values.ports | default list) }}{{ $mainPortNames = append $mainPortNames .name }}{{ end -}}
{{- include "chart-base.validateProbePorts" (dict "ctx" . "path" "probes" "probes" .Values.probes "portNames" $mainPortNames "portsPath" "ports") -}}
{{- if .Values.networkPolicy.enabled -}}
{{- $in := .Values.networkPolicy.ingress -}}
{{- $eg := .Values.networkPolicy.egress -}}
{{- if and .Values.metrics.enabled (not $in.metricsFromNamespaces) -}}
{{- include "chart-base.fail" (list . "networkPolicy.ingress.metricsFromNamespaces is empty, but metrics.enabled is true: the policy would block the scrapes; list the namespaces Prometheus runs in, e.g. [monitoring]") -}}
{{- end -}}
{{- if and $in.metricsFromNamespaces (not .Values.metrics.enabled) -}}
{{- include "chart-base.fail" (list . "networkPolicy.ingress.metricsFromNamespaces opens metrics.port, but metrics.enabled is false (metrics is for Deployments only): remove it, or enable metrics") -}}
{{- end -}}
{{- if and (or .Values.httpRoute.enabled .Values.ingress.enabled) (not $in.fromNamespaces) (not $in.extra) (not $in.routeTrafficAllowedElsewhere) -}}
{{- include "chart-base.fail" (list . "networkPolicy with httpRoute.enabled or ingress.enabled needs a source for the route's traffic: list the namespace of the Gateway's proxy pods (with Envoy Gateway's default mode, the namespace Envoy Gateway runs in, not the Gateway's) or of the ingress controller's pods in networkPolicy.ingress.fromNamespaces (or allow them in networkPolicy.ingress.extra), or set networkPolicy.ingress.routeTrafficAllowedElsewhere: true if a policy the chart cannot express allows the route's traffic (Cilium's Ingress or Gateway, a hostNetwork ingress controller); otherwise the component is unreachable") -}}
{{- end -}}
{{- if and $in.routeTrafficAllowedElsewhere (not .Values.httpRoute.enabled) (not .Values.ingress.enabled) -}}
{{- include "chart-base.fail" (list . "networkPolicy.ingress.routeTrafficAllowedElsewhere has no effect without a route: enable httpRoute or ingress, or remove it") -}}
{{- end -}}
{{- if and (or $in.fromComponents $in.fromNamespaces) (not .Values.ports) -}}
{{- include "chart-base.fail" (list . "networkPolicy.ingress.fromComponents and fromNamespaces open the entries of ports by name, but ports is empty: declare the ports, or allow the traffic in networkPolicy.ingress.extra") -}}
{{- end -}}
{{- /* A destination listed while egress is not isolated restricts nothing (a fail-open): fail instead of ignoring it. */ -}}
{{- if and (not $eg.enabled) (or $eg.toComponents $eg.toCIDRs $eg.extra $eg.dns.cidrs) -}}
{{- include "chart-base.fail" (list . "networkPolicy.egress.toComponents, toCIDRs, extra and dns.cidrs only apply with networkPolicy.egress.enabled: true, and egress is not isolated: set it, or clear the lists") -}}
{{- end -}}
{{- /* endPort >= port, as the API server requires (ValidateNetworkPolicyPort); a schema cannot compare two keys. Only what is rendered: the egress lists only with egress.enabled. */ -}}
{{- $portLists := list -}}
{{- range $i, $rule := $in.extra }}{{ $portLists = append $portLists (list (printf "ingress.extra[%d]" $i) $rule.ports) }}{{ end -}}
{{- if $eg.enabled -}}
{{- range $i, $c := $eg.toCIDRs }}{{ $portLists = append $portLists (list (printf "egress.toCIDRs[%d]" $i) $c.ports) }}{{ end -}}
{{- range $i, $rule := $eg.extra }}{{ $portLists = append $portLists (list (printf "egress.extra[%d]" $i) $rule.ports) }}{{ end -}}
{{- end -}}
{{- range $portList := $portLists -}}
{{- range $j, $p := index $portList 1 -}}
{{- if and (hasKey $p "endPort") (lt (int64 $p.endPort) (int64 $p.port)) -}}
{{- include "chart-base.fail" (list $ (printf "networkPolicy.%s.ports[%d]: endPort (%d) must not be lower than port (%d)" (index $portList 0) $j (int64 $p.endPort) (int64 $p.port))) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- /* The ServiceAccount: annotations only on the one the chart creates; default is not a name of its own; a name only for an existing one (the chart's own is always <fullname>). */ -}}
{{- if and (not .Values.serviceAccount.create) .Values.serviceAccount.annotations -}}
{{- include "chart-base.fail" (list . "serviceAccount.annotations apply only to the ServiceAccount the chart creates, and serviceAccount.create is false, so no ServiceAccount carries them: remove them from the values (an override file clears them with serviceAccount.annotations: null; an empty map is merged and clears nothing), or, when the pods run as an existing ServiceAccount (serviceAccount.name), have its owner set them on that ServiceAccount (a cloud identity's role, for example), or set serviceAccount.create: true (removing serviceAccount.name if it is set)") -}}
{{- end -}}
{{- if eq (.Values.serviceAccount.name | default "") "default" -}}
{{- include "chart-base.fail" (list . "serviceAccount.name: default is the namespace's default ServiceAccount, which every pod of the namespace without a ServiceAccount of its own runs as, and serviceAccount.create: false without a name already selects it: remove serviceAccount.name, or name a ServiceAccount of this component") -}}
{{- end -}}
{{- if and .Values.serviceAccount.create .Values.serviceAccount.name -}}
{{- include "chart-base.fail" (list . (printf "serviceAccount.name (%s) names an existing ServiceAccount, and serviceAccount.create is true, so the chart creates its own, always named %s: set serviceAccount.create: false to run the pods as %s, or remove serviceAccount.name" .Values.serviceAccount.name $fullname .Values.serviceAccount.name)) -}}
{{- end -}}
{{- /* RBAC: only for a ServiceAccount of the component (the chart's or serviceAccount.name, never the namespace's default); with a token, unless no ClusterRole is bound and use is the only verb of every rule; no rule whose resourceNames keep one of its verbs from applying, each rule judged on its own (deletecollection always; create on a resource unless the same rule grants patch or update); and not the ClusterRole cluster-admin. */ -}}
{{- $rbac := or .Values.rbac.rules .Values.rbac.clusterRoles -}}
{{- if and $rbac (not .Values.serviceAccount.create) (not .Values.serviceAccount.name) -}}
{{- include "chart-base.fail" (list . (printf "rbac.rules and rbac.clusterRoles would be bound to the namespace's default ServiceAccount (serviceAccount.create is false and serviceAccount.name is not set), so every pod of the namespace without a ServiceAccount of its own, other charts' pods included, would get them: set serviceAccount.create: true (the chart creates %s), or set serviceAccount.name to an existing ServiceAccount of this component" $fullname)) -}}
{{- end -}}
{{- /* A token is needed for what the pods themselves exercise: every ClusterRole (the chart does not know its rules) and every rule with a verb other than use (an admission plugin checks a use grant on the ServiceAccount itself, with or without a token). */ -}}
{{- $needsToken := not (empty .Values.rbac.clusterRoles) -}}
{{- range $rule := .Values.rbac.rules -}}
{{- if without $rule.verbs "use" -}}
{{- $needsToken = true -}}
{{- end -}}
{{- end -}}
{{- if and $needsToken (not .Values.serviceAccount.automountToken) -}}
{{- include "chart-base.fail" (list . "rbac.clusterRoles and the rbac.rules with a verb other than use are exercised by the pods with their ServiceAccount token, and serviceAccount.automountToken is false, so the pods get no token: set serviceAccount.automountToken: true, or remove them (a cloud identity such as IRSA or Workload Identity needs neither). Only a grant that an admission plugin checks on the ServiceAccount itself needs no token (use on an OpenShift SecurityContextConstraints, for example): write it in rbac.rules as a rule whose only verb is use") -}}
{{- end -}}
{{- /* With resourceNames, Kubernetes never matches deletecollection, and matches create on a resource only for a server-side apply (which also needs patch) or a create through an update (which also needs update), never for a plain create request (measured on kube-apiserver 1.33 and 1.37). Kubernetes authorizes a request against all the rules of a Role together, but each rule is checked here on its own: a create restricted by resourceNames fails when its own rule grants neither patch nor update, even when another rule grants one (repeating it in this rule changes nothing when that other rule covers the same objects). */ -}}
{{- range $i, $rule := .Values.rbac.rules -}}
{{- if $rule.resourceNames -}}
{{- if has "deletecollection" $rule.verbs -}}
{{- include "chart-base.fail" (list $ (printf "rbac.rules[%d]: deletecollection cannot be restricted by resourceNames, so this rule never allows it: move it to a rule without resourceNames, or remove it" $i)) -}}
{{- end -}}
{{- if and (has "create" $rule.verbs) (not (has "patch" $rule.verbs)) (not (has "update" $rule.verbs)) -}}
{{- range $resource := $rule.resources -}}
{{- if not (contains "/" $resource) -}}
{{- include "chart-base.fail" (list $ (printf "rbac.rules[%d]: create on %s is restricted by resourceNames, which Kubernetes matches only for a server-side apply (it also needs patch) or a create through an update (it also needs update), never for a plain create request, and this rule grants neither patch nor update (each rule is checked on its own): add patch or update to this rule if the component creates the object that way (repeating a verb that another rule already grants for the same objects changes nothing), move create to a rule without resourceNames, or remove it" $i $resource)) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if has "cluster-admin" .Values.rbac.clusterRoles -}}
{{- include "chart-base.fail" (list . "rbac.clusterRoles: cluster-admin is rejected: bound in the namespace, it allows every verb on every resource there, the * that rbac.rules rejects, and a deployer with only the namespace's admin rights cannot bind it: list the rules the component needs in rbac.rules, or bind a narrower ClusterRole such as view") -}}
{{- end -}}
{{- /* An ExternalSecret needs a source: externalSecret.data null (absent once Helm removes it), {} or empty fails here, with one message from every values layer. */ -}}
{{- if and .Values.externalSecret.enabled (empty (.Values.externalSecret.data | default dict)) -}}
{{- include "chart-base.fail" (list . "externalSecret.enabled is true and externalSecret.data has no entry: list at least one key in externalSecret.data, or set externalSecret.enabled: false (an override file cannot remove single keys that another values file defines, and data: {} removes nothing: maps are merged)") -}}
{{- end -}}

{{- if kindIs "slice" .Values.env -}}
{{- include "chart-base.fail" (list . "env is a map of NAME: {valueFrom: ...}, not a Kubernetes env list: literal values belong in config, references in env as a map") -}}
{{- end -}}
{{- range $name, $ref := .Values.env -}}
{{- if not (kindIs "map" $ref) -}}
{{- include "chart-base.fail" (list $ (printf "env.%s is a literal value: literal values belong in config; env only takes valueFrom references" $name)) -}}
{{- end -}}
{{- if or (hasKey (default dict $.Values.config) $name) (hasKey (default dict $.Values.externalSecret.data) $name) -}}
{{- include "chart-base.fail" (list $ (printf "env.%s duplicates a key of config or externalSecret.data: literal values belong in config, secrets in externalSecret, references in env" $name)) -}}
{{- end -}}
{{- end -}}

{{- /* volumes: every check reads chart-base.volumes, so a null entry and a null field are absent before any check. */ -}}
{{- $volumes := dict -}}
{{- include "chart-base.volumes" (dict "ctx" . "out" $volumes) -}}
{{- /* The name: a DNS-1123 label that chart-base does not reserve. The fields: those of the entry's type, and its required one set. */ -}}
{{- $typeFields := include "chart-base.volumeTypeFields" . | fromYaml -}}
{{- $requiredField := dict "configMap" "name" "secret" "secretName" "persistentVolumeClaim" "claimName" "ephemeral" "size" -}}
{{- range $name, $v := $volumes -}}
{{- if or (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $name)) (gt (len $name) 63) -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s: a volume name is a lowercase DNS-1123 label (a-z, 0-9, \"-\", at most 63 characters), e.g. app-data" $name)) -}}
{{- end -}}
{{- if has $name (list "tmp" "config-files" "external-secret") -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s: tmp, config-files and external-secret are the names of volumes chart-base mounts itself (external-secret from 0.9.0): choose another name" $name)) -}}
{{- end -}}
{{- if or (hasPrefix "kube-api-access-" $name) (hasPrefix "chart-base-" $name) -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s: a name that starts with kube-api-access- (Kubernetes takes such a volume for the ServiceAccount token volume) or chart-base- (reserved for volumes chart-base adds) is not allowed: choose another name" $name)) -}}
{{- end -}}
{{- $required := index $requiredField $v.type -}}
{{- if and $required (not (hasKey $v $required)) -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s.%s is null, and %s %s entry needs it: set it, or remove the entry with volumes.%s: null" $name $required (ternary "an" "a" (eq $v.type "ephemeral")) $v.type $name)) -}}
{{- end -}}
{{- $own := concat (list "type" "mountPath" "subPath" "readOnly") (index $typeFields $v.type) -}}
{{- range $field := keys $v | sortAlpha -}}
{{- if not (has $field $own) -}}
{{- $owners := list -}}
{{- range $t := keys $typeFields | sortAlpha }}{{ if has $field (index $typeFields $t) }}{{ $owners = append $owners $t }}{{ end }}{{ end -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s.%s is a field of type %s and the entry is %s: remove it (from an overlay, set it to null)" $name $field (join " or " $owners) $v.type)) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /* volumes: paths. A mount path is compared normalized (chart-base.cleanPath), with every mount the main container renders (chart-base.mainMounts); a relative path is checked as written. */ -}}
{{- $mounts := dict -}}
{{- include "chart-base.mainMounts" (dict "ctx" . "volumes" $volumes "out" $mounts) -}}
{{- range $name, $v := $volumes -}}
{{- $clean := include "chart-base.cleanPath" $v.mountPath -}}
{{- if eq $clean "/" -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s.mountPath %q is / once normalized: a volume cannot be mounted at the container's root; choose a directory" $name $v.mountPath)) -}}
{{- end -}}
{{- if eq $clean "/var/run/secrets/kubernetes.io/serviceaccount" -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s.mountPath %q is the ServiceAccount token directory /var/run/secrets/kubernetes.io/serviceaccount once normalized: a volume there replaces the token, whether or not serviceAccount.automountToken is true now; choose another directory" $name $v.mountPath)) -}}
{{- end -}}
{{- if and (hasKey $v "subPath") (or (hasPrefix "/" $v.subPath) (has ".." (splitList "/" $v.subPath))) -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s.subPath %q must be a relative path without a .. element: a path inside the volume, such as tls.crt" $name $v.subPath)) -}}
{{- end -}}
{{- $itemPaths := list -}}
{{- range $i, $item := $v.items | default list -}}
{{- if or (hasPrefix "/" $item.path) (has ".." (splitList "/" $item.path)) -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s.items[%d].path %q must be a relative path without a .. element: a file inside the volume, such as tls.crt" $name $i $item.path)) -}}
{{- end -}}
{{- $itemClean := include "chart-base.cleanPath" $item.path -}}
{{- range $seen := $itemPaths -}}
{{- if eq $seen.clean $itemClean -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s.items[%d].path %q names the same file as items[%d].path %q (%s within the volume, once normalized): the kubelet keeps only one of them; give each item a path of its own" $name $i $item.path $seen.index $seen.path $itemClean)) -}}
{{- end -}}
{{- end -}}
{{- $itemPaths = append $itemPaths (dict "index" $i "path" $item.path "clean" $itemClean) -}}
{{- end -}}
{{- end -}}
{{- range $i, $a := $mounts.rows -}}
{{- range $j, $b := $mounts.rows -}}
{{- if and (lt $j $i) (eq $a.clean $b.clean) -}}
{{- include "chart-base.fail" (list $ (printf "%s %q and %s %q are the same path once normalized (%s): each mount of the main container needs a path of its own; choose another directory (one beneath it, such as %s/cache, is allowed)" $a.owner $a.path $b.owner $b.path $a.clean $a.clean)) -}}
{{- end -}}
{{- /* A file (subPath) of a ConfigMap or Secret beneath another ConfigMap or Secret mount: its mount point would be created as a directory. */ -}}
{{- if and $a.file (has $a.source (list "configMap" "secret")) (has $b.source (list "configMap" "secret")) (ne $a.name $b.name) (hasPrefix (printf "%s/" $b.clean) $a.clean) -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s mounts one file (subPath) at %q, beneath %s %q, a ConfigMap or Secret mount: the kubelet creates that mount point as a directory inside the parent volume, and a file cannot be mounted on a directory. Mount the volume as a directory beneath it (without subPath, for example %s/secrets), or the file beside it" $a.name $a.path $b.owner $b.path $b.clean)) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /* volumes: the rules of each type (readOnly, a size of zero, medium Memory, the chart's own objects, one claim one entry). */ -}}
{{- $claims := dict -}}
{{- range $name, $v := $volumes -}}
{{- if and (has $v.type (list "configMap" "secret")) (hasKey $v "readOnly") (not $v.readOnly) -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s.readOnly is false, and a %s mount is always read-only (the kubelet forces it): remove readOnly" $name $v.type)) -}}
{{- end -}}
{{- if and (eq $v.type "persistentVolumeClaim") (eq ($v.claimAccessMode | default "ReadWriteOnce") "ReadOnlyMany") (hasKey $v "readOnly") (not $v.readOnly) -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s.readOnly is false, and the claim is declared ReadOnlyMany (claimAccessMode), so its mount is read-only: remove readOnly, or declare the claim's real access mode" $name)) -}}
{{- end -}}
{{- if and (has $v.type (list "emptyDir" "ephemeral")) (hasKey $v "readOnly") $v.readOnly -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s.readOnly is true on an %s volume: the main container is the only one that mounts it, so nothing could ever write it; remove readOnly" $name $v.type)) -}}
{{- end -}}
{{- range $field := list "sizeLimit" "size" -}}
{{- if and (hasKey $v $field) (not (regexMatch "^[0-9.]*[1-9]" (index $v $field))) -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s.%s is %q, a size of zero: %s; write a positive quantity, e.g. 1Gi" $name $field (index $v $field) (ternary "it limits nothing" "the claim would request no storage" (eq $field "sizeLimit")))) -}}
{{- end -}}
{{- end -}}
{{- if and (eq ($v.medium | default "") "Memory") (not (hasKey $v "sizeLimit")) -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s.medium is Memory and sizeLimit is not set: the files count against the container's memory limit, and the volume is capped at the smaller of the pod's memory limit and sizeLimit (without a memory limit, at sizeLimit); without both it could grow to the node's allocatable memory. Set sizeLimit, e.g. 256Mi" $name)) -}}
{{- end -}}
{{- if and (eq $v.type "configMap") (has $v.name (list (printf "%s-env" $fullname) (printf "%s-files" $fullname))) -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s.name %q is a ConfigMap of this component, which chart-base renders and rolls the pods on (or deletes when nothing fills it): mount the component's files with configFiles (at configFiles.mountPath) instead" $name $v.name)) -}}
{{- end -}}
{{- if and (eq $v.type "secret") (eq $v.secretName (printf "%s-secrets" $fullname)) -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s.secretName %q is the Secret of this component's ExternalSecret: its keys already reach the container as environment variables, env can reference one under another name with secretKeyRef, and mounting it as files comes with externalSecret.mountPath (0.9.0)" $name $v.secretName)) -}}
{{- end -}}
{{- if eq $v.type "persistentVolumeClaim" -}}
{{- if hasKey $claims $v.claimName -}}
{{- include "chart-base.fail" (list $ (printf "volumes.%s and volumes.%s both mount the claim %q: one claim is one volume (before Kubernetes 1.35 a pod with two volumes of one claim stays in ContainerCreating), and mounting it at a second path is not supported yet" (index $claims $v.claimName) $name $v.claimName)) -}}
{{- end -}}
{{- $_ := set $claims $v.claimName $name -}}
{{- end -}}
{{- end -}}
