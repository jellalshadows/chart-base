{{- /*
Guards for rules values.schema.json cannot express. Renders nothing.
Every message is prefixed with "chart-base[<component>]:".
*/ -}}
{{- $component := include "chart-base.component" . -}}
{{- $fullname := include "chart-base.fullname" . -}}
{{- $dns1035 := "^[a-z]([-a-z0-9]*[a-z0-9])?$" -}}
{{- if not (regexMatch $dns1035 $component) -}}
{{- include "chart-base.fail" (list . (printf "alias %q must be lowercase kebab-case (%s)" $component $dns1035)) -}}
{{- end -}}
{{- if not (regexMatch $dns1035 $fullname) -}}
{{- include "chart-base.fail" (list . (printf "resource name %q (release-alias) must match %s" $fullname $dns1035)) -}}
{{- end -}}
{{- $maxLen := ternary 52 63 (eq .Values.workload.type "cronjob") -}}
{{- if gt (len $fullname) $maxLen -}}
{{- include "chart-base.fail" (list . (printf "resource name %q is %d chars, max is %d for workload.type %s" $fullname (len $fullname) $maxLen .Values.workload.type)) -}}
{{- end -}}
{{- if not (semverCompare ">=1.33.0-0" .Capabilities.KubeVersion.Version) -}}
{{- include "chart-base.fail" (list . (printf "Kubernetes >= 1.33 is required, got %s" .Capabilities.KubeVersion.Version)) -}}
{{- end -}}
{{- if and .Values.autoscaling.enabled (gt (int .Values.autoscaling.minReplicas) (int .Values.autoscaling.maxReplicas)) -}}
{{- include "chart-base.fail" (list . "autoscaling.minReplicas must be <= autoscaling.maxReplicas") -}}
{{- end -}}
{{- if eq (trimSuffix "/" .Values.configFiles.mountPath) "/tmp" -}}
{{- include "chart-base.fail" (list . "configFiles.mountPath must not be /tmp (an emptyDir is mounted there)") -}}
{{- end -}}
{{- if and (eq .Values.workload.type "deployment") (ge (int .Values.preStopSleepSeconds) (int .Values.terminationGracePeriodSeconds)) (gt (int .Values.preStopSleepSeconds) 0) -}}
{{- include "chart-base.fail" (list . "preStopSleepSeconds must be lower than terminationGracePeriodSeconds") -}}
{{- end -}}
{{- if and (eq .Values.workload.type "deployment") (.Values.lifecycle | default dict).preStop (gt (int .Values.preStopSleepSeconds) 0) -}}
{{- include "chart-base.fail" (list . "lifecycle.preStop replaces the built-in preStop sleep: set preStopSleepSeconds: 0 (a container has one preStop hook)") -}}
{{- end -}}
{{- /* Same bound as the API server (validateSleepAction): a lifecycle sleep may last the whole grace period, not longer. */ -}}
{{- range $hook := list "postStart" "preStop" -}}
{{- with (get ($.Values.lifecycle | default dict) $hook) -}}
{{- if and .sleep (gt (int64 .sleep.seconds) (int64 $.Values.terminationGracePeriodSeconds)) -}}
{{- include "chart-base.fail" (list $ (printf "lifecycle.%s.sleep.seconds (%d) must not be greater than terminationGracePeriodSeconds (%d)" $hook (int64 .sleep.seconds) (int64 $.Values.terminationGracePeriodSeconds))) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and (eq .Values.workload.type "deployment") (not (kindIs "invalid" .Values.minReadySeconds)) (ge (int64 .Values.minReadySeconds) (int64 .Values.progressDeadlineSeconds)) -}}
{{- include "chart-base.fail" (list . "minReadySeconds must be lower than progressDeadlineSeconds") -}}
{{- end -}}
{{- $rollingUpdate := (.Values.strategy | default dict).rollingUpdate | default dict -}}
{{- if and (eq .Values.workload.type "deployment") (hasKey $rollingUpdate "maxSurge") (hasKey $rollingUpdate "maxUnavailable") -}}
{{- /* Kubernetes rejects a rolling update that can neither add nor remove a pod; "0%" counts as 0. */ -}}
{{- $surge := $rollingUpdate.maxSurge -}}
{{- $unavailable := $rollingUpdate.maxUnavailable -}}
{{- if kindIs "string" $surge }}{{ $surge = trimSuffix "%" $surge | atoi }}{{ end -}}
{{- if kindIs "string" $unavailable }}{{ $unavailable = trimSuffix "%" $unavailable | atoi }}{{ end -}}
{{- if and (eq (int64 $surge) 0) (eq (int64 $unavailable) 0) -}}
{{- include "chart-base.fail" (list . "strategy.rollingUpdate.maxSurge and maxUnavailable cannot both be 0 (the rollout could not replace any pod)") -}}
{{- end -}}
{{- end -}}
{{- if .Values.metrics.enabled -}}
{{- /* Prometheus scrapes a port by NAME: a Service port (ServiceMonitor) or a container port (PodMonitor), both from ports. */ -}}
{{- $portNames := list -}}
{{- range .Values.ports }}{{ $portNames = append $portNames .name }}{{ end -}}
{{- if not (has .Values.metrics.port $portNames) -}}
{{- include "chart-base.fail" (list . (printf "metrics.port %q is not the name of an entry in ports: Prometheus scrapes a named port, so declare it in ports (a worker without a Service too), e.g. ports: [{name: metrics, containerPort: 9090}]" .Values.metrics.port)) -}}
{{- end -}}
{{- end -}}
{{- if .Values.networkPolicy.enabled -}}
{{- $in := .Values.networkPolicy.ingress -}}
{{- $eg := .Values.networkPolicy.egress -}}
{{- if and .Values.metrics.enabled (not $in.metricsFromNamespaces) -}}
{{- include "chart-base.fail" (list . "networkPolicy.ingress.metricsFromNamespaces is empty, but metrics.enabled is true: the policy would block the scrapes; list the namespaces Prometheus runs in, e.g. [monitoring]") -}}
{{- end -}}
{{- if and $in.metricsFromNamespaces (not .Values.metrics.enabled) -}}
{{- include "chart-base.fail" (list . "networkPolicy.ingress.metricsFromNamespaces opens metrics.port, but metrics.enabled is false (metrics is for Deployments only): remove it, or enable metrics") -}}
{{- end -}}
{{- if and (or .Values.httpRoute.enabled .Values.ingress.enabled) (not $in.fromNamespaces) (not $in.extra) (not $in.routeTrafficAllowedElsewhere) -}}
{{- include "chart-base.fail" (list . "networkPolicy with httpRoute.enabled or ingress.enabled needs a source for the route's traffic: list the namespace of the Gateway's proxy pods (with Envoy Gateway's default mode, the namespace Envoy Gateway runs in, not the Gateway's) or of the ingress controller's pods in networkPolicy.ingress.fromNamespaces (or allow them in networkPolicy.ingress.extra), or set networkPolicy.ingress.routeTrafficAllowedElsewhere: true if a policy the chart cannot express allows the route's traffic (Cilium's Ingress or Gateway, a hostNetwork ingress controller); otherwise the component is unreachable") -}}
{{- end -}}
{{- if and $in.routeTrafficAllowedElsewhere (not .Values.httpRoute.enabled) (not .Values.ingress.enabled) -}}
{{- include "chart-base.fail" (list . "networkPolicy.ingress.routeTrafficAllowedElsewhere has no effect without a route: enable httpRoute or ingress, or remove it") -}}
{{- end -}}
{{- if and (or $in.fromComponents $in.fromNamespaces) (not .Values.ports) -}}
{{- include "chart-base.fail" (list . "networkPolicy.ingress.fromComponents and fromNamespaces open the entries of ports by name, but ports is empty: declare the ports, or allow the traffic in networkPolicy.ingress.extra") -}}
{{- end -}}
{{- /* A destination listed while egress is not isolated restricts nothing (a fail-open): fail instead of ignoring it. */ -}}
{{- if and (not $eg.enabled) (or $eg.toComponents $eg.toCIDRs $eg.extra $eg.dns.cidrs) -}}
{{- include "chart-base.fail" (list . "networkPolicy.egress.toComponents, toCIDRs, extra and dns.cidrs only apply with networkPolicy.egress.enabled: true, and egress is not isolated: set it, or clear the lists") -}}
{{- end -}}
{{- /* endPort >= port, as the API server requires (ValidateNetworkPolicyPort); a schema cannot compare two keys. Only what is rendered: the egress lists only with egress.enabled. */ -}}
{{- $portLists := list -}}
{{- range $i, $rule := $in.extra }}{{ $portLists = append $portLists (list (printf "ingress.extra[%d]" $i) $rule.ports) }}{{ end -}}
{{- if $eg.enabled -}}
{{- range $i, $c := $eg.toCIDRs }}{{ $portLists = append $portLists (list (printf "egress.toCIDRs[%d]" $i) $c.ports) }}{{ end -}}
{{- range $i, $rule := $eg.extra }}{{ $portLists = append $portLists (list (printf "egress.extra[%d]" $i) $rule.ports) }}{{ end -}}
{{- end -}}
{{- range $portList := $portLists -}}
{{- range $j, $p := index $portList 1 -}}
{{- if and (hasKey $p "endPort") (lt (int64 $p.endPort) (int64 $p.port)) -}}
{{- include "chart-base.fail" (list $ (printf "networkPolicy.%s.ports[%d]: endPort (%d) must not be lower than port (%d)" (index $portList 0) $j (int64 $p.endPort) (int64 $p.port))) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- /* The ServiceAccount: annotations only on the one the chart creates; default is not a name of its own. */ -}}
{{- if and (not .Values.serviceAccount.create) .Values.serviceAccount.annotations -}}
{{- include "chart-base.fail" (list . "serviceAccount.annotations apply only to the ServiceAccount the chart creates, and serviceAccount.create is false: the owner of an existing ServiceAccount sets its annotations (e.g. a cloud identity's role), so set them there and remove them from the values (an override file clears them with serviceAccount.annotations: null; an empty map is merged and clears nothing), or set serviceAccount.create: true") -}}
{{- end -}}
{{- if eq (.Values.serviceAccount.name | default "") "default" -}}
{{- include "chart-base.fail" (list . "serviceAccount.name: default is the namespace's default ServiceAccount, which every pod of the namespace without a ServiceAccount of its own runs as, and serviceAccount.create: false without a name already selects it: remove serviceAccount.name, or name a ServiceAccount of this component") -}}
{{- end -}}

{{- if kindIs "slice" .Values.env -}}
{{- include "chart-base.fail" (list . "env is a map of NAME: {valueFrom: ...}, not a Kubernetes env list: literal values belong in config, references in env as a map") -}}
{{- end -}}
{{- range $name, $ref := .Values.env -}}
{{- if not (kindIs "map" $ref) -}}
{{- include "chart-base.fail" (list $ (printf "env.%s is a literal value: literal values belong in config; env only takes valueFrom references" $name)) -}}
{{- end -}}
{{- if or (hasKey (default dict $.Values.config) $name) (hasKey (default dict $.Values.externalSecret.data) $name) -}}
{{- include "chart-base.fail" (list $ (printf "env.%s duplicates a key of config or externalSecret.data: literal values belong in config, secrets in externalSecret, references in env" $name)) -}}
{{- end -}}
{{- end -}}
