{{- if and (eq .Values.workload.type "deployment") .Values.metrics.enabled (not .Values.service.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "chart-base.fullname" . }}
  labels:
    {{- include "chart-base.labelsWith" (dict "ctx" . "labels" .Values.metrics.labels) | nindent 4 }}
  {{- with include "chart-base.annotations" (dict "ctx" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "chart-base.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    {{- include "chart-base.metricsEndpoint" . | nindent 4 }}
{{- end }}
