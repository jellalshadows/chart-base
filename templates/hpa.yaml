{{- if and (include "chart-base.longRunning" .) .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "chart-base.fullname" . }}
  labels:
    {{- include "chart-base.labels" . | nindent 4 }}
  {{- /* kedaHandover: the per-object map, so the annotation wins over the same key in commonAnnotations and renders once. KEDA's webhook skips an HPA that carries it (KEDA v2.21.0 apis/keda/v1alpha1/scaledobject_webhook.go). */}}
  {{- $handover := ternary (dict "validations.keda.sh/hpa-ownership" "false") nil (eq .Values.autoscaling.kedaHandover true) }}
  {{- with include "chart-base.annotations" (dict "ctx" . "object" $handover) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    {{- include "chart-base.scaleTargetRef" . | nindent 4 }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  {{- /* A non-empty autoscaling.metrics is the whole list, rendered as written (never switched to ContainerResource). Empty or null: the built-in targets, so spec.metrics is never empty (the API server would turn an empty list into CPU 80% without a word). */}}
  {{- $metrics := .Values.autoscaling.metrics | default list }}
  {{- if $metrics }}
  metrics:
    {{- toYaml $metrics | nindent 4 }}
  {{- else }}
  {{- /* With a sidecar the built-in targets measure the main container alone (ContainerResource); without one, the pod (Resource). */}}
  {{- $container := "" }}
  {{- if include "chart-base.hasSidecars" . }}{{ $container = include "chart-base.component" . }}{{ end }}
  metrics:
    {{- include "chart-base.utilizationMetric" (dict "name" "cpu" "percent" .Values.autoscaling.targetCPUUtilizationPercentage "container" $container) | nindent 4 }}
    {{- with .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- include "chart-base.utilizationMetric" (dict "name" "memory" "percent" . "container" $container) | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- /* spec.behavior as written without its nulls (the schema closes it at every level; a null direction or field is absent, ADR-0070); null, or every direction null, renders nothing and the API server's defaults apply. */}}
  {{- $behavior := deepCopy (.Values.autoscaling.behavior | default dict) }}
  {{- include "chart-base.pruneNulls" $behavior }}
  {{- with $behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
