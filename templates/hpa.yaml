{{- if and (eq .Values.workload.type "deployment") .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "chart-base.fullname" . }}
  labels:
    {{- include "chart-base.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "chart-base.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  {{- /* With a sidecar the built-in targets measure the main container alone (ContainerResource); without one, the pod (Resource). */}}
  {{- $container := "" }}
  {{- if include "chart-base.hasSidecars" . }}{{ $container = include "chart-base.component" . }}{{ end }}
  metrics:
    {{- include "chart-base.utilizationMetric" (dict "name" "cpu" "percent" .Values.autoscaling.targetCPUUtilizationPercentage "container" $container) | nindent 4 }}
    {{- with .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- include "chart-base.utilizationMetric" (dict "name" "memory" "percent" . "container" $container) | nindent 4 }}
    {{- end }}
{{- end }}
