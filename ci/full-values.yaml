# Every deployment feature at once (lint/template/snapshot + kind e2e).
image:
  repository: registry.k8s.io/e2e-test-images/agnhost
  tag: "2.66.1"
args: ["netexec", "--http-port=8080"]
ports:
  - name: http
    containerPort: 8080
    servicePort: 80
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
config:
  APP_MODE: api
  SPRING_CONFIG_ADDITIONAL_LOCATION: "optional:file:/config/"
  FEATURE_FLAG: true
  MAX_POOL: 20
configFiles:
  files:
    application.yaml:
      spring:
        datasource:
          url: jdbc:postgresql://db:5432/sales
          password: ${DB_PASSWORD}
    logback-spring.xml: |
      <configuration>
        <root level="INFO"/>
      </configuration>
env:
  POD_NAMESPACE:
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  SHARED_TOKEN:
    valueFrom:
      secretKeyRef:
        name: e2e-shared
        key: TOKEN
externalSecret:
  enabled: true
  secretStoreRef:
    kind: ClusterSecretStore
    name: fake
  data:
    DB_PASSWORD:
      key: /sales/db-password
probes:
  startup:
    httpGet:
      path: /healthz
      port: http
    failureThreshold: 30
    periodSeconds: 2
  readiness:
    httpGet:
      path: /healthz
      port: http
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetMemoryUtilizationPercentage: 80
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
minReadySeconds: 5
revisionHistoryLimit: 5
priorityClassName: e2e-high
dnsConfig:
  options:
    - name: ndots
      value: "2"
hostAliases:
  - ip: 10.20.30.40
    hostnames:
      - legacy-db.internal
httpRoute:
  enabled: true
  parentRefs:
    - name: platform-gw
      namespace: gateway
      sectionName: https
  hostnames:
    - sales.example.com
ingress:
  enabled: true
  className: internal
  hosts:
    - host: sales.internal.example.com
      paths:
        - path: /
          pathType: Prefix
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: sales@acme.iam.gserviceaccount.com
podAnnotations:
  example.com/team: vending
podLabels:
  example.com/tier: backend
metrics:
  enabled: true
  port: http
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: e2e
prometheusRule:
  enabled: true
  labels:
    release: e2e
  groups:
    - name: full-chart-base
      rules:
        - alert: FullChartBaseDown
          expr: up{job="full-chart-base"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.pod }} of the full scenario is down"

# One NetworkPolicy with every kind of rule: the API server must accept it (the e2e checks a few fields).
# In the e2e this isolates the full pods both ways, and the 10.0.0.0/8 ipBlock below matches kind's pod IPs:
# no e2e connectivity check may target `full` (it would pass or fail for the wrong reason).
networkPolicy:
  enabled: true
  ingress:
    fromComponents: [web]                    # a sibling alias; this release has none, so the peer selects no pod
    # Where the Gateway's proxy pods run (Envoy Gateway's default mode: its own namespace) and the ingress controller.
    fromNamespaces: [envoy-gateway-system, ingress-nginx]
    metricsFromNamespaces: [monitoring]      # Prometheus: only metrics.port
    extra:
      - from:
          - ipBlock:
              cidr: 10.0.0.0/8
              except: [10.1.0.0/16]
        ports:
          - port: http
  egress:
    enabled: true
    dns:
      cidrs: [169.254.20.10/32]              # NodeLocal DNSCache
    toComponents: [payments]
    toCIDRs:
      - cidr: 192.0.2.0/24                   # TEST-NET-1 (RFC 5737)
        except: [192.0.2.128/25]
        ports:
          - port: 5432
          - port: 8000
            endPort: 8100
    extra:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kafka
            podSelector:
              matchExpressions:
                - key: strimzi.io/kind
                  operator: In
                  values: [Kafka]
        ports:
          - port: 9092
            protocol: TCP
