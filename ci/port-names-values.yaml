# Port names that YAML 1.1 reads as booleans (lint/kubeconform/snapshot + kind e2e).
# Helm's client and kubeconform read the rendered manifests with YAML 1.1 rules, where a plain `on` is
# the boolean true, so the chart must quote every port NAME it renders. The only port is named `on` (a
# valid Kubernetes port name) and the Service, the Ingress backend and the ServiceMonitor endpoint refer
# to it by name. A values file must quote it too: an unquoted on is a boolean, which the schema rejects.
image:
  repository: registry.k8s.io/e2e-test-images/agnhost
  tag: "2.66.1"
args: ["netexec", "--http-port=8080"]
ports:
  - name: "on"
    containerPort: 8080
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
ingress:
  enabled: true
  className: internal
  hosts:
    - host: port-names.internal.example.com
      paths:
        - path: /
          pathType: Prefix
metrics:
  enabled: true
  port: "on"
