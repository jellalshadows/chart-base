# CronJob: every run starts fresh and reads the current ConfigMap.
workload:
  type: cronjob
image:
  repository: registry.k8s.io/e2e-test-images/agnhost
  tag: "2.66.1"
# The run checks config (ConfigMap), env references (fieldRef, resourceFieldRef) and an
# existing Secret injected with envFrom + prefix (the e2e creates Secret e2e-shared, TOKEN=abc).
# It also checks that service links are off: the e2e installs the deployment scenario (Service
# deployment-chart-base) before this one; only the variables of the `kubernetes` Service
# (KUBERNETES_SERVICE_HOST/_PORT) may be injected.
command:
  - sh
  - -c
  - >-
    test "$APP_MODE" = cleanup &&
    test -n "$POD_NAME" &&
    test "$MEMORY_MB" = 64 &&
    test "$SHARED_TOKEN" = abc &&
    test -n "$KUBERNETES_SERVICE_HOST" &&
    test -z "$DEPLOYMENT_CHART_BASE_SERVICE_HOST" &&
    echo ok &&
    echo "$POD_NAME" > /work/pod &&
    test ! -e /scratch/marker && touch /scratch/marker &&
    echo "$POD_NAME" >> /runs/pods.log && cat /runs/pods.log
# Volumes (the e2e creates the claim e2e-runs): an emptyDir; an existing claim shared by every run (each run appends its
# pod name to /runs/pods.log and prints the file); an ephemeral claim per pod (a run fails if its marker is already
# there, so a reused volume is caught).
volumes:
  work: {type: emptyDir, mountPath: /work}
  runs: {type: persistentVolumeClaim, mountPath: /runs, claimName: e2e-runs}
  scratch: {type: ephemeral, mountPath: /scratch, size: 64Mi}
ports: []
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi
config:
  APP_MODE: cleanup
env:
  POD_NAME:
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  MEMORY_MB:
    valueFrom:
      resourceFieldRef:
        resource: limits.memory
        divisor: 1Mi
envFrom:
  - secretRef:
      name: e2e-shared
    prefix: SHARED_
cronjob:
  schedule: "*/30 * * * *"
  timeZone: Europe/Madrid
