# Worker: Deployment without Service (e.g. a Kafka consumer), scraped through a PodMonitor.
image:
  repository: registry.k8s.io/e2e-test-images/agnhost
  tag: "2.66.1"
args: ["pause"]
# A named container port for the PodMonitor. Nothing listens on it: the e2e installs only the
# Prometheus Operator CRDs, so nothing scrapes it either.
ports:
  - name: metrics
    containerPort: 9090
service:
  enabled: false
resources:
  requests:
    cpu: 10m
    memory: 16Mi
config:
  APP_MODE: worker
lifecycle:
  postStart:
    exec:
      command: ["sh", "-c", "true"]
metrics:
  enabled: true
  port: metrics
  labels:
    release: e2e
# Not injected (envFrom: false): the Secret's only source is a dataFrom extract whose members are base64 text that
# External Secrets decodes; one key mounted as a file through items, the other read as a variable through
# externalSecretKeyRef (rendered as a secretKeyRef on worker-chart-base-secrets).
externalSecret:
  enabled: true
  secretStoreRef:
    kind: ClusterSecretStore
    name: fake
  envFrom: false
  dataFrom:
    - extract:
        key: /sales/certs
        decodingStrategy: Base64
  mountPath: /etc/certs
  items:
    - key: tls.crt
      path: tls/tls.crt
env:
  TLS_KEY:
    valueFrom:
      externalSecretKeyRef:
        key: tls.key
