# HTTP API: Service + probes. Also used by the kind e2e.
image:
  repository: registry.k8s.io/e2e-test-images/agnhost
  tag: "2.66.1"
args: ["netexec", "--http-port=8080"]
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
config:
  APP_MODE: api
probes:
  readiness:
    httpGet:
      path: /healthz
      port: http
  liveness:
    httpGet:
      path: /healthz
      port: http
