name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Re-publish an existing release tag (e.g. v0.1.0) whose publish job failed. Never overwrites."
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.0

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    permissions: {} # every write is done with the GitHub App token
    outputs:
      # release_created is EMPTY (not "false") when nothing was released: compare with == 'true'.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The ONLY job that publishes. Tags created by the App would trigger `on: push: tags`
  # workflows: never add one that publishes.
  publish:
    name: publish to ghcr.io
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout of the release tag
      packages: write # helm push to ghcr.io
      id-token: write # OIDC token to sign the provenance attestation
      attestations: write # store the attestation
    env:
      CHART: chart-base
      REPOSITORY: ${{ github.repository_owner }}/charts
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Resolve the version from the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z release tag"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Chart.yaml version must match the release
        run: |
          chart_version="$(yq '.version' Chart.yaml)"
          if [ "$chart_version" != "$VERSION" ]; then
            echo "::error::Chart.yaml version ${chart_version} != release ${VERSION}"
            exit 1
          fi
      - name: Refuse to overwrite an existing version (GHCR tags are mutable)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          token="$(curl -fsS -u "${ACTOR}:${GITHUB_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${REPOSITORY}/${CHART}:pull,push" | jq -r .token)"
          code="$(curl -s -o /dev/null -w '%{http_code}' -I \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${REPOSITORY}/${CHART}/manifests/${VERSION}")"
          case "$code" in
            404) echo "${CHART}:${VERSION} is not published yet" ;;
            200) echo "::error::${CHART}:${VERSION} already exists in ghcr.io; refusing to overwrite"; exit 1 ;;
            *) echo "::error::unexpected HTTP ${code} while checking ghcr.io"; exit 1 ;;
          esac
      - name: Package (reproducible)
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          helm package . --destination dist
          touch -d "@${SOURCE_DATE_EPOCH}" "dist/${CHART}-${VERSION}.tgz"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to ghcr.io
        id: push
        run: |
          out="$(helm push "dist/${CHART}-${VERSION}.tgz" "oci://ghcr.io/${REPOSITORY}" 2>&1)"
          echo "$out"
          digest="$(echo "$out" | awk '/^Digest:/ {print $2}')"
          if [ -z "$digest" ]; then
            echo "::error::helm push printed no digest"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.REPOSITORY }}/${{ env.CHART }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
