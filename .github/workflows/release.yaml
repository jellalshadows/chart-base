name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v0.1.0): publish it if its publish job failed, or only sign it if it is already published. Never overwrites."
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.0
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: v3.1.3

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    permissions: {} # every write is done with the GitHub App token
    outputs:
      # release_created is EMPTY (not "false") when nothing was released: compare with == 'true'.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The ONLY job that publishes (and signs). Tags created by the App would trigger `on: push: tags`
  # workflows: never add one that publishes.
  publish:
    name: publish to ghcr.io
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || inputs.tag != '') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout of the release tag
      packages: write # helm push and the cosign signature to ghcr.io
      id-token: write # OIDC token for the provenance attestation and the keyless signature
      attestations: write # store the attestation
    env:
      CHART: chart-base
      REPOSITORY: ${{ github.repository_owner }}/charts
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Resolve the version from the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z release tag"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Chart.yaml version must match the release
        run: |
          chart_version="$(yq '.version' Chart.yaml)"
          if [ "$chart_version" != "$VERSION" ]; then
            echo "::error::Chart.yaml version ${chart_version} != release ${VERSION}"
            exit 1
          fi
      - name: Refuse to overwrite an existing version (GHCR tags are mutable)
        id: guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          token="$(curl -fsS -u "${ACTOR}:${GITHUB_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${REPOSITORY}/${CHART}:pull,push" | jq -r .token)"
          # Headers go to RUNNER_TEMP: anything written to the workspace would end up in the package.
          headers="${RUNNER_TEMP}/manifest-headers.txt"
          code="$(curl -s -o /dev/null -D "$headers" -w '%{http_code}' -I \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${REPOSITORY}/${CHART}/manifests/${VERSION}")"
          case "$code" in
            404)
              echo "${CHART}:${VERSION} is not published yet"
              echo "mode=publish" >> "$GITHUB_OUTPUT"
              ;;
            200)
              if [ "$MANUAL" != true ]; then
                echo "::error::${CHART}:${VERSION} already exists in ghcr.io; refusing to overwrite"
                exit 1
              fi
              digest="$(tr -d '\r' < "$headers" | awk 'tolower($1) == "docker-content-digest:" {print $2}')"
              echo "${CHART}:${VERSION} is already published (${digest}): nothing is pushed, it is only signed"
              echo "mode=sign-only" >> "$GITHUB_OUTPUT"
              echo "digest=${digest}" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::unexpected HTTP ${code} while checking ghcr.io"; exit 1 ;;
          esac
      - name: Package (reproducible)
        if: steps.guard.outputs.mode == 'publish'
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          helm package . --destination dist
          touch -d "@${SOURCE_DATE_EPOCH}" "dist/${CHART}-${VERSION}.tgz"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to ghcr.io
        id: push
        if: steps.guard.outputs.mode == 'publish'
        run: |
          out="$(helm push "dist/${CHART}-${VERSION}.tgz" "oci://ghcr.io/${REPOSITORY}" 2>&1)" || { echo "$out"; echo "::error::helm push failed"; exit 1; }
          echo "$out"
          digest="$(echo "$out" | awk '/^Digest:/ {print $2}')"
          if [ -z "$digest" ]; then
            echo "::error::helm push printed no digest"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: steps.guard.outputs.mode == 'publish'
        with:
          subject-name: ghcr.io/${{ env.REPOSITORY }}/${{ env.CHART }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      # Keyless signature by digest, after the attestation: both append their Sigstore bundle to the
      # same referrers index (GHCR has no referrers API), so they must run one after the other.
      - name: Digest to sign
        id: target
        env:
          PUSHED: ${{ steps.push.outputs.digest }}
          EXISTING: ${{ steps.guard.outputs.digest }}
        run: |
          digest="${PUSHED:-$EXISTING}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no digest to sign (got '${digest}')"
            exit 1
          fi
          echo "ref=ghcr.io/${REPOSITORY}/${CHART}@${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign with cosign (keyless)
        env:
          REF: ${{ steps.target.outputs.ref }}
        run: cosign sign --yes "$REF"
      - name: The cosign signature verifies
        # `cosign verify` accepts any Sigstore bundle of the digest that verifies for the identity,
        # including the provenance attestation above, so the result is filtered by type.
        env:
          REF: ${{ steps.target.outputs.ref }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yaml@refs/heads/main
          ISSUER: https://token.actions.githubusercontent.com
          SIGNATURE_TYPE: https://sigstore.dev/cosign/sign/v1
        run: |
          out="$(cosign verify "$REF" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" --output json)"
          if ! jq -e --arg t "$SIGNATURE_TYPE" 'any(.[]; .critical.type == $t)' <<< "$out" > /dev/null; then
            echo "::error::${REF} has no cosign signature by ${IDENTITY} (found: $(jq -r '[.[].critical.type] | unique | join(", ")' <<< "$out"))"
            exit 1
          fi
          echo "${REF} is signed by ${IDENTITY}"
